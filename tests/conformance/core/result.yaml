tests:
- id: RES-map-transforms-ok-and-preserves-err
  category: result_direct
  title: map transforms Ok and preserves Err
  code: |
    fn main!() -> Res[Str, Str] {
      let ok0: Res[i64, Str] = Ok(2)
      let err0: Res[i64, Str] = Err("boom")
      let mapped_ok = ok0.map { |x| wrapping_add(x, 3) }
      let mapped_err = err0.map { |x| wrapping_add(x, 3) }
      let ok = (mapped_ok.is_ok()
        && mapped_ok.ok().unwrap_or(0) == 5
        && mapped_err.is_err()
        && mapped_err.err().unwrap_or("x") == "boom")
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RES-map-err-transforms-err-and-preserves-ok
  category: result_direct
  title: map_err transforms Err and preserves Ok
  code: |
    fn main!() -> Res[Str, Str] {
      let err0: Res[i64, Str] = Err("boom")
      let ok0: Res[i64, Str] = Ok(4)
      let mapped_err = err0.map_err { |e| concat([e, "!"]) }
      let mapped_ok = ok0.map_err { |e| concat([e, "!"]) }
      let ok = mapped_err.err().unwrap_or("x") == "boom!" && mapped_ok.ok().unwrap_or(0) == 4
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RES-or-else-and-unwrap-family-cover-ok-and-err
  category: result_direct
  title: or_else and unwrap family cover Ok and Err
  code: |
    fn main!() -> Res[Str, Str] {
      let err0: Res[i64, Str] = Err("missing")
      let recovered = err0.or_else { |_e| Ok(9) }
      let ok0: Res[i64, Str] = Ok(3)
      let kept = ok0.or_else { |_e| Ok(99) }

      let ok1: Res[i64, Str] = Ok(4)
      let err1: Res[i64, Str] = Err("fallback")
      let a = ok1.unwrap_or(0)
      let b = err1.unwrap_or(8)

      let ok2: Res[i64, Str] = Ok(5)
      let err2: Res[i64, Str] = Err("fallback")
      let c = ok2.unwrap_or_else { |_e| 0 }
      let d = err2.unwrap_or_else { |_e| 11 }

      let ok_recovered = recovered.ok().unwrap_or(0) == 9
      let ok_kept = kept.ok().unwrap_or(0) == 3
      let ok_unwrap = a == 4 && b == 8 && c == 5 && d == 11
      let ok = ok_recovered && ok_kept && ok_unwrap
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RES-ok-and-err-project-to-opt
  category: result_direct
  title: ok and err project to Opt
  code: |
    fn main!() -> Res[Str, Str] {
      let ok0: Res[i64, Str] = Ok(7)
      let err0: Res[i64, Str] = Err("no")
      let ok_opt = ok0.ok()
      let err_opt = err0.err()
      let ok = ok_opt.unwrap_or(0) == 7 && err_opt.unwrap_or("x") == "no"
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RES-and-then-chains-ok-and-short-circuits-err
  category: result_opt
  title: and_then chains Ok and short-circuits Err
  code: |
    fn main!() -> Res[Str, Str] {
      let ok_res = Ok(2).and_then { |x| Ok(wrapping_add(x, 3)) }
      let err_res: Res[i64, Str] = Err("boom").and_then { |x| Ok(wrapping_add(x, 3)) }
      let ok = ok_res.is_ok() && (ok_res.ok().unwrap_or(0) == 5) && err_res.is_err() && (err_res.err().unwrap_or("x") == "boom")
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RES-outside-result-block-is-forbidden
  category: result_opt
  title: '? outside result block is forbidden'
  code: |
    fn f() -> Res[i64, Str] = Ok(1)

    fn invalid() -> Res[i64, Str] {
      let x = f()?
      yield Ok(x)
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: Q_OUTSIDE_RESULT
      message_contains:
      - '?'
      - result
      data_keys: []
- id: RES-res-unwraps-ok
  category: result_opt
  title: Res ? unwraps Ok
  code: |
    fn f() -> Res[i64, Str] = Ok(7)

    fn main!() -> Res[Str, Str] =
      result {
        let x = f()?
        yield Ok(to_str(wrapping_add(x, 1)))
      }
  expect:
    value:
      kind: Ok
      repr: '"8"'
- id: RES-res-propagates-err
  category: result_opt
  title: Res ? propagates Err
  code: |
    fn f() -> Res[i64, Str] = Err("boom")

    fn main!() -> Res[Str, Str] =
      result {
        _ = f()?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: '"boom"'
- id: RES-error-union-allows-question-mark-from-member-errors
  category: result_opt
  title: error union allows question-mark propagation from member errors
  code: |
    import std::json::{parse_json, JsonError}
    import std::parse::{parse_i64, ParseError}

    fn main!() -> Res[Str, Union[ParseError, JsonError]] =
      result {
        let n = parse_i64("41")?
        _ = parse_json("{\"ok\":true}")?
        yield Ok(to_str(wrapping_add(n, 1)))
      }
  expect:
    value:
      kind: Ok
      repr: '"42"'
- id: RES-error-union-preserves-propagated-member-err-value
  category: result_opt
  title: error union preserves propagated member Err value
  code: |
    import std::json::JsonError
    import std::parse::{parse_i64, ParseError}

    fn main!() -> Res[Str, Union[JsonError, ParseError]] =
      result {
        _ = parse_i64("not-an-int")?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: ParseError
