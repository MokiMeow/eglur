- id: RES-error-union-err-constructor-accepts-member-payload
  category: result_opt
  title: error union Err constructor accepts member payload
  code: |
    import std::parse::ParseError

    fn main!() -> Res[Str, Str] {
      let e: Res[i64, Union[Str, ParseError]] = Err("boom")
      yield Ok(to_str(e.is_err()))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: RES-error-union-err-constructor-rejects-non-member-payload
  category: result_opt
  title: error union Err constructor rejects non-member payload
  code: |
    import std::parse::ParseError

    fn main!() -> Res[Str, Str] {
      let e: Res[i64, Union[Str, ParseError]] = Err(1)
      yield Ok("x")
    }
  expect:
    compile_error:
      code: CALL_ARG_TYPE_MISMATCH
      message_contains:
      - call
      - argument
      - type
      - mismatch
      data_keys:
      - reason
      - actual_type
      - parameter
      - expected_type
      data_equals:
        reason: parameter_type
- id: RES-question-mark-error-outside-declared-union-is-rejected
  category: result_opt
  title: question-mark error outside declared union is rejected
  code: |
    import std::json::JsonError
    import std::parse::parse_i64

    fn main!() -> Res[Str, JsonError] =
      result {
        _ = parse_i64("41")?
        yield Ok("unreachable")
      }
  expect:
    compile_error:
      code: RETURN_TYPE_MISMATCH
      message_contains:
      - return
      - type
      - mismatch
      data_keys:
      - expected_type
      - actual_type
- id: RES-opt-unwraps-some
  category: result_opt
  title: Opt ? unwraps Some
  code: |
    fn f() -> Opt[i64] = Some(2)

    fn main!() -> Res[Str, Str] =
      result {
        let o = result {
          let x = f()?
          yield Some(wrapping_add(x, 3))
        }
        let y = o.ok_or("none")?
        yield Ok(to_str(y))
      }
  expect:
    value:
      kind: Ok
      repr: '"5"'
- id: RES-opt-propagates-none
  category: result_opt
  title: Opt ? propagates None
  code: |
    fn f() -> Opt[i64] = None

    fn main!() -> Res[Str, Str] =
      result {
        let o = result {
          _ = f()?
          yield Some(99)
        }
        _ = o.ok_or("none")?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: '"none"'
- id: RES-mixing-res-and-opt-in-one-result-block-is-forbidden
  category: result_opt
  title: Mixing Res-? and Opt-? in one result block is forbidden
  code: |
    fn a() -> Res[i64, Str] = Ok(1)
    fn b() -> Opt[i64] = Some(2)

    fn main!() -> Res[Str, Str] =
      result {
        let x = a()?
        let y = b()?
        yield Ok(to_str(wrapping_add(x, y)))
      }
  expect:
    compile_error:
      code: RESULT_BLOCK_MIXED_KINDS
      message_contains:
      - Res
      - Opt
      - mixed
      data_keys: []
- id: RES-mix-allowed-with-explicit-conversion-opt-res
  category: result_opt
  title: Mix allowed with explicit conversion opt->res
  code: |
    fn a() -> Res[i64, Str] = Ok(1)
    fn b() -> Opt[i64] = Some(2)

    fn main!() -> Res[Str, Str] =
      result {
        let x = a()?
        let y = b().ok_or("none")?
        yield Ok(to_str(wrapping_add(x, y)))
      }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: RES-result-block-requires-explicit-yield
