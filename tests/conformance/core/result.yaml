- id: RES-mixing-remains-forbidden-even-when-res-and-opt-appear-in-different-if-branches
  category: result_opt
  title: mixing remains forbidden even when Res and Opt appear in different if branches
  code: |
    fn a() -> Res[i64, Str] = Ok(1)
    fn b() -> Opt[i64] = Some(2)

    fn main!() -> Res[Str, Str] =
      result {
        let y = if true { yield a()? } else { yield b()? }
        yield Ok(to_str(y))
      }
  expect:
    compile_error:
      code: RESULT_BLOCK_MIXED_KINDS
      message_contains:
      - Res
      - Opt
      - mixed
      data_keys: []
- id: RES-mixing-remains-forbidden-even-when-res-and-opt-appear-in-different-match-arms
  category: result_opt
  title: mixing remains forbidden even when Res and Opt appear in different match arms
  code: |
    fn a() -> Res[i64, Str] = Ok(1)
    fn b() -> Opt[i64] = Some(2)

    fn main!() -> Res[Str, Str] =
      result {
        let x = Some(0)
        let y = match x {
          Some(_) => a()?,
          None => b()?,
        }
        yield Ok(to_str(y))
      }
  expect:
    compile_error:
      code: RESULT_BLOCK_MIXED_KINDS
      message_contains:
      - Res
      - Opt
      - mixed
      data_keys: []
- id: RES-tap-ok-fires-only-on-ok-and-preserves-original-res
  category: result_opt
  title: tap_ok! fires only on Ok and preserves original Res
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      let after: Res[i64, Str] = Ok(7)
          .tap_ok! { |_| emit!("ok") }
          .tap_err! { |_| emit!("err") }

      let expected: Res[i64, Str] = Ok(7)
      yield Ok(to_str(after == expected))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
    side_effects:
    - ok
- id: RES-tap-err-fires-only-on-err-and-preserves-original-res
  category: result_opt
  title: tap_err! fires only on Err and preserves original Res
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      let after: Res[i64, Str] = Err("boom")
          .tap_ok! { |_| emit!("ok") }
          .tap_err! { |_| emit!("err") }

      let expected: Res[i64, Str] = Err("boom")
      yield Ok(to_str(after == expected))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
    side_effects:
    - err
- id: RES-never-ok-payload-question-mark-has-no-success-continuation
  category: result_opt
  title: Res Never E question mark can only propagate Err
  code: |
    fn fail() -> Res[Never, Str] = Err("boom")

    fn main!() -> Res[Str, Str] =
      result {
        _ = fail()?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: '"boom"'
- id: RES-never-error-payload-question-mark-has-no-err-edge
  category: result_opt
  title: Res T Never question mark follows only the Ok continuation
  code: |
    fn widen(value: Res[i64, Never]) -> Res[i64, Str] =
      result {
        let inner = value?
        yield Ok(inner)
      }

    fn main!() -> Res[Str, Str] {
      let widened = widen(Ok(7))
      yield Ok(to_str(widened.ok().unwrap_or(0)))
    }
  expect:
    value:
      kind: Ok
      repr: '"7"'
- id: RES-never-expression-does-not-waive-explicit-yield
  category: result_opt
  title: Never expression does not waive result block explicit yield
  code: |
    import std::test::abort!

    fn invalid!() -> Res[i64, Str] = result {
      abort!("RUNTIME_ABORT", "not executed")
    }

    fn main!() -> Res[Str, Str] = Ok("x")
  expect:
    compile_error:
      code: RESULT_MISSING_YIELD
      message_contains:
      - yield
      data_keys: []
- id: RES-never-final-yield-does-not-infer-result-family
  category: result_opt
  title: Never final yield does not infer a missing result family
  code: |
    import std::test::abort!

    fn main!() -> Res[Str, Str] {
      let unresolved = result {
        yield abort!("RUNTIME_ABORT", "not executed")
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: BINDING_TYPE_UNDETERMINED
      message_contains:
      - binding
      - type
      - initializer
      data_keys: []
