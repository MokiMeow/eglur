tests:
- id: LOP-while-loop-evaluates-condition-and-body-deterministically
  category: control_flow
  title: while loop evaluates condition and body deterministically
  code: |
    fn main!() -> Res[Str, Str] {
      let mut i = 0
      let mut s = 0
      while i < 3 {
        s = wrapping_add(s, i)
        i = wrapping_add(i, 1)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: LOP-for-in-follows-deterministic-sequence-encounter-order
  category: control_flow
  title: for-in follows deterministic sequence encounter order
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      for x in [2,1,3] {
        emit!(to_str(x))
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
    side_effects:
    - '2'
    - '1'
    - '3'
- id: LOP-while-condition-must-be-bool
  category: control_flow
  title: while condition must be Bool
  code: |
    fn main!() -> Res[Str, Str] {
      while 1 {
        _ = 0
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: LOOP_CONDITION_NOT_BOOL
      message_contains:
      - while
      - Bool
      - condition
      data_keys: []
- id: LOP-for-in-requires-iterable-sequence
  category: control_flow
  title: for-in requires iterable sequence
  code: |
    fn main!() -> Res[Str, Str] {
      for x in 1 {
        _ = x
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: FOR_ITERABLE_NOT_SEQUENCE
      message_contains:
      - for
      - in
      - sequence
      data_keys: []
- id: LOP-break-outside-loop-is-compile-error
  category: control_flow
  title: break outside loop is compile error
  code: |
    fn main!() -> Res[Str, Str] {
      break
      yield Ok("x")
    }
  expect:
    compile_error:
      code: BREAK_OUTSIDE_LOOP
      message_contains:
      - break
      - loop
      - outside
      data_keys: []
- id: LOP-break-inside-closure-cannot-target-outer-loop
  category: control_flow
  title: break inside closure cannot target outer loop
  code: |
    fn main!() -> Res[Str, Str] {
      while true {
        let f = { |x: i64|
          break
        }
        break
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: BREAK_OUTSIDE_LOOP
      message_contains:
      - break
      - loop
      - outside
      data_keys: []
- id: LOP-continue-outside-loop-is-compile-error
  category: control_flow
  title: continue outside loop is compile error
  code: |
    fn main!() -> Res[Str, Str] {
      continue
      yield Ok("x")
    }
  expect:
    compile_error:
      code: CONTINUE_OUTSIDE_LOOP
      message_contains:
      - continue
      - loop
      - outside
      data_keys: []
- id: LOP-continue-inside-closure-cannot-target-outer-loop
  category: control_flow
  title: continue inside closure cannot target outer loop
  code: |
    fn main!() -> Res[Str, Str] {
      while true {
        let f = { |x: i64|
          continue
        }
        break
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: CONTINUE_OUTSIDE_LOOP
      message_contains:
      - continue
      - loop
      - outside
      data_keys: []
- id: LOP-break-is-allowed-inside-while-loop
  category: control_flow
  title: break is allowed inside while loop
  code: |
    fn main!() -> Res[Str, Str] {
      while true {
        break
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LOP-break-and-continue-may-target-closure-local-loops
  category: control_flow
  title: break and continue may target closure-local loops
  code: |
    fn main!() -> Res[Str, Str] {
      let f = { |x: i64|
        let mut y = x
        while y < 2 {
          y = wrapping_add(y, 1)
          if y == 1 {
            continue
          }
          break
        }
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LOP-continue-is-allowed-inside-for-in-loop
  category: control_flow
  title: continue is allowed inside for-in loop
  code: |
    fn main!() -> Res[Str, Str] {
      for x in [1,2] {
        continue
        _ = x
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LOP-half-open-range-iteration-uses
  category: control_flow
  title: half-open range iteration uses ..
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 0 .. 3 {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: LOP-closed-range-iteration-uses
  category: control_flow
  title: closed range iteration uses ..=
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 0 ..= 3 {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"6"'
- id: LOP-while-does-not-accept-tri-condition-in-v0-1
  category: control_flow
  title: while does not accept Tri condition in v0.1
  code: |
    fn main!() -> Res[Str, Str] {
      while Tri::Unknown {
        break
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: LOOP_CONDITION_NOT_BOOL
      message_contains:
      - while
      - Bool
      - condition
      data_keys: []
- id: LOP-immutable-let-reassignment-in-zero-iteration-for-body-is-compile-time-error
  category: control_flow
  title: immutable let reassignment in zero-iteration for body is compile-time error
  code: |
    fn main!() -> Res[Str, Str] {
      let x = 0
      for i in 0 .. 0 {
        x = i
      }
      yield Ok(to_str(x))
    }
  expect:
    compile_error:
      code: IMMUTABLE_BINDING_ASSIGN
      message_contains:
      - immutable
      - assignment
      data_keys: []
- id: LOP-for-range-with-const-bounds-composes-with-let-mut-accumulation
  category: control_flow
  title: for range with const bounds composes with let mut accumulation
  code: |
    const START: i64 = 1
    const END: i64 = 4

    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in START..END {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"6"'
- id: LOP-for-plus-match-expression-composes-with-let-mut-accumulation
  category: control_flow
  title: for plus match expression composes with let mut accumulation
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 0 ..= 2 {
        let add = match i {
          0 => 1,
          1 => 2,
          _ => 3,
        }
        s = wrapping_add(s, add)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"6"'
- id: LOP-descending-half-open-range-executes-zero-iterations
  category: control_flow
  title: descending half-open range executes zero iterations
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 3 .. 1 {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"0"'
- id: LOP-descending-closed-range-executes-zero-iterations
  category: control_flow
  title: descending closed range executes zero iterations
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 3 ..= 1 {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"0"'
- id: LOP-range-bounds-are-evaluated-once-and-left-to-right-before-loop-body
  category: control_flow
  title: range bounds are evaluated once and left-to-right before loop body
  code: |
    import std::test::emit!

    fn lo!() -> i64 {
      emit!("lo")
      yield 1
    }

    fn hi!() -> i64 {
      emit!("hi")
      yield 3
    }

    fn main!() -> Res[Str, Str] {
      for i in lo!()..hi!() {
        emit!(to_str(i))
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
    side_effects:
    - lo
    - hi
    - '1'
    - '2'
- id: LOP-break-in-nested-loops-exits-innermost-loop-only
  category: control_flow
  title: break in nested loops exits innermost loop only
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      for i in 0 .. 2 {
        for j in 0 .. 3 {
          emit!(f"{i}:{j}")
          break
        }
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
    side_effects:
    - '0:0'
    - '1:0'
- id: LOP-continue-in-nested-loops-targets-innermost-loop-only
  category: control_flow
  title: continue in nested loops targets innermost loop only
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      for i in 0 .. 2 {
        for j in 0 .. 2 {
          if j == 0 {
            continue
          }
          emit!(f"{i}:{j}")
        }
      }
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
    side_effects:
    - '0:1'
    - '1:1'
- id: LOP-immutable-field-assignment-in-zero-iteration-loop-body-is-rejected
  category: control_flow
  title: immutable field assignment in zero-iteration loop body is rejected
  code: |
    struct Counter {
      field n: i64
    }

    fn main!() -> Res[Str, Str] {
      let mut c = Counter{ n: 0 }
      for i in 0 .. 0 {
        c.n = i
      }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: IMMUTABLE_BINDING_ASSIGN
      message_contains:
      - immutable
      - assignment
      data_keys: []
