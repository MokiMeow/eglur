- id: TRT-prelude-ord-method-defines-relational-operators
  category: traits
  title: prelude Ord method defines relational operators
  code: |
    struct Priority {
      field rank: i64
    }

    impl Eq for Priority {
      fn eq(self: &Self, other: &Self) -> Bool = self.rank == other.rank
    }

    impl Ord for Priority {
      fn cmp(self: &Self, other: &Self) -> Ordering =
        Ord.cmp(&other.rank, &self.rank)
    }

    fn main!() -> Res[Str, Str] {
      let high = Priority{ rank: 10 }
      let low = Priority{ rank: 1 }
      let same = Priority{ rank: 10 }
      yield Ok(to_str((high < low) && (high <= same) && (low > high)))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
