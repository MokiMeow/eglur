- id: TRT-resolve-conflict-with-fully-qualified-call
  category: traits
  title: Resolve conflict with fully qualified call
  code: |
    trait A { fn f(self: &Self) -> i64 = 1 }
    trait B { fn f(self: &Self) -> i64 = 2 }

    struct C {}
    impl A for C {}
    impl B for C {}

    fn g(c: &C) -> i64 = wrapping_add(A.f(c), B.f(c))
    fn main!() -> Res[Str, Str] { yield Ok(to_str(g(&C{}))) }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: TRT-qualified-trait-method-is-a-callable-reference-under-expected-fn
  category: traits
  title: Qualified trait method is a callable reference under expected Fn
  code: |
    trait Rank {
      fn rank(self: &Self) -> Nat
    }

    struct Count {}

    impl Rank for Count {
      fn rank(self: &Self) -> Nat = 1
    }

    fn invoke(value: &Count, ranker: Fn(&Count) -> Nat) -> Nat = ranker(value)

    fn main!() -> Res[Str, Str] {
      let value = Count{}
      yield Ok(to_str(invoke(&value, Rank.rank)))
    }
  expect:
    value:
      kind: Ok
      repr: '"1"'
- id: TRT-concrete-alias-does-not-qualify-trait-impl-method
  category: traits
  title: concrete alias does not expose an implemented trait method as inherent
  code: |
    trait Rank { fn rank(self: &Self) -> i64 }
    struct Count {}
    type Alias = Count
    impl Rank for Count { fn rank(self: &Self) -> i64 = 1 }

    fn wrong(value: &Alias) -> i64 = Alias.rank(value)
    fn main!() -> Res[Str, Str] { yield Ok("unreachable") }
  expect:
    compile_error:
      code: METHOD_NOT_FOUND
      message_contains: []
      data_keys: []
- id: TRT-trait-method-ness-cannot-be-changed-by-impl
  category: traits
  title: Trait method !-ness cannot be changed by impl
  code: |
    trait T { fn push!(self: &mut Self, x: i64) -> Unit }
    struct C {}

    impl T for C {
      fn push(self: &mut Self, x: i64) -> Unit {}
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: TRAIT_EFFECT_MISMATCH
      message_contains:
      - must match
      data_keys:
      - trait
      - method
      - expected_signature
      - actual_signature
      data_equals:
        trait: T
        method: "push!"
        expected_signature: "fn push!(self: &mut Self, x: i64) -> Unit"
        actual_signature: "fn push(self: &mut Self, x: i64) -> Unit"
