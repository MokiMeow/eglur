tests:
- id: TRT-no-implementation-inheritance
  category: traits
  title: No implementation inheritance
  code: |
    struct A {}
    struct B : A {}

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: INHERITANCE_FORBIDDEN
      message_contains:
      - inheritance
      - forbidden
      data_keys: []
- id: TRT-trait-cannot-declare-field-members
  category: traits
  title: Trait cannot declare field members
  code: |
    trait T {
      field mut n: i64
      fn f(self: &Self) -> i64
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: TRAIT_STATE_FORBIDDEN
      message_contains:
      - trait
      - state
      data_keys: []
- id: TRT-trait-cannot-declare-property-members
  category: traits
  title: Trait cannot declare property members
  code: |
    trait T {
      prop count: i64 {
        fn get_count(self: &Self) -> i64 = 0
      }

      fn f(self: &Self) -> i64
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: TRAIT_STATE_FORBIDDEN
      message_contains:
      - trait
      - state
      data_keys: []
- id: TRT-default-body-assumes-exact-current-trait-through-generic-helper
  category: traits
  title: Default body assumes exact current trait through generic helper
  code: |
    trait Summary {
      type Output
      fn author(self: &Self) -> Self::Output
      fn summary(self: &Self) -> Self::Output = summarize_current(self)
    }

    fn summarize_current[T: Summary](value: &T) -> T::Output = value.author()

    struct Report {}

    impl Summary for Report {
      type Output = Str
      fn author(self: &Self) -> Self::Output = "Ada"
    }

    fn main!() -> Res[Str, Str] {
      let report = Report{}
      yield Ok(report.summary())
    }
  expect:
    value:
      kind: Ok
      repr: '"Ada"'
- id: TRT-default-body-member-signatures-allow-mutual-references
  category: traits
  title: Default body member signatures allow mutual references
  code: |
    trait MutualDefaults {
      fn left(self: &Self) -> i64 = self.right()
      fn right(self: &Self) -> i64 = self.left()
    }

    struct Token {}
    impl MutualDefaults for Token {}

    fn main!() -> Res[Str, Str] {
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: TRT-default-body-requires-explicit-unrelated-trait-assumption
  category: traits
  title: Default body requires explicit unrelated trait assumption
  code: |
    trait Render {
      fn render(self: &Self) -> Str
    }

    fn render_current[T: Render](value: &T) -> Str = value.render()

    trait Summary {
      fn summary(self: &Self) -> Str = render_current(self) // @primary unrelated-default-bound
    }

    struct Report {}
    impl Summary for Report {
      fn summary(self: &Self) -> Str = "override"
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: TRAIT_BOUND_NOT_SATISFIED
      message_contains:
      - trait
      - bound
      - not satisfied
      data_keys:
      - trait
      - type
      primary_span:
        marker: unrelated-default-bound
- id: TRT-default-body-current-trait-assumption-requires-exact-trait-arguments
  category: traits
  title: Default body current-trait assumption requires exact trait arguments
  code: |
    trait Rel[A] {
      fn value(self: &Self) -> i64
      fn mismatched(self: &Self) -> i64 = read_rel::[Str, Self](self) // @primary mismatched-default-bound
    }

    fn read_rel[A, T: Rel[A]](value: &T) -> i64 = value.value()

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: TRAIT_BOUND_NOT_SATISFIED
      message_contains:
      - trait
      - bound
      - not satisfied
      data_keys:
      - trait
      - type
      primary_span:
        marker: mismatched-default-bound
- id: TRT-default-body-rejects-recursive-external-obligation
  category: traits
  title: Default body rejects recursive external obligation
  code: |
    trait Loop {}
    impl[T: Loop] Loop for T {}

    fn require_loop[T: Loop](_value: &T) -> i64 = 1

    trait UsesLoop {
      fn value(self: &Self) -> i64 = require_loop(self) // @primary recursive-default-bound
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: TRAIT_BOUND_NOT_SATISFIED
      message_contains:
      - trait
      - bound
      - not satisfied
      data_keys:
      - trait
      - type
      primary_span:
        marker: recursive-default-bound
- id: TRT-default-method-conflict-is-compile-error
  category: traits
  title: Default method conflict is compile error
  code: |
    trait A { fn f(self: &Self) -> i64 = 1 }
    trait B { fn f(self: &Self) -> i64 = 2 }

    struct C {}
    impl A for C {}
    impl B for C {}

    fn g(c: &C) -> i64 = c.f()
    fn main!() -> Res[Str, Str] { yield Ok(to_str(g(&C{}))) }
  expect:
    compile_error:
      code: TRAIT_METHOD_AMBIGUOUS
      message_contains:
      - fully qualified
      data_keys: []
- id: TRT-required-method-conflict-is-compile-error
  category: traits
  title: Required method conflict is compile error
  code: |
