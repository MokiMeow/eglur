- id: TRT-explicit-bounds-and-associated-types-preserve-carrier-and-result-types
  category: traits
  title: explicit bounds and associated types preserve carrier and result types
  code: |
    closed trait Readable {
      type Elem
      fn read(self: &Self) -> Self::Elem
    }

    struct Count {
      field value: i64
    }

    impl Readable for Count {
      type Elem = i64
      fn read(self: &Self) -> i64 = self.value
    }

    fn project[C: Readable](x: C) -> C::Elem = x.read()
    fn identity[C: Readable](x: C) -> C = x
    fn closed(x: i64) -> i64 = x

    fn main!() -> Res[Str, Str] {
      let same = identity(Count { value: 7 })
      let inferred = project(same)
      let explicit = project::[Count](Count { value: 8 })
      yield Ok(to_str(closed(wrapping_add(inferred, explicit))))
    }
  expect:
    value:
      kind: Ok
      repr: '"15"'
