    trait B { fn f(self: &Self) -> i64 }

    struct C {}

    impl A for C {
      fn f(self: &Self) -> i64 = 1
    }

    impl B for C {
      fn f(self: &Self) -> i64 = 2
    }

    fn g(c: &C) -> i64 = c.f()
    fn main!() -> Res[Str, Str] { yield Ok(to_str(g(&C{}))) }
  expect:
    compile_error:
