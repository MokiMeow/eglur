- id: PRS-integer-parsers-reject-non-interior-separators
  category: parse
  title: integer parsers reject non-interior separators
  code: |
    import std::parse::parse_i64

    fn main!() -> Res[Str, Str] {
      let leading = parse_i64("_9")
      let consecutive = parse_i64("9__0")
      let trailing = parse_i64("9_")
      yield Ok(to_str(leading.is_err() && consecutive.is_err() && trailing.is_err()))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

