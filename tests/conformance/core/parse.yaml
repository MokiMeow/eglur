# Suite: core/parse.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - parse_* helpers are pure and expose failures via value channel (`Res::Err`).

tests:
- id: PRS-parse-i8-accepts-canonical-signed-decimal-text
  category: parse
  title: parse_i8 accepts canonical signed decimal text
  code: |
    import std::parse::{parse_i8, ParseError}

    fn main!() -> Res[Str, ParseError] =
      result {
        _ = parse_i8("-128")?
        _ = parse_i8("127")?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: PRS-parse-i8-rejects-out-of-range-integer-text-in-value-channel
  category: parse
  title: parse_i8 rejects out-of-range integer text in value channel
  code: |
    import std::parse::{parse_i8, ParseError}

    fn main!() -> Res[Str, ParseError] =
      result {
        _ = parse_i8("128")?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: ParseError

