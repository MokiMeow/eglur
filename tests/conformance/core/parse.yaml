- id: PRS-parse-f32-rejects-separators-at-component-boundaries
  category: parse
  title: parse_f32 rejects separators at component boundaries
  code: |
    import std::parse::parse_f32

    fn main!() -> Res[Str, Str] {
      let leading = parse_f32("_1.0")
      let before_point = parse_f32("1_.0")
      let after_point = parse_f32("1._0")
      let before_exponent = parse_f32("1.0_e1")
      let after_exponent = parse_f32("1.0e_1")
      let trailing = parse_f32("1.0e1_")
      let rejected = leading.is_err() &&
        before_point.is_err() &&
        after_point.is_err() &&
        before_exponent.is_err() &&
        after_exponent.is_err() &&
        trailing.is_err()
      yield Ok(to_str(rejected))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

