# Suite: core/network.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - std::net failures are value-channel `Res::Err` outcomes in baseline paths.

tests:
- id: NET-parse-net-addr-accepts-canonical-ipv4-host-port-text
  category: network
  title: parse_net_addr accepts canonical IPv4 host port text
  code: |
    import std::net::parse_net_addr

    fn main!() -> Res[Str, Str] {
      let a = parse_net_addr("127.0.0.1:0")
      let b = parse_net_addr("192.168.1.10:65535")
      yield Ok(to_str(a.is_ok() && b.is_ok()))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

