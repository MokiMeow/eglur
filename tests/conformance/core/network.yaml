- id: NET-error-kind-and-display-cover-portable-categories
  category: network
  title: NetError kind and Display cover every portable category
  code: |
    import std::net::{NetErrorKind, parse_net_addr}

    fn main!() -> Res[Str, Str] {
      let labels = concat([
        NetErrorKind::InvalidAddress.to_str(), "|",
        NetErrorKind::AddressInUse.to_str(), "|",
        NetErrorKind::AddressUnavailable.to_str(), "|",
        NetErrorKind::PermissionDenied.to_str(), "|",
        NetErrorKind::ConnectionRefused.to_str(), "|",
        NetErrorKind::ConnectionReset.to_str(), "|",
        NetErrorKind::ConnectionAborted.to_str(), "|",
        NetErrorKind::NotConnected.to_str(), "|",
        NetErrorKind::Unreachable.to_str(), "|",
        NetErrorKind::BrokenPipe.to_str(), "|",
        NetErrorKind::Interrupted.to_str(), "|",
        NetErrorKind::TimedOut.to_str(), "|",
        NetErrorKind::ResourceExhausted.to_str(), "|",
        NetErrorKind::Unsupported.to_str(), "|",
        NetErrorKind::Other.to_str()
      ])
      let labels_ok = labels == "invalid address|address in use|address unavailable|permission denied|connection refused|connection reset|connection aborted|not connected|unreachable|broken pipe|interrupted|timed out|resource exhausted|unsupported|other"
      let error_ok = match parse_net_addr("not-an-address") {
        Err(error) => (error.kind() == NetErrorKind::InvalidAddress) &&
          (error.kind().to_str() == "invalid address") &&
          (error.to_str() == "network error: invalid address")
        Ok(_) => false
      }
      yield Ok(to_str(labels_ok && error_ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: NET-non-bang-function-cannot-call-tcp-connect
  category: network
  title: non-bang function cannot call tcp_connect!
  code: |
    import std::net::{NetAddr, NetError, TcpStream, tcp_connect!}

    fn f(addr: NetAddr) -> Res[Own[TcpStream], NetError] = tcp_connect!(addr)

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: EFFECT_VIOLATION
      message_contains: []
      message_contains_any:
      - - non-bang
        - Fn
        - pure
      data_keys: []

- id: NET-tcp-bind-supports-loopback-port-zero-and-consuming-close
  category: network
  title: tcp_bind! supports loopback port zero and consuming close
  code: |
    import std::net::{parse_net_addr, tcp_bind!}

    fn main!() -> Res[Str, Str] =
      result {
        let addr = parse_net_addr("127.0.0.1:0").map_err { |_| "addr" }?
        let listener = tcp_bind!(addr).map_err { |_| "bind" }?
        _ = listener.local_addr()
        _ = (move listener).close!().map_err { |_| "close" }?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: NET-with-tcp-stream-connect-failure-is-value-channel-err-without-callback
  category: network
  title: with_tcp_stream! maps connect failure to Primary without callback
  code: |
    import std::net::{parse_net_addr, with_tcp_stream!, NetError}
    import std::test::emit!

    fn main!() -> Res[Str, NetError] =
      result {
        let addr = parse_net_addr("127.0.0.1:0")?
        let outcome = with_tcp_stream!(addr) { |_stream|
          result {
            emit!("unexpected-callback")
            yield Ok("unexpected")
          }
        }
        let observed = match outcome {
          Err(ScopedFailure::Primary(_)) => true,
          Err(ScopedFailure::PrimaryAndClose { .. }) => false,
          Ok(_) => false,
        }
        yield Ok(to_str(observed))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
    side_effects: []

- id: NET-direct-tcp-connect-failure-discharges-conditional-root-by-match
  category: network
  title: direct tcp_connect! failure discharges conditional root by match
  code: |
    import std::net::{parse_net_addr, tcp_connect!, NetError}

    fn main!() -> Res[Str, NetError] =
      result {
        let addr = parse_net_addr("127.0.0.1:0")?
        let attempt = tcp_connect!(addr)
        yield match move attempt {
          Ok(stream) => {
            _ = (move stream).close!()?
            yield Ok("unexpected")
          }
          Err(error) => Err(error)
        }
      }
  expect:
    value:
      kind: Err
      repr: NetError

