- id: ATR-test-runner-reports-package-discovery-order-and-ignore-state
  category: attributes
  title: test runner reports package discovery order and ignore state
  mode: package
  runner: test
  files:
    Eglur.toml: |
      [package]
      name = "app"
      version = "0.1.0"
    Eglur.lock: |
      version = 1
      root = "$root"

      [[packages]]
      node = "$root"
      name = "app"
      version = "0.1.0"
      source = "root"
    src/a_first.eglur: |
      module a_first

      #[test]
      fn alpha() -> Unit {}

      #[ignore]
      #[test]
      fn ignored() -> Unit {}
    src/b_second.eglur: |
      module b_second

      #[test]
      fn beta() -> Unit {}
  entry: src/a_first.eglur
  expect:
    test_run:
      order:
      - module: a_first
        name: alpha
      - module: a_first
        name: ignored
      - module: b_second
        name: beta
      passed:
      - module: a_first
        name: alpha
      - module: b_second
        name: beta
      skipped:
      - module: a_first
        name: ignored
      failed: []

