- id: ATR-built-in-debug-clone-order-default-derive-set-is-accepted
  category: attributes
  title: built-in debug/clone/order/default derive set is accepted
  code: |
    #[derive(Debug, Clone, Eq, Hash, Ord, Default)]
    struct S {
