tests:
- id: ATR-non-derive-attribute-is-parse-valid-but-semantically-unsupported
  category: attributes
  title: non-derive attribute is parse-valid but semantically unsupported
  code: |
    #[meta::custom(flag = true, mode::fast(3), key = foo::bar)]
    struct S {
      field x: i64
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: ATTRIBUTE_UNSUPPORTED
      message_contains:
      - attribute
      - unsupported
      data_keys: []
- id: ATR-derive-on-fn-target-is-unsupported-in-v0-1
  category: attributes
  title: derive on fn target is unsupported in v0.1
  code: |
    #[derive(LocalTrait)]
    fn f() -> i64 = 1

    trait LocalTrait {
      fn show(self: &Self) -> Str
    }

    fn main!() -> Res[Str, Str] {
      yield Ok(to_str(f()))
    }
  expect:
    compile_error:
      code: DERIVE_TARGET_UNSUPPORTED
      message_contains:
      - derive
      - target
      - struct
      - enum
      data_keys: []
- id: ATR-duplicate-derive-entry-is-rejected
  category: attributes
  title: duplicate derive entry is rejected
  code: |
    trait LocalTrait {
      fn show(self: &Self) -> Str
    }

    #[derive(LocalTrait, LocalTrait)]
    struct S {
      field x: i64
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: DERIVE_DUPLICATE_ENTRY
      message_contains:
      - derive
      - duplicate
      - trait
      data_keys: []
- id: ATR-repeated-derive-attributes-remain-distinct-coherence-candidates
  category: attributes
  title: repeated derive attributes remain distinct candidates for duplicate impl checking
  code: |
    #[derive(Eq)]
    #[derive(Eq)]
    struct S {
      field x: i64
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: TRAIT_IMPL_DUPLICATE
      message_contains:
      - impl
      - duplicate
      data_keys: []
- id: ATR-derive-path-must-resolve-to-trait-symbol
  category: attributes
  title: derive path must resolve to trait symbol
  code: |
    struct NotTrait {}

    #[derive(NotTrait)]
    struct S {
      field x: i64
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: DERIVE_TRAIT_RESOLUTION_FAILED
      message_contains:
      - derive
      - trait
      - resolve
      - failed
      data_keys: []
