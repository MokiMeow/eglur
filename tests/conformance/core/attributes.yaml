    #[derive(Eq)]
    struct Left {
      field rights: Seq[Right]
    }

    #[derive(Eq)]
    struct Right {
      field lefts: Seq[Left]
      field payload: NoEq
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: DERIVE_ELIGIBILITY_FAILED
      message_contains:
      - derive
      - eligibility
      - failed
      data_keys: []
- id: ATR-recursive-derive-allows-generic-parameter-permutation
  category: attributes
  title: recursive derive allows bare generic parameters to be permuted
  code: |
    #[derive(Eq)]
    struct Flip[A: Eq, B: Eq] {
      field left: A
      field right: B
      field children: Seq[Flip[B, A]]
    }

    fn main!() -> Res[Str, Str] {
      let a: Flip[i64, Str] = Flip{
        left: 1,
        right: "x",
        children: [Flip{ left: "y", right: 2, children: [] }],
      }
      let b: Flip[i64, Str] = Flip{
        left: 1,
        right: "x",
        children: [Flip{ left: "y", right: 2, children: [] }],
      }
      yield Ok(to_str(a == b))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-recursive-derive-allows-closed-type-replacement
  category: attributes
  title: recursive derive allows a generic parameter to be replaced by a closed type
  code: |
    #[derive(Eq)]
    struct Reset[T: Eq] {
      field value: T
      field children: Seq[Reset[i64]]
    }

    fn main!() -> Res[Str, Str] {
      let a: Reset[Str] = Reset{
        value: "x",
        children: [Reset{ value: 2, children: [] }],
      }
      let b: Reset[Str] = Reset{
        value: "x",
        children: [Reset{ value: 2, children: [] }],
      }
      yield Ok(to_str(a == b))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
