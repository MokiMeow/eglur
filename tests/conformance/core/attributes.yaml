- id: ATR-derived-ord-defines-lexicographic-relational-operators
  category: attributes
  title: derived Ord defines lexicographic relational operators
  code: |
    #[derive(Ord, Eq)]
    struct Version {
      field major: i64
      field minor: i64
    }

    fn main!() -> Res[Str, Str] {
      let a = Version{ major: 1, minor: 9 }
      let b = Version{ major: 2, minor: 0 }
      let c = Version{ major: 2, minor: 0 }
      yield Ok(to_str((a < b) && (b <= c) && (c >= b)))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
