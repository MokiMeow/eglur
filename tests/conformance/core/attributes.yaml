    }
  expect:
    value:
      kind: Ok
      repr: '"x"'
- id: ATR-derived-debug-uses-canonical-struct-output
  category: attributes
  title: derived Debug uses canonical struct output
  code: |
    import std::str::FormatError

    #[derive(Debug)]
    struct Point {
      field x: i64
      field y: i64
    }

    fn main!() -> Res[Str, FormatError] =
      result {
        let p = Point{ x: 1, y: 2 }
        let s = format("{p:?}", p=p)?
        yield Ok(s)
      }
  expect:
    value:
      kind: Ok
      repr: '"Point { x: 1, y: 2 }"'
- id: ATR-derived-clone-is-source-callable-and-non-consuming
  category: attributes
  title: derived Clone is source-callable and non-consuming
  code: |
    #[derive(Clone)]
    struct Point {
      field x: i64
    }

    fn main!() -> Res[Str, Str] {
      let p = Point{ x: 7 }
      let q = p.clone()
      yield Ok(to_str((p.x == 7) && (q.x == 7)))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-derived-eq-compares-struct-fields
  category: attributes
  title: derived Eq compares struct fields
  code: |
    #[derive(Eq)]
    struct Point {
      field x: i64
      field y: i64
    }

    fn main!() -> Res[Str, Str] {
      let a = Point{ x: 1, y: 2 }
      let b = Point{ x: 1, y: 2 }
      let c = Point{ x: 1, y: 3 }
      yield Ok(to_str((a == b) && (a != c)))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-derived-hash-is-source-callable-without-eq
  category: attributes
  title: derived Hash is source-callable without Eq
  code: |
    #[derive(Hash)]
    struct Token {
      field id: i64
    }

    fn main!() -> Res[Str, Str] {
      let token = Token{ id: 7 }
      yield Ok(to_str(Hash.hash(&token, 9) == Hash.hash(&token, 9)))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-derived-eq-and-hash-enable-map-key-use
  category: attributes
  title: derived Eq and Hash enable Map key use
  code: |
    import std::map::Map

    #[derive(Eq, Hash)]
    struct Key {
      field id: i64
    }

    fn main!() -> Res[Str, Str] {
      let key = Key{ id: 3 }
      let map = Map[Key,Str].new().insert(key, "value")
      yield Ok(to_str(map.get(&Key{ id: 3 }).is_some()))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-derived-hash-rejects-field-without-hash
  category: attributes
