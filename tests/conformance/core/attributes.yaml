- id: ATR-recursive-eq-hash-derive-accepts-positive-self-cycle
  category: attributes
  title: recursive Eq and Hash derive accept a positive self cycle
  code: |
    #[derive(Eq, Hash)]
    struct Tree {
      field value: i64
      field children: Seq[Tree]
    }

    fn main!() -> Res[Str, Str] {
      let a = Tree{ value: 1, children: [Tree{ value: 2, children: [] }] }
      let b = Tree{ value: 1, children: [Tree{ value: 2, children: [] }] }
      let same_hash = Hash.hash(&a, 9) == Hash.hash(&b, 9)
      yield Ok(to_str((a == b) && same_hash))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: ATR-mutual-recursive-eq-derive-accepts-positive-scc
  category: attributes
  title: mutually recursive Eq derives accept a positive candidate component
  code: |
    #[derive(Eq)]
    struct Left {
      field rights: Seq[Right]
    }

    #[derive(Eq)]
    struct Right {
      field lefts: Seq[Left]
    }

    fn main!() -> Res[Str, Str] {
      let a = Left{ rights: [Right{ lefts: [Left{ rights: [] }] }] }
      let b = Left{ rights: [Right{ lefts: [Left{ rights: [] }] }] }
      yield Ok(to_str(a == b))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
