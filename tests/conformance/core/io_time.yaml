- id: IOT-with-text-reader-missing-path-returns-err-before-callback
  category: io_time
  title: with_text_reader! maps acquisition failure to Primary before callback
  code: |
    import std::io::{LinkMode, Path, TextError, with_text_reader!}
    import std::test::emit!

    fn main!() -> Res[Str, ScopedFailure[TextError]] {
      let outcome = with_text_reader!(Path.from_str("__eglur_conformance_missing_text_stream.txt"), LinkMode::Follow) { |_reader|
        result {
          emit!("unexpected-callback")
          yield Ok("unexpected")
        }
      }
      let observed = match outcome {
        Err(ScopedFailure::Primary(TextError::Io(_))) => true,
        Err(ScopedFailure::Primary(_)) => false,
        Err(ScopedFailure::PrimaryAndClose { .. }) => false,
        Ok(_) => false,
      }
      yield Ok(to_str(observed))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
    side_effects: []

- id: IOT-text-reader-invalid-utf-8-decode-path-returns-err-in-value-channel
  category: io_time
  title: text reader invalid UTF-8 decode error is sticky in value channel
  code: |
    import std::io::{LinkMode, Path, IoError, TextError, with_writer!, with_text_reader!}

    fn main!() -> Res[Str, Union[ScopedFailure[IoError], ScopedFailure[TextError]]] =
      result {
        let p = Path.from_str("__eglur_conformance_io_text_invalid_utf8.bin")

        _ = with_writer!(p, LinkMode::Follow) { |writer|
          result {
            let bad: u8 = 255
            let newline: u8 = 10
            let o: u8 = 111
            let k: u8 = 107
            _ = writer.write_all!(
              Vec[u8].new().push(bad).push(newline).push(o).push(k).push(newline)
            )?
            yield Ok(())
          }
        }?
        yield with_text_reader!(p, LinkMode::Follow) { |reader|
          result {
            yield match reader.read_line!() {
              Err(TextError::InvalidUtf8) => {
                _ = reader.read_line!()?
                yield Ok("unexpected recovery")
              }
              Err(error) => Err(error)
              Ok(_) => Ok("unexpected decode success")
            }
          }
        }
      }
  expect:
    value:
      kind: Err
      repr: TextError
      error_variant: TextError::InvalidUtf8

