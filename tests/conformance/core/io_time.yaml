- id: IOT-scoped-body-failure-and-successful-close-use-primary-carrier
  category: io_time
  title: Scoped callback failure and successful close use Primary
  code: |
    import std::io::{IoError, IoErrorKind, LinkMode, Path, read_bytes!, with_writer!}

    fn main!() -> Res[Str, ScopedFailure[IoError]] {
      let target = Path.from_str("__eglur_conformance_scoped_body_failure.bin")
      let missing = Path.from_str("__eglur_conformance_scoped_body_failure_missing.bin")
      let outcome = with_writer!(target, LinkMode::Reject) { |writer|
        result {
          _ = writer.write_all!([1, 2, 3])?
          _ = read_bytes!(missing, LinkMode::Reject)?
          yield Ok(())
        }
      }
      let observed = match outcome {
        Err(ScopedFailure::Primary(error)) =>
          (error.kind() == IoErrorKind::NotFound) &&
            (error.to_str() == "I/O error: not found"),
        Err(ScopedFailure::PrimaryAndClose { .. }) => false,
        Ok(_) => false,
      }
      yield Ok(to_str(observed))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-direct-byte-stream-acquisitions-close-each-resource-root
  category: io_time
  title: direct byte stream acquisitions close each resource root
  code: |
    import std::io::{LinkMode, IoError, Path, open_reader!, open_writer!, open_appender!, write_bytes!, remove_entry!, exists!}

    fn main!() -> Res[Str, IoError] =
      result {
        let p = Path.from_str("__eglur_conformance_io_direct_byte_roots.bin")
        if exists!(p)? { _ = remove_entry!(p)? } else {}
        _ = write_bytes!(p, [1], LinkMode::Follow)?

        let reader = open_reader!(p, LinkMode::Follow)?
        _ = (move reader).close!()?
        let writer = open_writer!(p, LinkMode::Follow)?
        _ = (move writer).close!()?
        let appender = open_appender!(p, LinkMode::Follow)?
        _ = (move appender).close!()?

        _ = remove_entry!(p)?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

