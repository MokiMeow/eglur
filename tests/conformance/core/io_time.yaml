        _ = remove_dir_all!(root)?
        _ = create_dir_all!(dir, DirTraversal::FollowLinks)?
        _ = write_bytes!(non_ascii, [5], LinkMode::Follow)?
        _ = write_bytes!(nfc, [4], LinkMode::Follow)?
        _ = write_bytes!(nfd, [3], LinkMode::Follow)?
        _ = write_bytes!(lower, [2], LinkMode::Follow)?
        _ = write_bytes!(upper, [1], LinkMode::Follow)?

