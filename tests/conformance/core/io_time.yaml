# Suite: core/io_time.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Tests may create files in current working directory with reserved
#   `__eglur_conformance_*` prefixes.

tests:
- id: IOT-path-from-str-path-to-str-roundtrip-is-pure-and-total
  category: io_time
  title: Path.from_str + Path.to_str roundtrip is pure and total
  code: |
    import std::io::Path

    fn main!() -> Res[Str, Str] {
      let p = Path.from_str("data/input.txt")
      yield Ok(p.to_str())
    }
  expect:
    value:
      kind: Ok
      repr: '"data/input.txt"'

