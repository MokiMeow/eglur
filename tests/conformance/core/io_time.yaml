- id: IOT-directory-creation-rejection-preserves-observed-namespace
  category: io_time
  title: directory creation rejections preserve observed entries and retry uses current namespace
  code: |
    import std::io::{DirTraversal, LinkMode, Path, IoError, FileKind, create_dir!, create_dir_all!, entry_exists!, entry_stat!, read_bytes!, remove_entry!, remove_dir_all!, write_bytes!}

    fn main!() -> Res[Str, IoError] =
      result {
        let root = Path.from_str("__eglur_conformance_io_dir_creation_rejection")
        let existing = Path.from_str("__eglur_conformance_io_dir_creation_rejection/existing")
        let existing_marker = Path.from_str("__eglur_conformance_io_dir_creation_rejection/existing/marker.bin")
        let missing_parent = Path.from_str("__eglur_conformance_io_dir_creation_rejection/missing")
        let missing_child = Path.from_str("__eglur_conformance_io_dir_creation_rejection/missing/child")
        let blocker = Path.from_str("__eglur_conformance_io_dir_creation_rejection/blocker")
        let blocked_child = Path.from_str("__eglur_conformance_io_dir_creation_rejection/blocker/child")

        _ = remove_dir_all!(root)?
        _ = create_dir_all!(root, DirTraversal::FollowLinks)?
        _ = create_dir!(existing, DirTraversal::FollowLinks)?
        _ = write_bytes!(existing_marker, [7], LinkMode::Reject)?

        let existing_rejected = create_dir!(existing, DirTraversal::FollowLinks).is_err()
        let existing_preserved = (entry_stat!(existing)?.kind() == FileKind::Dir) &&
          (read_bytes!(existing_marker, LinkMode::Reject)? == [7])
        let missing_parent_rejected = create_dir!(missing_child, DirTraversal::FollowLinks).is_err()
        let missing_parent_absent = !(entry_exists!(missing_parent)?)

        _ = write_bytes!(blocker, [1], LinkMode::Reject)?
        let file_rejected = create_dir!(blocker, DirTraversal::FollowLinks).is_err()
        let blocker_rejected = create_dir_all!(blocked_child, DirTraversal::FollowLinks).is_err()
        let blocker_preserved = (entry_stat!(blocker)?.kind() == FileKind::File) &&
          (read_bytes!(blocker, LinkMode::Reject)? == [1])

        _ = remove_entry!(blocker)?
        let retry_succeeds = create_dir_all!(blocked_child, DirTraversal::FollowLinks).is_ok()
        let retry_created_target = (entry_stat!(blocked_child)?.kind() == FileKind::Dir)
        _ = remove_dir_all!(root)?

        let ok = existing_rejected && existing_preserved && missing_parent_rejected &&
          missing_parent_absent && file_rejected && blocker_rejected &&
          blocker_preserved && retry_succeeds && retry_created_target
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-removal-direct-kind-and-missing-matrix
  category: io_time
