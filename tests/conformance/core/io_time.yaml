- id: IOT-text-writer-write-line-matches-write-str-with-trailing-newline
  category: io_time
  title: text writer write_line! matches write_str! with trailing newline
  code: |
    import std::io::{LinkMode, Path, TextError, with_text_writer!, with_text_reader!}

    fn main!() -> Res[Str, ScopedFailure[TextError]] =
      result {
        let p0 = Path.from_str("__eglur_conformance_io_text_write_line_probe_a.txt")
        let p1 = Path.from_str("__eglur_conformance_io_text_write_line_probe_b.txt")

        _ = with_text_writer!(p0, LinkMode::Follow) { |writer|
          result {
            _ = writer.write_line!("alpha")?
            yield Ok(())
          }
        }?
        _ = with_text_writer!(p1, LinkMode::Follow) { |writer|
          result {
            _ = writer.write_str!("alpha\n")?
            yield Ok(())
          }
        }?
        let left = with_text_reader!(p0, LinkMode::Follow) { |reader|
          result {
            let line = reader.read_line!()?.unwrap_or("none")
            let eof = reader.read_line!()?.is_none()
            yield Ok((line, eof))
          }
        }?
        let right = with_text_reader!(p1, LinkMode::Follow) { |reader|
          result {
            let line = reader.read_line!()?.unwrap_or("none")
            let eof = reader.read_line!()?.is_none()
            yield Ok((line, eof))
          }
        }?
        let same = (left.0 == right.0) && left.1 && right.1
        yield Ok(to_str(same))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-scoped-standard-text-stream-wrappers-can-be-reacquired-after-close
  category: io_time
  title: scoped standard text stream wrappers can be reacquired after close
  code: |
    import std::io::{TextError, stdin!, stdout!, stderr!, with_stdin!, with_stdout!, with_stderr!}

    fn main!() -> Res[Str, Union[TextError, ScopedFailure[TextError]]] =
      result {
        let input = stdin!()?
        _ = (move input).close!()?
        let output = stdout!()?
        _ = (move output).close!()?
        let error_output = stderr!()?
        _ = (move error_output).close!()?

        _ = with_stdin! { |_input| result { yield Ok(()) } }?
        _ = with_stdin! { |_input| result { yield Ok(()) } }?
        _ = with_stdout! { |output|
          result {
            _ = output.write_str!("")?
            _ = output.flush!()?
            yield Ok(())
          }
        }?
        _ = with_stdout! { |_output| result { yield Ok(()) } }?
        _ = with_stderr! { |output|
          result {
            _ = output.write_str!("")?
            _ = output.flush!()?
            yield Ok(())
          }
        }?
        _ = with_stderr! { |_output| result { yield Ok(()) } }?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

