  code: |
    import std::time::{now!, sleep!, Duration, TimeError, TimeErrorKind}

    fn main!() -> Res[Str, TimeError] =
      result {
        let earlier = now!()
        sleep!(Duration.millis(1)?)
        let later = now!()
        let observed = match earlier.duration_since(&later) {
          Err(error) => (error.kind() == TimeErrorKind::ReversedInstant) &&
            (error.to_str() == "time error: reversed instant")
          Ok(_) => false
        }
        yield Ok(to_str(observed))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-sleep-positive-duration-respects-monotonic-minimum
  category: io_time
  title: positive sleep! does not return before its monotonic minimum
  code: |
    import std::time::{now!, sleep!, Duration, TimeError}

    fn main!() -> Res[Str, TimeError] =
      result {
        let requested = Duration.millis(1)?
        let start = now!()
        sleep!(requested)
        let end = now!()
        let elapsed = end.duration_since(&start)?
        yield Ok(to_str(elapsed.as_nanos() >= requested.as_nanos()))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

