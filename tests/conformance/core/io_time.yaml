- id: IOT-with-appender-appends-bytes-after-existing-file-contents
  category: io_time
  title: with_appender! appends bytes after existing file contents
  code: |
    import std::io::{LinkMode, IoError, Path, write_bytes!, read_bytes!, with_appender!, remove_entry!, exists!}

    fn main!() -> Res[Str, Union[IoError, ScopedFailure[IoError]]] =
      result {
        let p = Path.from_str("__eglur_conformance_io_append_bytes.bin")
        if exists!(p)? { _ = remove_entry!(p)? } else {}
        _ = write_bytes!(p, [1, 2], LinkMode::Follow)?
        _ = with_appender!(p, LinkMode::Follow) { |writer|
          result {
            _ = writer.write_all!([3, 4])?
            yield Ok(())
          }
        }?
        let xs = read_bytes!(p, LinkMode::Follow)?
        _ = remove_entry!(p)?
        yield Ok(to_str(xs))
      }
  expect:
    value:
      kind: Ok
      repr: '"[1,2,3,4]"'

