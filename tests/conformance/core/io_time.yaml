  code: |
    import std::io::Path

    fn main!() -> Res[Str, Str] {
      let empty = Path.from_str("")
      let empty_child = Path.from_str("")
      let base = Path.from_str("base")
      let trailing = Path.from_str("base/")
      let root = Path.from_str("/")
      let child = Path.from_str("child")
      let repeated = Path.from_str("x//y")
      let dotted = Path.from_str("./x/../y")
      let backslash = Path.from_str("x\\y")

      yield Ok(concat([
        empty.join(&child).to_str(), "|",
        empty.join(&empty_child).to_str(), "|",
        base.join(&empty_child).to_str(), "|",
        root.join(&empty_child).to_str(), "|",
        trailing.join(&child).to_str(), "|",
        base.join(&repeated).to_str(), "|",
        base.join(&dotted).to_str(), "|",
        base.join(&backslash).to_str()
      ]))
    }
  expect:
    value:
      kind: Ok
      repr: '"child||base/|/|base/child|base/x//y|base/./x/../y|base/x\\y"'

