- id: IOT-path-error-kind-and-display-cover-closed-parse-failures
  category: io_time
  title: PathError kind and Display cover every baseline strict parse failure
  code: |
    import std::io::{Path, PathErrorKind}

    fn main!() -> Res[Str, Str] {
      let empty_ok = match Path.parse_strict("") {
        Err(error) => (error.kind() == PathErrorKind::Empty) &&
          (error.kind().to_str() == "empty") &&
          (error.to_str() == "path error: empty")
        Ok(_) => false
      }
      let nul_ok = match Path.parse_strict("bad\u{0000}path") {
        Err(error) => (error.kind() == PathErrorKind::ContainsNul) &&
          (error.kind().to_str() == "contains NUL") &&
          (error.to_str() == "path error: contains NUL")
        Ok(_) => false
      }
      yield Ok(to_str(empty_ok && nul_ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-io-error-kind-display-covers-portable-categories
  category: io_time
  title: IoErrorKind Display covers every portable category
  code: |
    import std::io::IoErrorKind

    fn main!() -> Res[Str, Str] {
      let observed = concat([
        IoErrorKind::NotFound.to_str(), "|",
        IoErrorKind::AlreadyExists.to_str(), "|",
        IoErrorKind::PermissionDenied.to_str(), "|",
        IoErrorKind::ReadOnly.to_str(), "|",
        IoErrorKind::InvalidPath.to_str(), "|",
        IoErrorKind::InvalidData.to_str(), "|",
        IoErrorKind::WrongKind.to_str(), "|",
        IoErrorKind::DirectoryNotEmpty.to_str(), "|",
        IoErrorKind::PolicyRejected.to_str(), "|",
        IoErrorKind::CrossDevice.to_str(), "|",
        IoErrorKind::ResourceBusy.to_str(), "|",
        IoErrorKind::BrokenPipe.to_str(), "|",
        IoErrorKind::Interrupted.to_str(), "|",
        IoErrorKind::TimedOut.to_str(), "|",
        IoErrorKind::StorageFull.to_str(), "|",
        IoErrorKind::ResourceExhausted.to_str(), "|",
        IoErrorKind::Unsupported.to_str(), "|",
        IoErrorKind::Other.to_str()
      ])
      yield Ok(observed)
    }
  expect:
    value:
      kind: Ok
      repr: '"not found|already exists|permission denied|read only|invalid path|invalid data|wrong entry kind|directory not empty|policy rejected|cross-device operation|resource busy|broken pipe|interrupted|timed out|storage full|resource exhausted|unsupported|other"'

- id: IOT-io-error-kind-and-display-agree-for-missing-file
  category: io_time
  title: IoError kind and Display agree for a missing required file
  code: |
    import std::io::{IoError, IoErrorKind, LinkMode, Path, TextError, entry_exists!, read_bytes!, remove_entry!}

    fn main!() -> Res[Str, IoError] =
      result {
        let path = Path.from_str("__eglur_conformance_missing_error_kind.bin")
        if entry_exists!(path)? { _ = remove_entry!(path)? } else {}
        let observed = match read_bytes!(
          path,
          LinkMode::Follow,
        ) {
          Err(error) => {
            let direct = error.to_str()
            let kind_ok = (error.kind() == IoErrorKind::NotFound) &&
              (error.kind().to_str() == "not found")
            let wrapped = TextError::Io(error)
            kind_ok && (direct == "I/O error: not found") &&
              (wrapped.to_str() == direct)
          }
          Ok(_) => false
        }
        yield Ok(to_str(observed))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

