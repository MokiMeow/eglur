- id: IOT-scoped-text-writer-and-reader-preserve-utf-8-line-stream-order
  category: io_time
  title: scoped text writer and reader preserve UTF-8 line stream order
  code: |
    import std::io::{LinkMode, Path, TextError, with_text_writer!, with_text_reader!}

    fn main!() -> Res[Str, ScopedFailure[TextError]] =
      result {
        let p = Path.from_str("__eglur_conformance_io_text_stream_lines.txt")
        _ = with_text_writer!(p, LinkMode::Follow) { |writer|
          result {
            _ = writer.write_line!("alpha")?
            _ = writer.write_line!("beta")?
            yield Ok(())
          }
        }?
        let ok = with_text_reader!(p, LinkMode::Follow) { |reader|
          result {
            let l1 = reader.read_line!()?.unwrap_or("none")
            let l2 = reader.read_line!()?.unwrap_or("none")
            let eof = reader.read_line!()?.is_none()
            yield Ok((l1 == "alpha") && (l2 == "beta") && eof)
          }
        }?
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

