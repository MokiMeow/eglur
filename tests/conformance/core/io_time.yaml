        let upper = Path.from_str("__eglur_conformance_io_list_root/nested/A-upper.txt")
        let lower = Path.from_str("__eglur_conformance_io_list_root/nested/a-lower.txt")
        let nfd = Path.from_str("__eglur_conformance_io_list_root/nested/e\u{301}-a-nfd.txt")
        let nfc = Path.from_str("__eglur_conformance_io_list_root/nested/\u{e9}-z-nfc.txt")
