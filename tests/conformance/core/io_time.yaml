    fn main!() -> Res[Str, TimeError] =
      result {
        let d1 = Duration.parse("1500ms")?
        let d2 = Duration.parse("2s")?
        let d3 = Duration.parse("3_000_000ns")?
        let ok = (d1.as_millis() == 1500) && (d2.as_millis() == 2000) && (d3.as_millis() == 3)
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

