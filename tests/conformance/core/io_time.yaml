- id: IOT-instant-duration-since-is-pure-for-ordered-snapshots
  category: io_time
  title: Instant.duration_since is pure for ordered monotonic snapshots
  code: |
    import std::time::{now!, Duration, Instant, TimeError}

    fn delta(start: &Instant, end: &Instant) -> Res[Duration, TimeError] =
      end.duration_since(start)

    fn main!() -> Res[Str, TimeError] =
      result {
        let start = now!()
        let end = now!()
        let elapsed = delta(&start, &end)?
        yield Ok(to_str(elapsed.as_nanos() >= 0))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: IOT-instant-duration-since-reversed-order-reports-error-kind
