- id: CFL-bool-and-tri-logical-operators-short-circuit-fixed-results
  category: control_flow
  title: Bool and Tri logical operators do not evaluate the right operand when the left fixes the result
  code: |
    import std::test::abort!

    fn dead!() -> Bool {
      abort!("RUNTIME_ABORT", "logical right operand evaluated")
      yield true
    }

    fn tri_tag(value: Tri) -> Str = match value {
      Tri::True => "T",
      Tri::False => "F",
      Tri::Unknown => "U",
    }

    fn main!() -> Res[Str, Str] {
      let bool_and = false && dead!()
      let bool_or = true || dead!()
      let tri_and = tri_tag(Tri::False && dead!())
      let tri_or = tri_tag(Tri::True || dead!())
      yield Ok(concat([to_str(bool_and), "|", to_str(bool_or), "|", tri_and, tri_or]))
    }
  expect:
    value:
      kind: Ok
      repr: '"false|true|FT"'
