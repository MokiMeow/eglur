  title: Tri helper conversions cover coalesce to_opt and Bool.to_tri
  code: |
    fn tri_tag(t: Tri) -> Str = match t {
      Tri::True => "T",
      Tri::False => "F",
      Tri::Unknown => "U",
    }

    fn main!() -> Res[Str, Str] {
      let a = Tri::Unknown.coalesce(true)
      let b = Tri::Unknown.coalesce(false)
      let c = Tri::True.to_opt().unwrap_or(false)
      let d = Tri::False.to_opt().unwrap_or(true)
      let e = Tri::Unknown.to_opt().is_none()
      let f = tri_tag(true.to_tri())
      let g = tri_tag(false.to_tri())
      yield Ok(concat([to_str(a), to_str(b), to_str(c), to_str(!d), to_str(e), f, g]))
    }
  expect:
    value:
      kind: Ok
      repr: '"truefalsetruetruetrueTF"'
- id: CFL-tri-operators-follow-full-k3-truth-tables
  category: control_flow
  title: Tri operators follow full K3 truth tables
  code: |
    fn tri_tag(t: Tri) -> Str = match t {
      Tri::True => "T",
      Tri::False => "F",
      Tri::Unknown => "U",
    }

    fn main!() -> Res[Str, Str] {
      let nots = concat([tri_tag(Tri::True.not()), tri_tag(Tri::False.not()), tri_tag(Tri::Unknown.not())])
      let ands = concat([
        tri_tag(Tri::True.and(Tri::True)),
        tri_tag(Tri::True.and(Tri::False)),
        tri_tag(Tri::True.and(Tri::Unknown)),
        tri_tag(Tri::False.and(Tri::True)),
        tri_tag(Tri::False.and(Tri::False)),
        tri_tag(Tri::False.and(Tri::Unknown)),
        tri_tag(Tri::Unknown.and(Tri::True)),
        tri_tag(Tri::Unknown.and(Tri::False)),
        tri_tag(Tri::Unknown.and(Tri::Unknown)),
      ])
      let ors = concat([
        tri_tag(Tri::True.or(Tri::True)),
        tri_tag(Tri::True.or(Tri::False)),
        tri_tag(Tri::True.or(Tri::Unknown)),
        tri_tag(Tri::False.or(Tri::True)),
        tri_tag(Tri::False.or(Tri::False)),
        tri_tag(Tri::False.or(Tri::Unknown)),
        tri_tag(Tri::Unknown.or(Tri::True)),
        tri_tag(Tri::Unknown.or(Tri::False)),
        tri_tag(Tri::Unknown.or(Tri::Unknown)),
      ])
      yield Ok(concat([nots, "|", ands, "|", ors]))
    }
  expect:
    value:
      kind: Ok
      repr: '"FTU|TFUFFFUFU|TTTTFUTUU"'
