- id: CFL-structural-patterns-support-declaration-forms-rest-and-nesting
  category: control_flow
  title: structural patterns support variant declaration forms explicit rest and nested payloads
  code: |
    struct Point {
      field x: i64
      field y: i64
    }

    enum Shape {
      Origin
      Empty()
      Pair(i64, i64)
      Tagged { label: Str, point: Point }
    }

    fn score(shape: Shape) -> i64 = match shape {
      Shape::Origin => 0,
      Shape::Empty() => 1,
      Shape::Pair(left, ..) => left,
      Shape::Tagged { point: Point { x, .. }, .. } => x,
    }

    fn main!() -> Res[Str, Str] {
      let tagged = Shape::Tagged {
        label: "point",
        point: Point{ x: 3, y: 4 }
      }
      let empty = Shape::Empty()
      yield Ok(concat([to_str(score(tagged)), to_str(score(empty))]))
    }
  expect:
    value:
      kind: Ok
      repr: '"31"'
- id: CFL-or-patterns-may-share-one-binding-name-and-type
  category: control_flow
  title: or-pattern alternatives may introduce the same binding name and type
  code: |
