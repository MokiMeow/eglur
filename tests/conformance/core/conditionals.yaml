tests:
- id: CFL-if-expression-selects-then-branch-when-condition-is-true
  category: control_flow
  title: if expression selects then branch when condition is true
  code: |
    fn main!() -> Res[Str, Str] {
      let x = if true { yield 1 } else { yield 2 }
      yield Ok(to_str(x))
    }
  expect:
    value:
      kind: Ok
      repr: '"1"'
- id: CFL-else-if-chain-desugars-as-nested-if-and-picks-first-true-branch
  category: control_flow
  title: else-if chain desugars as nested if and picks first true branch
  code: |
    fn main!() -> Res[Str, Str] {
      let x = if false { yield 1 } else if true { yield 2 } else { yield 3 }
      yield Ok(to_str(x))
    }
  expect:
    value:
      kind: Ok
      repr: '"2"'
- id: CFL-if-condition-must-be-bool-or-tri
  category: control_flow
  title: if condition must be Bool or Tri
  code: |
    fn main!() -> Res[Str, Str] {
      let x = if 1 { yield 1 } else { yield 0 }
      yield Ok(to_str(x))
    }
  expect:
    compile_error:
      code: IF_CONDITION_NOT_BOOL
      message_contains:
      - if
      - Bool
      - Tri
      - condition
      data_keys: []
- id: CFL-if-branch-result-type-mismatch-is-compile-error
  category: control_flow
  title: if branch result type mismatch is compile error
  code: |
    fn main!() -> Res[Str, Str] {
      let x = if true { yield 1 } else { yield "s" }
      yield Ok("x")
    }
  expect:
    compile_error:
      code: IF_BRANCH_TYPE_MISMATCH
      message_contains:
      - if
      - branch
      - mismatch
      data_keys:
      - left_type
      - right_type
      data_equals:
        left_type: i64
        right_type: Str
