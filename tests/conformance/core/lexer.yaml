- id: LEX-axis-literals
  category: lexer
  title: axis literals
  code: |
    import std::tensor::{AxisError, ones}

    fn main!() -> Res[Str, AxisError] =
      result {
        let x = ones[f32](2,3).with_names([#0:'batch, #1:'feature])?
        let i = x.axis_of('batch)?
        yield Ok(to_str(i.to_nat()))
      }
  expect:
    value:
      kind: Ok
      repr: '"0"'
- id: LEX-axis-index-literal-reuses-decimal-separators
  category: lexer
  title: axis index literal reuses decimal separators
  code: |
    fn main!() -> Res[Str, Str] {
      let i = #1_0
      yield Ok(to_str(i.to_nat()))
    }
  expect:
    value:
      kind: Ok
      repr: '"10"'
- id: LEX-decimal-components-accept-strict-interior-separators
