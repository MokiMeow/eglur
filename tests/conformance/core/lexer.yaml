tests:
- id: LEX-leading-utf8-bom-is-ignored
  category: lexer
  title: leading UTF-8 BOM is ignored
  code: "\ufefffn main!() -> Res[Str, Str] {\n  yield Ok(\"ok\")\n}\n"
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LEX-non-leading-utf8-bom-is-rejected
  category: lexer
  title: UTF-8 BOM is rejected outside the leading source position
  code: "x\ufeff"
  expect:
    compile_error:
      code: LEX_INVALID_CHAR
      primary_span:
        source: code
        bytes:
          start: 1
          end: 4
      message_contains:
      - lex
      - invalid
      - char
      data_keys: []
- id: LEX-invalid-utf8-source-is-rejected-before-tokenization
  category: lexer
  title: invalid UTF-8 source is rejected before tokenization
  code_bytes_hex: "ff"
  expect:
    compile_error:
      code: LEX_INVALID_UTF8
      primary_span:
        source: code
        bytes:
          start: 0
          end: 1
      message_contains:
      - source
      - UTF-8
      - invalid
      data_keys: []
- id: LEX-physical-line-endings-normalize-for-lexing
  category: lexer
  title: LF CRLF and lone CR line endings normalize for lexing
  code: "fn main!() -> Res[Str, Str] {\r\n  let x = 1\r  let y = 2\n  yield Ok(to_str(wrapping_add(x, y)))\r\n}\r\n"
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: LEX-space-tab-and-form-feed-are-horizontal-whitespace
  category: lexer
  title: space tab and form feed are horizontal whitespace
  code: "fn\fmain!()\t-> Res[Str, Str] {\n  yield Ok(\"ok\")\n}\n"
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LEX-line-comment-may-end-at-physical-eof
  category: lexer
  title: line comment may terminate at physical end of file
  code: |-
    fn main!() -> Res[Str, Str] {
      yield Ok("ok")
    } // comment reaches EOF
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LEX-unicode-is-allowed-in-comments-and-strings
  category: lexer
  title: Unicode separators and emoji remain data in comments and strings
  code: "fn main!() -> Res[Str, Str] {\n  /* \U0001F600 \u0085 \u2028 \u2029 */\n  yield Ok(\"\U0001F600\u0085\u2028\u2029\")\n}\n"
  expect:
    value:
      kind: Ok
      repr: '"\U0001F600\u0085\u2028\u2029"'
- id: LEX-non-ascii-identifier-is-rejected-in-v0-1
  category: lexer
  title: non-ASCII identifier is rejected in v0.1
  code: "fn main!() -> Res[Str, Str] {\n  \uBCC0\uC218 = 1\n  yield Ok(\"x\")\n}\n"
  expect:
    compile_error:
      code: LEX_INVALID_IDENTIFIER_CHAR
      message_contains:
      - identifier
      - ASCII
      - invalid
      data_keys: []
- id: LEX-non-ascii-axis-name-is-an-identifier-character-error
  category: lexer
  title: non-ASCII XID scalar after axis quote is an identifier character error
  code: "'변수"
  expect:
