- id: LEX-unsupported-sigil-prefixed-identifier-is-rejected
  category: lexer
  title: unsupported sigil-prefixed identifier is rejected
  code: |
    fn main!() -> Res[Str, Str] {
      @x = 1
      yield Ok("x")
    }
  expect:
    compile_error:
      code: LEX_INVALID_CHAR
      message_contains:
      - lex
      - invalid
      - char
      data_keys: []
- id: LEX-compact-alias-pattern-keeps-at-as-a-delimiter
  category: lexer
  title: alias delimiter may be adjacent to its binder and nested pattern
  code: |
    fn main!() -> Res[Str, Str] {
      let value = match Some(7) {
        whole@Some(inner) => inner,
        None => 0,
      }
      yield Ok(to_str(value))
    }
  expect:
    value:
      kind: Ok
      repr: '"7"'
- id: LEX-super-is-an-ordinary-identifier-outside-import-roots
  category: lexer
  title: super is an ordinary identifier outside relative import roots
  code: |
    fn main!() -> Res[Str, Str] {
      let super = "ok"
      yield Ok(super)
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
- id: LEX-unterminated-string-reports-lexical-error
  category: lexer
  title: unterminated string reports lexical error
  code: |
    fn main!() -> Res[Str, Str] {
      let s = "abc
      yield Ok("x")
    }
  expect:
    compile_error:
      code: LEX_UNTERMINATED_STRING
      message_contains:
      - string
      - unterminated
      data_keys: []
- id: LEX-invalid-escape-sequence-reports-lexical-error
  category: lexer
