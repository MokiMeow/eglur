    fn main!() -> Res[Str, Str] {
      let integer = 1_000
      let decimal = 1_000.25_00
      let exponent = 1e1_0
      let signed_exponent = 1.25E-1_0
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
