      yield Ok(to_str(1.))
    }
  expect:
    compile_error:
      code: PARSE_UNEXPECTED_TOKEN
      message_contains:
      - parse
      - unexpected
      - token
      data_keys: []
- id: LEX-leading-dot-numeric-form-is-not-a-float-literal
  category: lexer
  title: leading dot numeric form is not a float literal
  code: |
    fn main!() -> Res[Str, Str] {
      let value = .5
      yield Ok(to_str(value))
    }
  expect:
    compile_error:
      code: PARSE_EXPECTED_EXPRESSION
      message_contains:
      - parse
      - expected
      - expression
      data_keys: []
- id: LEX-compact-numeric-ranges-are-accepted
  category: lexer
  title: compact numeric ranges are accepted
  code: |
    fn main!() -> Res[Str, Str] {
      let mut sum = 0
      for i in 0..3 {
        sum = wrapping_add(sum, i)
      }
      for i in 0..=2 {
        sum = wrapping_add(sum, i)
      }
      yield Ok(to_str(sum))
    }
  expect:
    value:
      kind: Ok
      repr: '"6"'
- id: LEX-compact-integer-and-float-member-access-are-accepted
  category: lexer
  title: compact integer and float member access are accepted
  code: |
    fn main!() -> Res[Str, Str] {
      let integer = 1.to_str()
      let floating = 1.0.to_str()
      yield Ok(to_str((integer == "1") && (floating == "1.0")))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: LEX-ellipsis-token-and-closed-range-token-coexist-without-lexical-conflict
  category: lexer
  title: ellipsis token and closed-range token coexist without lexical conflict
  code: |
    import std::tensor::{TransformError, ones}

    fn main!() -> Res[Str, Union[Str, TransformError]] =
      result {
        let x = ones[f32](2,3,4)
        let y = x.then(rearrange{ b ...tail -> ...tail b })?
        let mut s = 0
        for i in 0 ..= 2 {
          s = wrapping_add(s, i)
        }
        let ok = (to_str(y.shape()) == "[3,4,2]") && (s == 3)
        yield if ok { yield Ok("ok") } else { yield Err("bad") }
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: LEX-duration-suffix-numeric-literal-is-rejected-in-v0-1-baseline
  category: lexer
  title: duration-suffix numeric literal is rejected in v0.1 baseline
  code: |
    fn main!() -> Res[Str, Str] {
      let d = 2s
      yield Ok("x")
    }
  expect:
    compile_error:
      code: LEX_INVALID_NUMBER
      message_contains:
      - number
      - invalid
      data_keys: []

- id: LEX-logical-or-and-zero-argument-closure-pipes-remain-distinct
  category: lexer
  title: logical or and zero argument closure pipes remain distinct
  code: |
    fn invoke(f: Fn() -> Bool) -> Bool = f()

    fn main!() -> Res[Str, Str] {
      let logical = false || true
      let compact = invoke({ || true })
      let spaced = invoke({ | | true })
      yield Ok(to_str(logical && compact && spaced))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: LEX-tuple-index-context-preserves-chains-and-trivia
  category: lexer
  title: tuple index context preserves chains and horizontal trivia
  code: |
    fn main!() -> Res[Str, Str] {
      let pair = ((2, 3), (5, 7))
      let compact = pair.0.1
      let spaced = pair . 1 . 0
      let commented = pair./* keep */0.1
      let ok = (compact == 3) && (spaced == 5) && (commented == 3)
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: LEX-tuple-index-context-rejects-exponent-suffix
  category: lexer
  title: tuple index context rejects exponent suffix
  code: |
    fn main!() -> Res[Str, Str] {
      let pair = (1, 2)
      let value = pair.0e1
      yield Ok(to_str(value))
    }
  expect:
    compile_error:
      code: LEX_INVALID_NUMBER
      message_contains:
      - number
      - invalid
      data_keys: []
