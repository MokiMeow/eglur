- id: JSN-json-constructors-and-projections-compose-in-pure-value-channel
  category: json
  title: json constructors and projections compose in pure value channel
  code: |
    import std::json::{json_array, json_number, json_str}

    fn main!() -> Res[Str, Str] =
      result {
        let n = json_number(2.5).map_err { |_| "num" }?
        let j = json_array([json_str("x"), n])
        let arr = j.as_array().ok_or("arr")?.to_vec()
        let s = arr.get(0).ok_or("i0")?.as_str().ok_or("s")?
        let x = arr.get(1).ok_or("i1")?.as_number().ok_or("x")?
        yield Ok(to_str((s == "x") && (x == 2.5)))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: JSN-json-projections-return-none-for-nonmatching-kinds
  category: json
  title: json projections return None for nonmatching kinds
  code: |
    import std::json::{json_array, json_bool, json_null, json_number, json_object, json_str}

    fn main!() -> Res[Str, Str] =
      result {
        let n = json_number(1.0).map_err { |_| "num" }?
        let obj = json_object([("k", json_bool(true))]).map_err { |_| "object" }?
        let ok0 = !json_bool(false).is_null()
        let ok1 = json_null().as_bool().is_none()
        let ok2 = n.as_str().is_none()
        let ok3 = json_str("x").as_array().is_none()
        let ok4 = json_array([]).as_object().is_none()
        let ok5 = obj.as_number().is_none()
        let ok = ok0 && ok1 && ok2 && ok3 && ok4 && ok5
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: JSN-stringify-json-canonicalizes-numbers-and-string-escapes
  category: json
  title: stringify_json canonicalizes numbers and string escapes
  code: |
    import std::json::{json_array, json_number, json_str, stringify_json}
    import std::parse::parse_f64

    fn main!() -> Res[Str, Str] =
      result {
        let minus_zero = parse_f64("-0.0").map_err { |_| "mz" }?
        let xs = json_array([
          json_number(1.0).map_err { |_| "n1" }?,
          json_number(4.50).map_err { |_| "n2" }?,
          json_number(0.002).map_err { |_| "n3" }?,
          json_number(minus_zero).map_err { |_| "n4" }?,
          json_str("€/\n")
        ])
        let s = stringify_json(&xs)
        yield Ok(to_str(s == "[1,4.5,0.002,-0,\"€/\\n\"]"))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
