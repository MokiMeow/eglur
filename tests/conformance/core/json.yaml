- id: JSN-stringify-json-is-deterministic-and-emits-compact-form
  category: json
  title: stringify_json is deterministic and emits compact form
  code: |
    import std::json::{parse_json, stringify_json}

    fn main!() -> Res[Str, Str] =
      result {
        let j = parse_json("{ \"b\" : true , \"a\" : \"x\" }").map_err { |_| "parse" }?
        let s1 = stringify_json(&j)
        let s2 = stringify_json(&j)
        yield Ok(to_str(s1 == "{\"b\":true,\"a\":\"x\"}" && s1 == s2))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

