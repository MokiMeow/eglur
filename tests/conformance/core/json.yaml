- id: JSN-json-object-preserves-entry-order-when-stringified
  category: json
  title: json_object preserves entry order when stringified
  code: |
    import std::json::{json_bool, json_number, json_object, json_str, stringify_json}

    fn main!() -> Res[Str, Str] =
      result {
        let one = json_number(1.0).map_err { |_| "num" }?
        let j = json_object([
          ("b", json_bool(false)),
          ("a", one),
          ("s", json_str("x"))
        ]).map_err { |_| "object" }?
        yield Ok(to_str(stringify_json(&j) == "{\"b\":false,\"a\":1,\"s\":\"x\"}"))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

