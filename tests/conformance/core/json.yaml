# Suite: core/json.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - std::json parse/build failures are value-channel `Res::Err` outcomes in baseline paths.

tests:
- id: JSN-json-null-constructs-null-value
  category: json
  title: json_null constructs null value
  code: |
    import std::json::{json_null, stringify_json}

    fn main!() -> Res[Str, Str] {
      let j = json_null()
      yield Ok(to_str(j.is_null() && stringify_json(&j) == "null"))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: JSN-parse-json-supports-object-array-bool-null-number-and-accessors
  category: json
  title: parse_json supports object array bool null number and accessors
  code: |
    import std::json::parse_json

    fn main!() -> Res[Str, Str] =
      result {
        let j = parse_json("{\"a\":1,\"b\":[true,null]}").map_err { |_| "parse" }?
        let obj = j.as_object().ok_or("obj")?
        let a = obj.get(&"a").ok_or("a")?.as_number().ok_or("num")?
        let arr = obj.get(&"b").ok_or("b")?.as_array().ok_or("arr")?.to_vec()
        let b0 = arr.get(0).ok_or("b0")?.as_bool().ok_or("bool")?
        let b1 = arr.get(1).ok_or("b1")?.is_null()
        yield Ok(to_str((a == 1.0) && b0 && b1))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: JSN-parse-json-rejects-trailing-comma-in-value-channel
  category: json
  title: parse_json rejects trailing comma in value channel
  code: |
    import std::json::{parse_json, JsonError}

    fn main!() -> Res[Str, JsonError] =
      result {
        _ = parse_json("{\"a\":1,}")?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: JsonError

- id: JSN-parse-json-rounds-inexact-number-to-nearest-ties-even
  category: json
  title: parse_json rounds inexact number to nearest ties even
  code: |
    import std::json::{parse_json, stringify_json}

    fn main!() -> Res[Str, Str] =
      result {
        let j = parse_json("9007199254740993").map_err { |_| "parse" }?
        yield Ok(stringify_json(&j))
      }
  expect:
    value:
      kind: Ok
      repr: '"9007199254740992"'

- id: JSN-parse-json-accepts-finite-boundary-subnormal-and-signed-zero-underflow
  category: json
  title: parse_json accepts finite boundary subnormal and signed zero underflow
  code: |
    import std::json::{parse_json, stringify_json}

    fn main!() -> Res[Str, Str] =
      result {
        let largest = parse_json("1.7976931348623157e308").map_err { |_| "largest" }?
        let subnormal = parse_json("5e-324").map_err { |_| "subnormal" }?
        let positive_underflow = parse_json("1e-4000").map_err { |_| "positive_underflow" }?
        let negative_underflow = parse_json("-1e-4000").map_err { |_| "negative_underflow" }?
        let negative_zero = parse_json("-0").map_err { |_| "negative_zero" }?
        let ok = stringify_json(&largest) == "1.7976931348623157e308" &&
          stringify_json(&subnormal) == "5e-324" &&
          stringify_json(&positive_underflow) == "0" &&
          stringify_json(&negative_underflow) == "-0" &&
          stringify_json(&negative_zero) == "-0"
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

