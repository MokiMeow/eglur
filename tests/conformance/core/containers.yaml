      repr: '"ok"'
- id: CNT-map-uses-coherent-custom-eq-and-hash-implementations-for-key-identity
  category: containers
  title: Map uses coherent custom Eq and Hash implementations for key identity
  code: |
    import std::map::Map

    struct Key {
      field id: i64
      field label: Str
    }

    impl Eq for Key {
      fn eq(self: &Self, other: &Self) -> Bool = self.id == other.id
    }

    impl Hash for Key {
      fn hash(self: &Self, seed: u64) -> u64 =
        Hash.hash(&self.id, seed)
    }

    fn main!() -> Res[Str, Str] {
      let map = Map[Key,Str].new()
        .insert(Key{ id: 1, label: "first" }, "old")
        .insert(Key{ id: 1, label: "second" }, "new")
      let probe = Key{ id: 1, label: "probe" }
      yield Ok(to_str((map.len() == 1) && (map.get(&probe) == Some("new"))))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: CNT-map-accepts-required-structural-hash-key-families
  category: containers
  title: Map accepts required structural Hash key families
  code: |
    import std::map::Map

    fn main!() -> Res[Str, Str] {
      let tuple_map = Map[(i64,i64),Str].new().insert((1, 2), "tuple")

      let opt_key: Opt[i64] = Some(3)
      let opt_map = Map[Opt[i64],Str].new().insert(opt_key, "opt")

      let res_key: Res[i64,Str] = Ok(4)
      let res_map = Map[Res[i64,Str],Str].new().insert(res_key, "res")

      let seq_key: Seq[i64] = [5, 6]
      let seq_map = Map[Seq[i64],Str].new().insert(seq_key, "seq")

      let vec_key: Vec[i64] = [7, 8].to_vec()
      let vec_map = Map[Vec[i64],Str].new().insert(vec_key, "vec")

      yield Ok(to_str(
        (tuple_map.get(&(1, 2)).is_some()
        && opt_map.get(&Some(3)).is_some()
        && res_map.get(&Ok(4)).is_some()
        && seq_map.get(&[5, 6]).is_some()
        && vec_map.get(&[7, 8].to_vec()).is_some())
      ))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: CNT-map-float-keys-distinguish-signed-zero-and-support-nan-lookup
  category: containers
  title: Map float keys distinguish signed zero and support NaN lookup
  code: |
    import std::map::Map

    fn main!() -> Res[Str, Str] {
      let nan: f64 = 0.0 /. 0.0
      let negative_zero: f64 = -0.0
      let positive_zero: f64 = 0.0
      let map = Map[f64,Str].new()
        .insert(negative_zero, "negative")
        .insert(positive_zero, "positive")
        .insert(nan, "nan")
      yield Ok(to_str(
        ((map.len() == 3)
        && (map.get(&negative_zero) == Some("negative"))
        && (map.get(&positive_zero) == Some("positive"))
        && (map.get(&nan) == Some("nan")))
      ))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
