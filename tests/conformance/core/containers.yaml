- id: CNT-set-bang-insert-remove-success-flags-are-deterministic
  category: containers
  title: Set bang insert!/remove! success flags are deterministic
  code: |
    import std::set::Set
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      let mut s = Set[Str].new()
      emit!(to_str(s.insert!("x")))
      emit!(to_str(s.insert!("x")))
      emit!(to_str(s.remove!(&"x")))
      emit!(to_str(s.remove!(&"x")))
      emit!(to_str(s.len()))
      yield Ok("ok")
    }
  expect:
