- id: CNT-set-consuming-remove-returns-new-set-while-preserving-source-set
  category: containers
  title: Set consuming remove returns new set while preserving source set
  code: |
    import std::set::Set
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
