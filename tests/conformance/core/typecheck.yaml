- id: TYC-confined-raw-pointer-relay-allows-local-reuse-discard-and-mut-to-const-weakening
  category: typecheck
  title: confined raw pointer relay allows local reuse discard and mut to const weakening
  code: |
    extern "C" fn c_alloc_values() -> *mut f64
    extern "C" fn c_sum_values(values: *const f64) -> f64
    extern "C" fn c_free_values(values: *mut f64) -> Unit

    fn relay!(choose: Bool) -> f64 {
      yield unsafe {
        let values = if choose {
          yield c_alloc_values()
        } else {
          yield c_alloc_values()
        }
        let nested = unsafe { yield values }
        let alias = nested
        let selected = match choose {
          true => alias,
          false => alias,
        }
        let total = c_sum_values(selected)
        _ = alias
        let _ = alias
        alias
        c_free_values(values)
        c_free_values(c_alloc_values())
        yield total
      }
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    value:
      kind: Ok
      repr: '"x"'
