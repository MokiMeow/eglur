  title: Own ByteReader and Own ByteWriter method signatures type-check
  code: |
    import std::io::{ByteReader, ByteWriter, IoError, LinkMode, Path, with_reader!, with_writer!, write_bytes!}

    fn write_empty!(writer: &mut Own[ByteWriter]) -> Res[Unit, IoError] =
      result {
        _ = writer.write_all!(Vec[u8].new())?
        _ = writer.flush!()?
        yield Ok(())
      }

    fn read_once!(reader: &mut Own[ByteReader]) -> Res[Opt[Vec[u8]], IoError] =
      reader.read_chunk!(16)

    fn write_whole_file!(path: Path) -> Res[Unit, IoError] =
      write_bytes!(path, Vec[u8].new(), LinkMode::Follow)

    fn main!() -> Res[Str, ScopedFailure[IoError]] =
      result {
        let p = Path.from_str("__eglur_conformance_typecheck_stream.txt")
        _ = with_writer!(p, LinkMode::Follow) { |writer| write_empty!(writer) }?
        let c: Opt[Vec[u8]] = with_reader!(p, LinkMode::Follow) { |reader| read_once!(reader) }?
        yield Ok(to_str(c.is_some() || c.is_none()))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

