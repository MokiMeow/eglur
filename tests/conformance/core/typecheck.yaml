tests:
- id: TYC-assignment-target-mutability-precedes-value-mismatch
  category: typecheck
  title: immutable field target takes precedence over incompatible value
  code: |
    struct Cell { field value: i64 }
    fn invalid!(cell: &mut Cell) -> Unit {
      cell.value = true
    }
  expect:
    compile_error:
      code: IMMUTABLE_BINDING_ASSIGN
      message_contains: [immutable, assignment]
      data_keys: []

- id: TYC-assignment-nonstorage-target-precedes-value-mismatch
  category: typecheck
  title: call result is rejected as a target before checking the assigned value
  code: |
    fn value() -> i64 = 1
    fn invalid() -> Unit {
      value() = true
    }
  expect:
    compile_error:
      code: ASSIGN_TARGET_NOT_ASSIGNABLE
      message_contains: [assignment, target, assignable]
      data_keys: []

- id: TYC-assignment-annotation-mismatch-precedes-destructuring
  category: typecheck
  title: whole initializer annotation is checked before tuple destructuring
  code: |
    fn invalid() -> Unit {
      let (left, right): i64 = true // @primary incompatible-value
    }
  expect:
    compile_error:
      code: ASSIGNMENT_TYPE_MISMATCH
      message_contains: [assignment, type, mismatch]
      data_keys: [expected_type, actual_type]
      data_equals:
        expected_type: i64
        actual_type: Bool
      primary_span:
        marker: incompatible-value

- id: TYC-assignment-value-mismatch-precedes-effect-check
  category: typecheck
  title: initializer compatibility is checked before its downstream effect obligation
  code: |
    fn source!() -> Bool = true
    fn invalid() -> Unit {
      let value: i64 = source!() // @primary incompatible-value
    }
  expect:
    compile_error:
      code: ASSIGNMENT_TYPE_MISMATCH
      message_contains: [assignment, type, mismatch]
      data_keys: [expected_type, actual_type]
      data_equals:
        expected_type: i64
        actual_type: Bool
      primary_span:
        marker: incompatible-value

- id: TYC-assignment-compatible-values-preserve-storage-types
  category: typecheck
  title: aliases and compatible field dereference and local writes preserve values
  code: |
    type Count = i64
    struct Cell { field mut value: Count }
    fn update!(cell: &mut Cell, value: &mut i64) -> Unit {
      cell.value = 2
      *value = 3
    }
    fn main!() -> Res[Str, Str] {
      let mut cell = Cell{ value: 1 }
      let mut value: Count = 0
      update!(&mut cell, &mut value)
      value = 4
      yield Ok(concat([to_str(cell.value), "|", to_str(value)]))
    }
  expect:
    value:
      kind: Ok
      repr: '"2|4"'

- id: TYC-assignment-type-mismatch-annotated-local
