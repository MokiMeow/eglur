        Node::Link(_value, tail) => match tail.get() {
          Node::End => true,
          Node::Link(_, _) => false,
        },
        Node::End => false,
      }

    fn main!() -> Res[Str, Str] {
      let node = Node::Link(1, Box.new(Node::End))
