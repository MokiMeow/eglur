    import std::io::{LinkMode, Path, TextError, TextReader, TextWriter, with_text_reader!, with_text_writer!, write_lines!, write_text!}

    fn write_text!(writer: &mut Own[TextWriter]) -> Res[Unit, TextError] =
      result {
        _ = writer.write_str!("hello")?
        _ = writer.write_line!("world")?
        _ = writer.flush!()?
        yield Ok(())
      }

    fn read_text!(reader: &mut Own[TextReader]) -> Res[Opt[Str], TextError] =
      reader.read_line!()

    fn write_whole_text!(path: Path) -> Res[Unit, TextError] =
      write_text!(path, "", LinkMode::Follow)

    fn write_whole_lines!(path: Path) -> Res[Unit, TextError] =
      write_lines!(path, [""], LinkMode::Follow)

    fn main!() -> Res[Str, ScopedFailure[TextError]] =
      result {
        let p = Path.from_str("__eglur_conformance_typecheck_text_stream.txt")
        _ = with_text_writer!(p, LinkMode::Follow) { |writer| write_text!(writer) }?
        let line0: Opt[Str] = with_text_reader!(p, LinkMode::Follow) { |reader| read_text!(reader) }?
        yield Ok(to_str(line0.is_some() || line0.is_none()))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: TYC-scoped-standard-text-stream-wrappers-type-check-alongside-print-surfaces
