- id: TYC-unit-expression-const-and-let-pattern-typecheck
  category: typecheck
  title: Unit expression const and let pattern typecheck
  code: |
    const UNIT_VALUE: Unit = ()

    fn identity_unit(value: Unit) -> Unit = value

    fn main!() -> Res[Str, Str] {
      let () = UNIT_VALUE
      let value: Unit = ()
      let () = value
      let () = identity_unit(())
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
