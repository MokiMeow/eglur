- id: TYC-named-function-requires-explicit-return-type
  category: typecheck
  title: named function requires explicit return type
  code: |
    fn inc(x: i64) = wrapping_add(x, 1)

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: FN_RETURN_TYPE_REQUIRED
      message_contains:
      - return
      - type
      - required
      data_keys: []
- id: TYC-pub-fn-also-uses-named-function-return-type-rule
  category: typecheck
  title: pub fn also uses named function return-type rule
  code: |
    pub fn inc(x: i64) = wrapping_add(x, 1)

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: FN_RETURN_TYPE_REQUIRED
      message_contains:
      - return
      - type
      - required
      data_keys: []
- id: TYC-extern-declaration-requires-explicit-return-type
  category: typecheck
  title: extern declaration requires explicit return type
  code: |
    extern "C" fn c_no_result()

    fn main!() -> Res[Str, Str] {
      yield Ok("x")
    }
  expect:
    compile_error:
      code: FN_RETURN_TYPE_REQUIRED
      message_contains:
      - return
      - type
      - required
      data_keys: []
- id: TYC-local-binding-infers-from-initializer
  category: typecheck
  title: local binding infers from initializer
  code: |
    fn main!() -> Res[Str, Str] {
      let x = 40
      let y = wrapping_add(x, 2)
      yield Ok(to_str(y))
    }
  expect:
    value:
      kind: Ok
      repr: '"42"'
- id: TYC-nested-block-shadowing-uses-outer-in-initializer-and-restores-it
  category: typecheck
  title: nested block shadowing uses the outer binding in its initializer and restores it
  code: |
    fn main!() -> Res[Str, Str] {
      let value = 1
      let nested = {
        let value = wrapping_add(value, 1)
        yield value
      }
      yield Ok(to_str(wrapping_add(value, nested)))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: TYC-callable-body-may-shadow-parameter
  category: typecheck
  title: callable body local may shadow its parameter
  code: |
    fn increment(value: i64) -> i64 {
      let value = wrapping_add(value, 1)
      yield value
    }

    fn main!() -> Res[Str, Str] {
      yield Ok(to_str(increment(1)))
    }
  expect:
    value:
      kind: Ok
      repr: '"2"'
- id: TYC-for-binder-and-body-shadowing-have-nested-scopes
  category: typecheck
  title: for iterable outer binding, binder, and body shadow use nested scopes
  code: |
    fn main!() -> Res[Str, Str] {
      let item = 2
      let mut total = 0
      for item in [item] {
        let item = wrapping_add(item, 1)
        total = wrapping_add(total, item)
      }
      yield Ok(to_str(wrapping_add(item, total)))
    }
  expect:
    value:
      kind: Ok
      repr: '"5"'
- id: TYC-match-arm-and-block-shadowing-have-nested-scopes
  category: typecheck
  title: match guard, arm binding, and arm block shadow use nested scopes
  code: |
    fn main!() -> Res[Str, Str] {
      let value = 10
      let selected = match Some(2) {
        Some(value) if value > 1 => {
          let value = wrapping_add(value, 1)
          yield value
        },
        Some(value) => value,
        None => 0,
      }
      yield Ok(to_str(wrapping_add(value, selected)))
    }
  expect:
    value:
      kind: Ok
      repr: '"13"'
- id: TYC-closure-body-may-shadow-parameter-and-preserve-outer
  category: typecheck
  title: closure body local may shadow its parameter without replacing an outer binding
  code: |
    fn main!() -> Res[Str, Str] {
      let value = 10
      let increment: Fn(i64) -> i64 = { |value: i64|
        let value = wrapping_add(value, 1)
        value
      }
      yield Ok(to_str(wrapping_add(value, increment(2))))
    }
  expect:
    value:
      kind: Ok
      repr: '"13"'
- id: TYC-shadowing-keeps-existing-reference-target
  category: typecheck
  title: nested spelling shadow does not retarget an existing reference
  code: |
    fn main!() -> Res[Str, Str] {
      let value = 1
      let reference: &i64 = &value
      let nested = {
        let value = 2
        yield value
      }
      yield Ok(to_str(wrapping_add(*reference, nested)))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: TYC-later-closure-local-does-not-retroactively-prevent-capture
  category: typecheck
  title: later closure local is not hoisted over an earlier outer-binding capture
  code: |
    fn main!() -> Res[Str, Str] {
      let value = 4
      let combine: Fn() -> i64 = { ||
        let captured = value
        let value = 9
        wrapping_add(captured, value)
      }
      yield Ok(to_str(combine()))
    }
  expect:
    value:
      kind: Ok
      repr: '"13"'
- id: TYC-self-initializer-does-not-see-new-binding
  category: typecheck
  title: local binding is absent from its own initializer
  code: |
