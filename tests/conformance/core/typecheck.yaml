      let value = value // @primary unresolved-self-initializer
      yield Ok(to_str(value))
    }
  expect:
    compile_error:
      code: NAME_NOT_FOUND
      message_contains:
      - name
      - not found
      data_keys: []
      primary_span:
        marker: unresolved-self-initializer
- id: TYC-later-local-declaration-is-not-hoisted
  category: typecheck
  title: later local declaration is not visible at an earlier source position
  code: |
