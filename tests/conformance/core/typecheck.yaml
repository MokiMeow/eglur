  code: |
    import std::io::{TextError, TextReader, TextWriter, with_stdin!, with_stdout!, with_stderr!, print!, eprint!}

    fn read_signature!(input: &mut Own[TextReader]) -> Res[Opt[Str], TextError] =
      input.read_line!()

    fn write_signature!(output: &mut Own[TextWriter]) -> Res[Unit, TextError] =
      result {
        _ = output.write_str!("")?
        _ = output.flush!()?
        yield Ok(())
      }

    fn print_signature!() -> Res[Unit, TextError] = print!("")

    fn eprint_signature!() -> Res[Unit, TextError] = eprint!("")

    fn main!() -> Res[Str, Union[TextError, ScopedFailure[TextError]]] =
      result {
        _ = with_stdin! { |_input| result { yield Ok(()) } }?
        _ = with_stdout! { |output| write_signature!(output) }?
        _ = with_stderr! { |output| write_signature!(output) }?
        _ = print!("hello")?
        _ = eprint!("warn")?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

