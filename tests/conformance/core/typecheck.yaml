- id: TYC-processsnapshot-accessors-type-check-as-pure-views
  category: typecheck
  title: ProcessSnapshot accessors type-check as pure views
  code: |
    import std::io::{IoError, ProcessSnapshot, process_snapshot!}

    fn view(ps: &ProcessSnapshot) -> Res[Bool, IoError] =
      result {
        let i: Opt[Str] = ps.invocation_arg()?
        let a: Seq[Str] = ps.args()?
        let c: Path = ps.cwd()?
        let e: Opt[Str] = ps.env_get(&"PATH")?
        let invocation_shape = i.is_some() || i.is_none()
        yield Ok(invocation_shape && (a.len() >= 0) && (c.to_str() != "") && (e.is_some() || e.is_none()))
      }

    fn main!() -> Res[Str, IoError] =
      result {
        let ps = process_snapshot!()
        let observed = view(&ps)?
        yield Ok(to_str(observed))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: TYC-own-bytereader-and-own-bytewriter-method-signatures-type-check
