- id: NUM-checked-never-paths-retain-static-success-types
  category: scalar_numeric
  title: checked Never paths retain explicit or default static success types
  code: |
    import std::test::abort!

    fn explicit!() -> Res[Never, NumericError] = checked {
      yield abort!("RUNTIME_ABORT", "not executed")
    }

    fn default_unit!() -> Res[Unit, NumericError] = checked {
      abort!("RUNTIME_ABORT", "not executed")
    }

    fn main!() -> Res[Str, Str] = Ok("x")
  expect:
    value:
      kind: Ok
      repr: '"x"'
