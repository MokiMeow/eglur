# Suite: core/numeric.yaml

tests:
- id: NUM-checked-dynamic-arithmetic-returns-ok
  category: scalar_numeric
  title: checked dynamic arithmetic returns Ok
  code: |
    fn affine(a: i64, b: i64, c: i64) -> Res[i64, NumericError] =
      checked {
        let product = a * b
        yield product + c
      }

    fn main!() -> Res[Str, NumericError] =
      result {
        let value = affine(6, 7, 0)?
        yield Ok(to_str(value))
      }
  expect:
    value:
      kind: Ok
      repr: '"42"'

- id: NUM-checked-without-yield-returns-ok-unit
  category: scalar_numeric
  title: checked without yield returns Ok(())
  code: |
    fn noop() -> Res[Unit, NumericError] = checked {}

    fn main!() -> Res[Str, NumericError] =
      result {
        _ = noop()?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: NUM-checked-dynamic-overflow-returns-numericerror
  category: scalar_numeric
  title: checked dynamic overflow returns NumericError
  code: |
    fn double(x: i8) -> Res[i8, NumericError] =
      checked {
        yield x + x
      }

    fn main!() -> Res[Str, NumericError] =
      result {
        _ = double(64)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype

