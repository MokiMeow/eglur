- id: NUM-signed-division-and-remainder-truncate-quotient-toward-zero
  category: scalar_numeric
  title: signed division and remainder truncate quotient toward zero
  code: |
    fn div_rem(lhs: i64, rhs: i64) -> Res[(i64, i64), NumericError] =
      checked {
        let quotient = lhs / rhs
        let remainder = lhs % rhs
        yield (quotient, remainder)
      }

    fn main!() -> Res[Str, NumericError] =
      result {
        let pos_pos = div_rem(7, 3)?
        let neg_pos = div_rem(-7, 3)?
        let pos_neg = div_rem(7, -3)?
        let neg_neg = div_rem(-7, -3)?
        let ok = ((pos_pos.0 == 2) && (pos_pos.1 == 1)
          && (neg_pos.0 == -2) && (neg_pos.1 == -1)
          && (pos_neg.0 == -2) && (pos_neg.1 == 1)
          && (neg_neg.0 == 2) && (neg_neg.1 == -1))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

