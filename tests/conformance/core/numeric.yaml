- id: NUM-checked-body-does-not-inherit-outer-result-question-mark-context
  category: scalar_numeric
  title: checked body does not inherit outer result question mark context
  code: |
    fn source() -> Res[i64, Str] = Ok(1)

    fn main!() -> Res[Str, Union[Str, NumericError]] =
      result {
        let value = checked {
          let inner = source()?
          yield inner
        }?
        yield Ok(to_str(value))
      }
  expect:
    compile_error:
      code: Q_OUTSIDE_RESULT
      message_contains:
      - '?'
      - result
      data_keys: []

- id: NUM-scalar-wrapping-arithmetic-is-total-outside-checked
  category: scalar_numeric
  title: scalar wrapping arithmetic is total outside checked
  code: |
    fn main!() -> Res[Str, Str] {
      let max: i8 = 127
      let min: i8 = -128
      let add_wrapped = wrapping_add(max, 1)
      let sub_wrapped = wrapping_sub(min, 1)
      let mul_wrapped = wrapping_mul::[i8](64, 2)
      let ok = (add_wrapped == min) && (sub_wrapped == max) && (mul_wrapped == min)
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

