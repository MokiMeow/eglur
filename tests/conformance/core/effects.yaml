      pub struct Counter {
        field mut n: i64
      }

      pub fn counter() -> Counter = Counter{ n: 0 }

      fn record!(counter: &mut Counter) -> Unit {
        emit!("increment")
        counter.n = wrapping_add(counter.n, 1)
      }

      pub fn increment!(counter: &mut Counter) -> Unit {
        record!(counter)
      }
    app/main.eglur: |
      module app::main
      import app::state::{counter, increment!}

      fn run() -> i64 {
        let mut value = counter()
        increment!(&mut value)
        yield 1
      }

      fn main!() -> Res[Str, Str] {
        yield Ok(to_str(run()))
      }
  entry: app/main.eglur
  expect:
    compile_error:
      code: EFFECT_VIOLATION
      message_contains: []
      message_contains_any:
      - - non-bang
        - Fn
        - pure
      data_keys: []
- id: EFF-re-export-preserves-localizable-state-summary
  category: effects
  title: Re-export preserves localizable state summary
  file_set_root: .
  files:
    app/state.eglur: |
      module app::state

      pub struct Counter {
        field mut n: i64
      }

      pub fn counter() -> Counter = Counter{ n: 0 }

      pub fn increment!(counter: &mut Counter) -> Unit {
        counter.n = wrapping_add(counter.n, 1)
      }

      pub fn read(counter: &Counter) -> i64 = counter.n
    app/prelude.eglur: |
      module app::prelude
      pub import app::state::{counter, increment! as bump!, read}
    app/main.eglur: |
      module app::main
      import app::prelude::{counter, bump!, read}

      fn run() -> i64 {
        let mut value = counter()
        bump!(&mut value)
        yield read(&value)
      }

      fn main!() -> Res[Str, Str] {
        yield Ok(to_str(run()))
      }
  entry: app/main.eglur
  expect:
    value:
      kind: Ok
      repr: '"1"'
- id: EFF-concrete-trait-dispatch-uses-localizable-impl-summary
  category: effects
  title: Concrete trait dispatch uses localizable impl summary
  code: |
    trait Step {
      fn step!(self: &mut Self) -> Unit
    }

    struct Counter {
      field mut n: i64
    }

    impl Step for Counter {
      fn step!(self: &mut Self) -> Unit {
