tests:
- id: EFF-non-bang-function-cannot-call-print
  category: effects
  title: Non-bang function cannot call print!
  code: |
    import std::io::print!

    fn f(x: i64) -> i64 {
      print!("hi")
      yield x
    }

    fn main!() -> Res[Str, Str] {
      yield Ok("unreachable")
    }
  expect:
    compile_error:
      code: EFFECT_VIOLATION
      message_contains: []
      message_contains_any:
      - - non-bang
        - Fn
        - pure
      data_keys: []
- id: EFF-bang-function-may-call-print
  category: effects
  title: Bang function may call print!
  code: |
    import std::io::print!

    fn f!(x: i64) -> i64 {
      print!("hi")
      yield x
    }

    fn main!() -> Res[Str, Str] {
      let r = f!(1)
      yield Ok(to_str(r))
    }
  expect:
    value:
      kind: Ok
      repr: '"1"'
- id: EFF-non-bang-method-cannot-take-mut-self
  category: effects
  title: Non-bang method cannot take &mut self
  code: |
    struct C {
      field mut n: i64
      fn inc(self: &mut Self) -> i64 = self.n
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: EFFECT_SIGNATURE
      message_contains:
      - '&mut Self'
      data_keys: []
- id: EFF-bang-method-must-take-mut-self
  category: effects
  title: Bang method must take &mut self
  code: |
    struct C {
      field mut n: i64
      fn inc!(self: &Self) -> i64 = 1
    }

    fn main!() -> Res[Str, Str] { yield Ok("x") }
  expect:
    compile_error:
      code: EFFECT_SIGNATURE
      message_contains:
      - '&mut Self'
      data_keys: []
- id: EFF-legacy-sorted-should-not-exist-use-sort
  category: effects
  title: Legacy sorted() should not exist; use sort()
  code: |
    import std::vec::Vec

    fn main!() -> Res[Str, Str] {
      let v = Vec[i64].new().push(3).push(1)
      v.sorted()   // legacy name is not part of v0.1
      yield Ok("x")
    }
  expect:
    compile_error:
      code: METHOD_NOT_FOUND
      message_contains: []
      data_keys: []
- id: EFF-tap-returns-original-value-unchanged
  category: effects
  title: tap! returns original value unchanged
  code: |
    import std::test::emit!

    fn main!() -> Res[Str, Str] {
      let x = (3).tap! { |_| emit!("seen") }
      yield Ok(to_str(x))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
    side_effects:
    - seen
