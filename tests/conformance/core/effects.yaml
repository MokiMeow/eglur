- id: EFF-bang-sleep-can-consume-composed-duration-from-baseline-constructors-and-arithmetic
  category: effects
  title: bang sleep! can consume composed Duration from baseline constructors and arithmetic
  code: |
    import std::time::{sleep!, Duration, TimeError}

    fn main!() -> Res[Str, TimeError] =
      result {
        let d0 = Duration.millis(2)?
        let d1 = d0.add(Duration.nanos(500_000)?)?
        let d2 = d1.mul(2)?
        let d3 = d2.div(2)?
        let d4 = d3.scale(1.0)?
        sleep!(d4)
        yield Ok(to_str(d4.as_nanos()))
      }
  expect:
    value:
      kind: Ok
      repr: '"2500000"'
