- id: EFF-path-lexical-helpers-remain-usable-in-non-bang-context
  category: effects
  title: Path lexical helpers remain usable in non-bang context
  code: |
    import std::io::Path

    fn build() -> Str {
      let base = Path.from_str("/tmp")
      let child = Path.from_str("x.txt")
      let p = base.join(&child)
      let par = p.parent().map { _.to_str() }.unwrap_or("none")
      let ext = p.extension().unwrap_or("none")
      yield concat([par, "|", ext])
    }

    fn main!() -> Res[Str, Str] {
      yield Ok(build())
    }
  expect:
    value:
      kind: Ok
      repr: '"/tmp|txt"'
