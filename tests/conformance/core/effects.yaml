- id: EFF-imported-localizable-state-summary-allows-non-bang-local-call
  category: effects
  title: Imported localizable state summary allows non-bang local call
  file_set_root: .
  files:
    app/state.eglur: |
      module app::state

      pub struct Counter {
        field mut n: i64
      }

      pub fn counter() -> Counter = Counter{ n: 0 }

      pub fn increment!(counter: &mut Counter) -> Unit {
        counter.n = wrapping_add(counter.n, 1)
      }

      pub fn read(counter: &Counter) -> i64 = counter.n
    app/main.eglur: |
      module app::main
      import app::state::{counter, increment!, read}

      fn run() -> i64 {
        let mut value = counter()
        increment!(&mut value)
        yield read(&value)
      }

      fn main!() -> Res[Str, Str] {
        yield Ok(to_str(run()))
      }
  entry: app/main.eglur
  expect:
    value:
      kind: Ok
      repr: '"1"'
