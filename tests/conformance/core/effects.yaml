- id: EFF-snapshot-accessors-are-pure-after-bang-capture
  category: effects
  title: Snapshot accessors are pure after bang capture
  code: |
    import std::io::{process_snapshot!, ProcessSnapshot, IoError}

    fn read_snapshot(ps: &ProcessSnapshot) -> Res[Str, IoError] =
      result {
        let args = ps.args()?
        let cwd = ps.cwd()?
        yield Ok(concat([to_str(args.len()), "|", cwd.to_str()]))
      }

    fn main!() -> Res[Str, IoError] =
      result {
        let ps = process_snapshot!()
        let out = read_snapshot(&ps)?
        yield Ok(to_str(out != ""))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
