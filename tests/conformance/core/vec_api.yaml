- id: VEC-retain-bang-invokes-effectful-predicate-once-in-original-order
  category: vec
  title: Vec retain! invokes its effectful predicate once in original order
  code: |
    import std::vec::Vec
    import std::test::emit!

    fn keep!(x: i64) -> Bool {
      emit!(to_str(x))
      yield x % 2 != 0
    }

    fn main!() -> Res[Str, Str] {
      let mut v = Vec[i64].new().extend([3,1,2,1])
      v.retain! { keep!(_) }
      yield Ok(to_str(v))
    }
  expect:
    side_effects:
    - '3'
    - '1'
    - '2'
    - '1'
    value:
      kind: Ok
      repr: '"[3,1,1]"'

- id: VEC-sort-by-bang-rejects-effectful-key-callback
  category: vec
  title: Vec sort_by! rejects an effectful key callback
  code: |
    import std::vec::Vec
    import std::test::emit!

    fn key!(x: i64) -> i64 {
      emit!(to_str(x))
      yield x
    }

    fn main!() -> Res[Str, Str] {
      let mut v = Vec[i64].new().extend([2,1])
      v.sort_by! { key!(_) }
      yield Ok("unreachable")
    }
  expect:
    compile_error:
      code: PURE_COMBINATOR_EFFECTFUL_CALLBACK
      message_contains:
      - effectful callback
      data_keys: []
