- id: VEC-vec-sort-by-uses-nan-last-total-order-and-keeps-nan-encounter-order
  category: vec
  title: Vec sort_by uses NaN-last total order and keeps NaN encounter order
  code: |
    import std::vec::Vec

    struct Row {
      field k: f32
      field id: i64
    }

    fn main!() -> Res[Str, Str] {
      let nanv: f32 = 0.0 /. 0.0
      let v = Vec[Row].new()
        .push(Row{ k: 1.0, id: 10 })
        .push(Row{ k: nanv, id: 20 })
        .push(Row{ k: -2.0, id: 30 })
        .push(Row{ k: nanv, id: 40 })
      let ids = v.sort_by { _.k }.map { _.id }
      yield Ok(to_str(ids))
    }
  expect:
    value:
      kind: Ok
      repr: '"[30,10,20,40]"'

