- id: PAR-parenthesized-group-owns-leading-binary-newlines
  category: parser
  title: parenthesized groups own leading newlines for every binary operator
  code: |
    fn add(left: i64, right: i64) -> i64 = wrapping_add(left, right)

    fn main!() -> Res[Str, Str] {
      let quotient = (
        20
    / 4
      )
      let fractional = (
        5
    /. 2
      )
      let remainder = (
        20
    % 6
      )
      let sum = (
        quotient
    + remainder
      )
      let difference = (
        sum
    - 1
      )
      let product = (
        difference
    * 2
      )
      let equal = (
        difference
    == 6
      )
      let unequal = (
        difference
    != 7
      )
      let less = (
        difference
    < 7
      )
      let less_equal = (
        difference
    <= 6
      )
      let greater = (
        difference
    > 5
      )
      let greater_equal = (
        difference
    >= 6
      )
      let both = (
        equal
    && unequal
      )
      let either = (
        false
    || both
      )
      let nested = add(
        (
          1
          + 2
        ),
        3,
      )
      let mut exclusive_total = 0
      for value in (
        0
    .. 3
      ) {
        exclusive_total = wrapping_add(exclusive_total, value)
      }
      let mut inclusive_total = 0
      for value in (
        0
    ..= 2
      ) {
        inclusive_total = wrapping_add(inclusive_total, value)
      }
      let ok = (
        either
        && less
        && less_equal
        && greater
        && greater_equal
        && (product == 12)
        && (nested == 6)
        && (fractional == 2.5)
        && (exclusive_total == 3)
        && (inclusive_total == 3)
      )
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'

