- id: PAR-match-arm-arrow-owns-following-newlines
  category: parser
  title: match arm arrow owns following newlines
  code: |
    fn main!() -> Res[Str, Str] {
      let value = match Some(3) {
        Some(n) =>
          wrapping_add(n, 1),
        None => 0,
      }
      yield Ok(to_str(value))
    }
  expect:
    value:
      kind: Ok
      repr: '"4"'
- id: PAR-match-arm-body-requires-an-expression
