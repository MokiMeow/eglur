tests:
- id: PAR-multiplicative-precedence-is-higher-than-additive
  category: parser
  title: multiplicative precedence is higher than additive
  code: |
    fn main!() -> Res[Str, Str] {
      let x = 1 + 2 * 3
      yield Ok(to_str(x))
    }
  expect:
    value:
      kind: Ok
      repr: '"7"'
- id: PAR-function-expression-body-with-equals-form-parses
  category: parser
  title: function expression body with equals form parses
  code: |
    fn inc(x: i64) -> i64 =
      wrapping_add(x, 1)

    fn main!() -> Res[Str, Str] {
      yield Ok(to_str(inc(2)))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: PAR-unary-tuple-expression-type-and-pattern-parse
  category: parser
  title: unary tuple expression type and pattern parse
  code: |
    fn main!() -> Res[Str, Str] {
      let p: (i64,) = (7,)
      let (x,) = p
      yield Ok(to_str(x))
    }
  expect:
    value:
      kind: Ok
      repr: '"7"'
- id: PAR-unit-expression-and-pattern-parse
  category: parser
  title: Unit expression and pattern parse
  code: |
    fn main!() -> Res[Str, Str] {
      let value: Unit = ()
      let out = match value {
        () => "unit",
      }
      yield Ok(out)
    }
  expect:
    value:
      kind: Ok
      repr: '"unit"'
- id: PAR-range-bounds-parse-with-additive-expressions
  category: parser
  title: range bounds parse with additive expressions
  code: |
    fn main!() -> Res[Str, Str] {
      let mut s = 0
      for i in 1+1 ..= 1+3 {
        s = wrapping_add(s, i)
      }
      yield Ok(to_str(s))
    }
  expect:
    value:
      kind: Ok
      repr: '"9"'
- id: PAR-unexpected-token-reports-parse-diagnostic
  category: parser
  title: unexpected token reports parse diagnostic
  code: |
    fn main!() -> Res[Str, Str] {
      ,
      yield Ok("x")
    }
  expect:
    compile_error:
      code: PARSE_UNEXPECTED_TOKEN
      message_contains:
      - parse
      - unexpected
      - token
      data_keys: []
- id: PAR-unclosed-delimiter-reports-parse-diagnostic
  category: parser
  title: unclosed delimiter reports parse diagnostic
  code: |
    fn main!() -> Res[Str, Str] {
      let x = (1 + 2
      yield Ok(to_str(x))
    }
  expect:
    compile_error:
      code: PARSE_UNCLOSED_DELIMITER
      message_contains:
      - parse
      - unclosed
      - delimiter
      data_keys: []
- id: PAR-recursive-parser-budget-reports-resource-limit
  category: parser
  title: recursive parser budget reports a structured resource limit
  code: |
    fn main() -> Bool = !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!true
  expect:
    compile_error:
      code: PARSE_RESOURCE_LIMIT_EXCEEDED
      message_contains:
      - parse
      - resource
      - limit
      - exceeded
      data_keys:
      - resource
      - limit
      - observed_at_least
      data_equals:
        resource: recursive_depth
        limit: 256
        observed_at_least: 257
- id: PAR-missing-expression-reports-parse-diagnostic
  category: parser
  title: missing expression reports parse diagnostic
  code: |
    fn main!() -> Res[Str, Str] {
      let x =
      yield Ok("x")
    }
  expect:
    compile_error:
      code: PARSE_EXPECTED_EXPRESSION
      message_contains:
      - parse
      - expected
      - expression
      data_keys: []
- id: PAR-empty-parenthesized-type-is-rejected
