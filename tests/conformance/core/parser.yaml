- id: PAR-enum-declaration-with-named-payload-variant-parses-and-matches
  category: parser
  title: enum declaration with named payload variant parses and matches
  code: |
    enum Token {
      Number { value: i64, neg: Bool }
      End
    }

    fn main!() -> Res[Str, Str] {
      let t = Token::Number { value: 3, neg: false }
      let out = match t {
        Token::Number { value, neg } => if neg { yield wrapping_sub(0, value) } else { yield value },
        Token::End => 0,
      }
      yield Ok(to_str(out))
    }
  expect:
    value:
      kind: Ok
      repr: '"3"'
