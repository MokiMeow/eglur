- id: PAR-missing-match-arm-pattern-reports-parse-diagnostic
  category: parser
  title: missing match arm pattern reports parse diagnostic
  code: |
    fn main!() -> Res[Str, Str] {
      let x = Some(1)
      let y = match x {
        => 0,
        Some(v) => v,
        None => 0,
      }
      yield Ok(to_str(y))
    }
  expect:
    compile_error:
      code: PARSE_EXPECTED_PATTERN
