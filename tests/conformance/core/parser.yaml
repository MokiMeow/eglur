        Some(value) => yield Ok(to_str(value)),
        None => Ok("none"),
      }
    }
  expect:
    compile_error:
      code: PARSE_EXPECTED_EXPRESSION
      message_contains:
      - parse
      - expected
      - expression
      data_keys: []
- id: PAR-positional-rest-must-be-tail-position
  category: parser
  title: positional rest must be tail position
  code: |
    fn main!() -> Res[Str, Str] {
      let t = (1,2,3)
      let y = match t {
