- id: TRV-group-by-preserves-key-encounter-order-and-group-encounter-order
  category: traverse
  title: group_by preserves key encounter order and group encounter order
  code: |
    fn main!() -> Res[Str, Str] =
      result {
        let g = [3,1,4,2,5].group_by { _ % 2 }
        let keys = g.keys().to_vec()
        let odds = g.get(&1).ok_or("missing odds")?
        let evens = g.get(&0).ok_or("missing evens")?
        yield Ok(to_str([keys, odds, evens]))
      }
  expect:
    value:
      kind: Ok
      repr: '"[[1,0],[3,1,5],[4,2]]"'
- id: TRV-bang-filter-map-find-map-and-group-by-evaluate-left-to-right
  category: traverse
  title: bang filter_map find_map and group_by evaluate left-to-right
  code: |
    import std::test::emit!

    fn keep_even!(x: i64) -> Opt[i64] {
      emit!(f"f({x})")
      if (x % 2) == 0 {
        return Some(wrapping_mul(x, 10))
      }
      return None
    }

    fn first_hit!(x: i64) -> Opt[i64] {
      emit!(f"m({x})")
      if x == 3 {
        return Some(x)
      }
      return None
    }

    fn parity_key!(x: i64) -> i64 {
      emit!(f"g({x})")
      return x % 2
    }

    fn main!() -> Res[Str, Str] =
      result {
        let kept = [1,2,3,4].filter_map! { keep_even!(_) }
        let hit = [1,2,3,4].find_map! { first_hit!(_) }
        let grouped = [3,1,4,2].group_by! { parity_key!(_) }
        let odds = grouped.get(&1).ok_or("missing odds")?
        let evens = grouped.get(&0).ok_or("missing evens")?
        yield Ok(to_str([kept, [hit.unwrap_or(0)], odds, evens]))
      }
  expect:
    value:
      kind: Ok
      repr: '"[[20,40],[3],[3,1],[4,2]]"'
    side_effects:
    - f(1)
    - f(2)
    - f(3)
    - f(4)
    - m(1)
    - m(2)
    - m(3)
    - g(3)
    - g(1)
    - g(4)
    - g(2)
