# Suite: core/traverse.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Structured diagnostics use code/message/data assertions.

tests:
- id: TRV-traverse-res-success-collects-ok-values
  category: traverse
  title: traverse_res success collects Ok values
  code: |
    fn f(x: i64) -> Res[i64, Str] = Ok(wrapping_mul(x, 2))

    fn main!() -> Res[Str, Str] =
      result {
        let xs = [1,2,3].traverse_res { f(_) }?
        yield Ok(to_str(xs))
      }
  expect:
    value:
      kind: Ok
      repr: '"[2,4,6]"'
- id: TRV-traverse-res-is-left-to-right-and-fail-fast
  category: traverse
  title: traverse_res! is left-to-right and fail-fast
  code: |
    import std::test::emit!

    fn f!(x: i64) -> Res[i64, Str] {
      emit!(f"f({x})")
      yield if x == 2 { yield Err("bad") } else { yield Ok(x) }
    }

    fn main!() -> Res[Str, Str] =
      result {
        _ = [1,2,3].traverse_res! { f!(_) }?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: '"bad"'
    value_diagnostics:
    - code: TRAVERSE_RES_FAIL
      message_contains:
      - index 1
      data_keys:
      - index
    side_effects:
    - f(1)
    - f(2)
- id: TRV-sequence-res-collects-ok-values
  category: traverse
  title: sequence_res collects Ok values
  code: |
    fn main!() -> Res[Str, Str] =
