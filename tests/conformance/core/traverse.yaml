  code: |
    fn fm(x: i64) -> Res[Opt[i64], Str] {
      yield if x == 4 {
        yield Err("stop")
      } else if (x % 2) == 0 {
        yield Ok(Some(x))
      } else {
        yield Ok(None)
      }
    }

    fn pp(x: i64) -> Res[Bool, Str] = Ok((x % 2) == 0)

    fn main!() -> Res[Str, Str] =
      result {
        let (left, right) = [3,1,4,2,5].partition_res { pp(_) }?
        _ = [1,2,3,4,5].filter_map_res { fm(_) }?
        yield Ok(concat([to_str(left), "|", to_str(right)]))
      }
  expect:
    value:
      kind: Err
      repr: '"stop"'
    value_diagnostics:
    - code: TRAVERSE_RES_FAIL
      message_contains:
      - index 3
      data_keys:
      - index
