      }
  expect:
    value:
      kind: Err
      repr: '"e"'
    value_diagnostics:
    - code: TRAVERSE_RES_FAIL
      message_contains:
      - index 1
      data_keys:
      - index
- id: TRV-traverse-opt-stops-at-first-none-and-does-not-evaluate-later
  category: traverse
  title: traverse_opt! stops at first None and does not evaluate later
  code: |
    import std::test::emit!

    fn g!(x: i64) -> Opt[i64] {
      emit!(f"g({x})")
      yield if x == 2 { yield None } else { yield Some(x) }
    }

    fn main!() -> Res[Str, Str] =
      result {
        let r = [1,2,3].traverse_opt! { g!(_) }
        _ = r.ok_or("none")?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: '"none"'
    side_effects:
    - g(1)
    - g(2)
