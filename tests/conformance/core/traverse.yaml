  code: |
    fn main!() -> Res[Str, Str] {
      let flat = [1,2,3].flat_map { |x| [x, wrapping_add(x, 10)] }
      let dropped = [1,2,3,4].drop(2)
      let kept = [1,2,3,1].drop_while { _ < 3 }
      let set_items = [2,1,2].to_set().items().to_vec()
      yield Ok(to_str([flat, dropped, kept, set_items]))
    }
  expect:
    value:
      kind: Ok
      repr: '"[[1,11,2,12,3,13],[3,4],[3,1],[2,1]]"'
