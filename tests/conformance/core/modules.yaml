- id: MOD-package-public-api-rejects-private-import-of-foreign-type
  category: modules
  title: package public API rejects a private import of a foreign type
  files:
    Eglur.toml: |
      [package]
      name = "app"
      version = "0.1.0"

      [dependencies]
      facade = { path = "deps/facade" }
      model = { path = "deps/model" }
    Eglur.lock: |
      version = 1
      root = "$root"

      [[packages]]
      node = "$root"
      name = "app"
      version = "0.1.0"
      source = "root"

      [packages.dependencies]
      facade = { target = "$root/facade", path = "deps/facade" }
      model = { target = "$root/model", path = "deps/model" }

      [[packages]]
      node = "$root/facade"
      name = "facade"
      version = "1.0.0"
      source = "path"

      [packages.dependencies]
      model = { target = "$root/model", path = "../model" }

      [[packages]]
      node = "$root/model"
      name = "model"
      version = "1.0.0"
      source = "path"
    src/main.eglur: |
      module main

      fn main!() -> Res[Str, Str] {
        yield Ok("unreachable")
      }
    deps/facade/Eglur.toml: |
      [package]
      name = "facade"
      version = "1.0.0"

      [dependencies]
      model = { path = "../model" }
    deps/facade/src/api.eglur: |
      module api
      import model::types::Token

      type InternalToken = Token
      pub fn pass(token: InternalToken) -> InternalToken = token // @primary foreign-private-import
    deps/model/Eglur.toml: |
      [package]
      name = "model"
      version = "1.0.0"
    deps/model/src/types.eglur: |
      module types

      pub struct Token {
        pub field value: i64
      }
  entry: src/main.eglur
  expect:
    compile_error:
      code: VISIBILITY_VIOLATION
      message_contains:
      - visibility
      - private
      data_keys: []
      primary_span:
        marker: foreign-private-import
