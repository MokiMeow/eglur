- id: MOD-local-declaration-shadows-imported-name
  category: modules
  title: local declaration shadows imported name
  code: |
    import std::parse::parse_int

    fn parse_int(_s: Str) -> Res[i64, Str] = Ok(9)

    fn main!() -> Res[Str, Str] =
      result {
        let x = parse_int("1")?
        yield Ok(to_str(x))
      }
  expect:
    value:
      kind: Ok
      repr: '"9"'
- id: MOD-duplicate-imported-binding-name-is-ambiguous
  category: modules
  title: duplicate imported binding name is ambiguous
  code: |
    import std::parse::parse_int as parse
    import std::parse::parse_f64 as parse

    fn main!() -> Res[Str, Str] {
      _ = parse("1")
      yield Ok("x")
    }
  expect:
    compile_error:
      code: NAME_AMBIGUOUS
      message_contains:
      - ambiguous
      - name
      data_keys: []
- id: MOD-cyclic-type-aliases-are-rejected
  category: modules
  title: cyclic type aliases are rejected
  code: |
