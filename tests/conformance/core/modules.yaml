- id: MOD-package-public-conformance-rejects-unbridged-foreign-target
  category: modules
  title: package public conformance rejects an unbridged foreign target
  files:
    Eglur.toml: |
      [package]
      name = "facade"
      version = "0.1.0"

      [dependencies]
      model = { path = "deps/model" }
    Eglur.lock: |
      version = 1
      root = "$root"

      [[packages]]
      node = "$root"
      name = "facade"
      version = "0.1.0"
      source = "root"

      [packages.dependencies]
      model = { target = "$root/model", path = "deps/model" }

      [[packages]]
      node = "$root/model"
      name = "model"
      version = "1.0.0"
      source = "path"
    src/api.eglur: |
      module api
      import model::types::Token

      pub trait Label {
        fn label(self: &Self) -> i64
