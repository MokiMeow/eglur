- id: MOD-public-property-and-method-expose-private-storage-without-leaking-it
  category: modules
  title: public property and method expose private storage without leaking it
  file_set_root: .
  files:
    app/model.eglur: |
      module app::model

      pub struct Counter {
        field mut n: i64

        pub prop mut count: i64 {
          fn get_count(self: &Self) -> i64 = self.n

          fn set_count!(self: &mut Self, value: i64) -> Unit {
            self.n = value
          }
        }

        pub fn doubled(self: &Self) -> i64 = wrapping_add(self.n, self.n)
      }

      pub fn make_counter(value: i64) -> Counter = Counter{ n: value }
    app/main.eglur: |
      module app::main
      import app::model::{Counter, make_counter}

      fn main!() -> Res[Str, Str] {
        let mut counter: Counter = make_counter(2)
        let before = counter.count
        counter.set_count!(4)
        let after = counter.get_count()
        yield Ok(to_str(wrapping_add(before, wrapping_add(after, Counter.doubled(&counter)))))
      }
  entry: app/main.eglur
  expect:
    value:
      kind: Ok
      repr: '"14"'
