- id: MOD-package-mode-allows-importing-modules-from-direct-path-dependency
  category: modules
  title: package mode allows importing modules from direct path dependency
  files:
    Eglur.toml: |
      [package]
      name = "app"
      version = "0.1.0"

      [dependencies]
      dep_math = { path = "deps/dep_math" }
    Eglur.lock: |
      version = 1
      root = "$root"

      [[packages]]
      node = "$root"
      name = "app"
      version = "0.1.0"
      source = "root"

      [packages.dependencies]
      dep_math = { target = "$root/dep_math", path = "deps/dep_math" }

      [[packages]]
      node = "$root/dep_math"
      name = "dep_math"
      version = "1.0.0"
      source = "path"
    src/main.eglur: |
      module main
      import dep_math::api::double

      fn main!() -> Res[Str, Str] {
        yield Ok(to_str(double(3)))
      }
    deps/dep_math/Eglur.toml: |
      [package]
      name = "dep_math"
      version = "1.0.0"
    deps/dep_math/src/api.eglur: |
      module api

      pub fn double(x: i64) -> i64 = x * 2
  entry: src/main.eglur
  expect:
    value:
      kind: Ok
      repr: '"6"'
