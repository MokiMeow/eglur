tests:
- id: NRT-integer-neg-minimum-value-fails-with-int-overflow
  category: tensor_numeric_runtime
  title: integer neg minimum value fails with INT_OVERFLOW
  code: |
    import std::tensor::{DTypeError, NumericError, ShapeError, Tensor, ones}
    import std::tensor::prim::{neg, wrapping_add}

    fn min_i8() -> Res[Tensor[i8], Union[ShapeError, DTypeError]] =
      result {
        let mut x = ones[i8](1)
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        yield Ok(x)
      }

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError]] =
      result {
        let x = min_i8()?
        _ = neg(x)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype

