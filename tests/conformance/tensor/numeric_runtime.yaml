- id: NRT-signed-division-and-remainder-truncate-quotient-toward-zero
  category: tensor_numeric_runtime
  title: signed division and remainder truncate quotient toward zero
  code: |
    import std::tensor::{DTypeError, IndexError, NumericError, ShapeError, ones}
    import std::tensor::prim::{add, div, neg, rem}

    fn main!() -> Res[Str, Union[DTypeError, IndexError, NumericError, ShapeError]] =
      result {
        let one = ones[i8]()
        let two = add(one, one)?
        let three = add(two, one)?
        let six = add(three, three)?
        let seven = add(six, one)?
        let neg_seven = neg(seven)?
        let neg_three = neg(three)?

        let pos_pos_q = div(seven, three)?.item()?
        let pos_pos_r = rem(seven, three)?.item()?
        let neg_pos_q = div(neg_seven, three)?.item()?
        let neg_pos_r = rem(neg_seven, three)?.item()?
        let pos_neg_q = div(seven, neg_three)?.item()?
        let pos_neg_r = rem(seven, neg_three)?.item()?
        let neg_neg_q = div(neg_seven, neg_three)?.item()?
        let neg_neg_r = rem(neg_seven, neg_three)?.item()?

        let ok = ((pos_pos_q == 2) && (pos_pos_r == 1)
          && (neg_pos_q == -2) && (neg_pos_r == -1)
          && (pos_neg_q == -2) && (pos_neg_r == 1)
          && (neg_neg_q == 2) && (neg_neg_r == -1))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

