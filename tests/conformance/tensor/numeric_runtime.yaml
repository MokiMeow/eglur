- id: NRT-signed-zero-semantics-distinguish-0-and-0-in-float-division
  category: tensor_numeric_runtime
  title: signed-zero semantics distinguish +0 and -0 in float division
  code: |
    import std::tensor::{CastError, DTypeError, IndexError, NumericError, ShapeError, i32, ones, zeros}
    import std::tensor::prim::sub
    import std::tensor::prim::mul
    import std::tensor::prim::div
    import std::tensor::prim::max
    import std::tensor::prim::astype
    import std::tensor::index::{get_at, IndexItem}

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError, CastError, IndexError]] =
      result {
        let z = zeros[f32](1)
        let o = ones[f32](1)
        let neg = sub(z, o)?
        let neg_zero = mul(z, neg)?
        let q = div(o, neg_zero)?
        let m = max(q, z)?
        let i = astype(m, i32)?
        let s = get_at(i, [IndexItem::At(0)].to_vec())?
        let v = s.item()?
        yield Ok(to_str(v))
      }
  expect:
    value:
      kind: Ok
      repr: '"0"'

