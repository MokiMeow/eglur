- id: NRT-integer-to-bool-cast-rejects-non-0-1-values-with-cast-invalid-value
  category: tensor_numeric_runtime
  title: integer to bool cast rejects non-0/1 values with CAST_INVALID_VALUE
  code: |
    import std::tensor::{CastError, DTypeError, NumericError, ShapeError, bool, ones}
    import std::tensor::prim::{add, astype}

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError, CastError]] =
      result {
        let x = ones[i32](1)
        let y = add(x, x)?
        _ = astype(y, bool)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: CastError
    value_diagnostics:
    - code: CAST_INVALID_VALUE
      message_contains:
      - cast
      - invalid
      - value
      data_keys:
      - src_dtype
      - dst_dtype
