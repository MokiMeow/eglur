- id: RDX-empty-reduction-keepdims-retains-size-one-axis-and-name
  category: tensor_reduce
  title: empty reduction keepdims retains size-one axis and name
  code: |
    import std::tensor::{AxisError, DTypeError, IndexError, NumericError, ShapeError, zeros}
    import std::tensor::prim::{mean, sum}

    fn main!() -> Res[Str, Union[AxisError, DTypeError, IndexError, NumericError, ShapeError]] =
      result {
        let x = zeros[f32](2,0).with_names([#0:'batch, #1:'feature])?
        let summed = sum(x, 'feature, keepdims=true)?
        let average = mean(x, 'feature, keepdims=true)?
        let average_total = sum(average, [#0, #1].to_vec())?.item()?
        let positive_infinity: f32 = 1.0 /. 0.0
        let ok = ((to_str(summed.shape()) == "[2,1]")
          && (to_str(average.shape()) == "[2,1]")
          && (summed.axis_of('feature)? == #1)
          && (average.axis_of('feature)? == #1)
          && (average_total > positive_infinity))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RDX-empty-reduce-by-subtensors-are-passed-to-the-callback
  category: tensor_reduce
  title: empty reduce_by subtensors are passed to the callback
  code: |
    import std::tensor::{Tensor, TensorView, TransformError, zeros}

    fn empty_to_seven(values: TensorView[i32]) -> Res[i32, Str] =
      if to_str(values.shape()) == "[0]" { yield Ok(7) } else { yield Err("not_empty") }

    fn main!() -> Res[Tensor[i32], Union[Str, TransformError]] =
      reduce{ batch feature -> batch }.reduce_by(empty_to_seven)(zeros[i32](2,0))
  expect:
    value:
      kind: Ok
      numeric_compare:
