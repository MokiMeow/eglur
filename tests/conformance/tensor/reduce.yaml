- id: RDX-empty-primitive-sum-uses-additive-identities-in-result-dtype
  category: tensor_reduce
  title: empty primitive sum uses additive identities in result dtype
  code: |
    import std::parse::{parse_complex64, ParseError}
    import std::tensor::{AxisError, DTypeError, IndexError, NumericError, ShapeError, zeros}
    import std::tensor::prim::sum

    fn main!() -> Res[Str, Union[AxisError, DTypeError, IndexError, NumericError, ParseError, ShapeError]] =
      result {
        let integer_zero = sum(zeros[i32](0), #0)?.item()?
        let floating_zero = sum(zeros[f32](0), #0)?.item()?
        let complex_zero = sum(zeros[complex64](0), #0)?.item()?
        let expected_complex_zero = parse_complex64("(0.0,0.0)")?
        let ok = ((integer_zero == 0)
          && (floating_zero == 0.0)
          && (complex_zero == expected_complex_zero))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

