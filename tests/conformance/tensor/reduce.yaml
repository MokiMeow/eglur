# Suite: tensor/reduce.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: RDX-public-axes-naming-and-reduction-example
  category: axes
  title: public naming and reduction example remains valid
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, ones}

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError]] =
      result {
        let t = ones[f32](2,3).with_names([#0:'mol, #1:'task])?
        let u = reduce{ b c -> b }(t)?
        yield Ok(to_str(u.axis_of('mol)? == #0))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RDX-tensorview-input-reduces-to-owning-tensor
  category: tensor_reduce
  title: TensorView input reduces directly to an owning Tensor
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, Tensor, ones}
    import std::tensor::prim::{permute, sum}

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError]] =
      result {
        let view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let out = sum(view, #1)?
        let schema_out = reduce{ i j -> i }(view)?
        let ok = (is_tensor(out)
          && is_tensor(schema_out)
          && (to_str(out.shape()) == "[3]")
          && (to_str(schema_out.shape()) == "[3]")
          && (to_str(out.dtype()) == "f32"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: RDX-integer-sum-overflow-returns-numericerror
  category: tensor_reduce
  title: integer sum fails at the first overflowing checked left-fold step
  code: |
    import std::tensor::{AxisError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{set_at, IndexItem, ScatterMode}
    import std::tensor::prim::{sum, wrapping_add, wrapping_sub}

    fn left_fold_overflow_input() -> Res[Tensor[i8], Union[DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        let mut thirty_two = ones[i8]()
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        let sixty_four = wrapping_add(thirty_two, thirty_two)?
        let ninety_six = wrapping_add(sixty_four, thirty_two)?
        let minus_thirty_two = wrapping_sub(zeros[i8](), thirty_two)?
        let minus_ninety_six = wrapping_sub(zeros[i8](), ninety_six)?

        // [64, -32, 96, -96] has exact sum 32 but overflows at the third left-fold step.
        let mut x = zeros[i8](4)
        x = set_at(x, [IndexItem::At(0)].to_vec(), sixty_four, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1)].to_vec(), minus_thirty_two, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(2)].to_vec(), ninety_six, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(3)].to_vec(), minus_ninety_six, mode=ScatterMode::Assign)?
        yield Ok(x)
      }

    fn main!() -> Res[Str, Union[AxisError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        _ = sum(left_fold_overflow_input()?, #0)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: sum
        dtype: i8

