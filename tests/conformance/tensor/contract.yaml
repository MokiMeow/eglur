- id: TCT-repeated-label-dimension-mismatch-returns-contract-error
  category: tensor_contract
  title: repeated label dimension mismatch returns ContractError
  code: |
    import std::io::{IoError, args!}
    import std::tensor::{ContractError, ones}

    fn main!() -> Res[Str, Union[IoError, ContractError, DomainError]] =
      result {
        let argc = args!()?.len().to_i64()
        let n = Nat.from_i64(wrapping_add(wrapping_sub(argc, argc), 1))?
        let m = Nat.from_i64(wrapping_add(wrapping_sub(argc, argc), 3))?
        let x = ones[f32](n, m)
        _ = contract{ i i -> }(x)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: ContractError
    value_diagnostics:
    - code: CONTRACT_REPEATED_LABEL_DIM_MISMATCH
      message_contains:
      - contract
      - repeated
      - label
      - mismatch
      data_keys:
      - operation
      - label
      - expected_dim
      - actual_dim
      data_equals:
        operation: contract
        label: i
        expected_dim: 1
        actual_dim: 3

