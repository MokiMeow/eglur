- id: TCT-contract-name-mode-modifier-does-not-leak
  category: tensor_contract
  title: strict-name mode on one schema does not leak to a fresh contract schema
  code: |
    import std::tensor::{AxisError, ContractError, ones}

    fn main!() -> Res[Str, Union[AxisError, ContractError]] =
      result {
        let x1 = ones[f32](2,3).with_names([#0:'a, #1:'k1])?
        let w1 = ones[f32](3,4).with_names([#0:'k2, #1:'b])?
        let strict_op = contract{ a k, k b -> a b }.strict_names()
        let strict_failed = strict_op(x1, w1).is_err()

        let x2 = ones[f32](2,3).with_names([#0:'a, #1:'k1])?
        let w2 = ones[f32](3,4).with_names([#0:'k2, #1:'b])?
        let fresh_op = contract{ a k, k b -> a b }
        let fresh_succeeded = fresh_op(x2, w2).is_ok()

        yield Ok(to_str(strict_failed && fresh_succeeded))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

