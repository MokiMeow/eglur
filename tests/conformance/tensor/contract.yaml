# Suite: tensor/contract.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: TCT-tensorview-operands-materialize-contract-result
  category: tensor_contract
  title: TensorView operands are read directly and contract materializes its result
  code: |
    import std::tensor::{AxisError, ContractError, ShapeError, Tensor, ones}
    import std::tensor::prim::permute

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, ContractError, ShapeError]] =
      result {
        let view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let out = contract{ i j, i j -> }(view, ones[f32](3,2))?
        yield Ok(to_str(is_tensor(out) && (out.rank() == 0)))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: TCT-integer-contract-overflow-returns-numericerror
  category: tensor_contract
  title: mixed-width integer contract fails at the checked promoted-dtype sum step
  code: |
    import std::tensor::{ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{set_at, IndexItem, ScatterMode}
    import std::tensor::prim::{wrapping_add, wrapping_sub}

    fn left_fold_overflow_input() -> Res[Tensor[i8], Union[DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        let mut thirty_two = ones[i8]()
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        let sixty_four = wrapping_add(thirty_two, thirty_two)?
        let ninety_six = wrapping_add(sixty_four, thirty_two)?
        let minus_thirty_two = wrapping_sub(zeros[i8](), thirty_two)?
        let minus_ninety_six = wrapping_sub(zeros[i8](), ninety_six)?

        // [64, -32, 96, -96] has exact sum 32 but overflows at the third left-fold step.
        let mut x = zeros[i8](4)
        x = set_at(x, [IndexItem::At(0)].to_vec(), sixty_four, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1)].to_vec(), minus_thirty_two, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(2)].to_vec(), ninety_six, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(3)].to_vec(), minus_ninety_six, mode=ScatterMode::Assign)?
        yield Ok(x)
      }

    fn main!() -> Res[Str, Union[ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        _ = contract{ i, i -> }(left_fold_overflow_input()?, ones[u8](4))?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: contract
        dtype: i8

