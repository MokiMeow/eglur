- id: TCT-multiple-repeated-label-groups-use-original-axis-positions
  category: tensor_contract
  title: multiple repeated-label groups retain original first positions after remapping
  code: |
    import std::tensor::{ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError, ones, zeros}
    import std::tensor::index::{get_at, set_at, IndexItem, ScatterMode}

    fn main!() -> Res[Str, Union[ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        let one = ones[i32]()
        let mut x = zeros[i32](2,3,2,3)
        x = set_at(x, [IndexItem::At(0), IndexItem::At(1), IndexItem::At(0), IndexItem::At(1)].to_vec(), one, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1), IndexItem::At(2), IndexItem::At(1), IndexItem::At(2)].to_vec(), one, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(0), IndexItem::At(0), IndexItem::At(1), IndexItem::At(0)].to_vec(), one, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1), IndexItem::At(0), IndexItem::At(1), IndexItem::At(1)].to_vec(), one, mode=ScatterMode::Assign)?

        let out = contract{ i j i j -> i j }(x)?
        let first = get_at(out, [IndexItem::At(0), IndexItem::At(1)].to_vec())?.item()?
        let second = get_at(out, [IndexItem::At(1), IndexItem::At(2)].to_vec())?.item()?
        let unequal_i = get_at(out, [IndexItem::At(0), IndexItem::At(0)].to_vec())?.item()?
        let unequal_j = get_at(out, [IndexItem::At(1), IndexItem::At(0)].to_vec())?.item()?
        let ok = ((to_str(out.shape()) == "[2,3]")
          && (first == 1)
          && (second == 1)
          && (unequal_i == 0)
          && (unequal_j == 0))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

