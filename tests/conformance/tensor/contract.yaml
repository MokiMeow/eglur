- id: TCT-unary-contract-with-repeated-labels-is-allowed-trace-style
  category: tensor_contract
  title: unary repeated-label contract selects nonuniform diagonal values
  code: |
    import std::tensor::{ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError, ones, zeros}
    import std::tensor::index::{get_at, set_at, IndexItem, ScatterMode}

    fn main!() -> Res[Str, Union[ContractError, DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        let one = ones[i32]()
        let mut x = zeros[i32](2,2)
        x = set_at(x, [IndexItem::At(0), IndexItem::At(0)].to_vec(), one, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(0), IndexItem::At(1)].to_vec(), one, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1), IndexItem::At(0)].to_vec(), one, mode=ScatterMode::Assign)?

        let retained = contract{ i i -> i }(x)?
        let trace = contract{ i i -> }(x)?
        let first = get_at(retained, [IndexItem::At(0)].to_vec())?.item()?
        let second = get_at(retained, [IndexItem::At(1)].to_vec())?.item()?
        let ok = ((to_str(retained.shape()) == "[2]")
          && (first == 1)
          && (second == 0)
          && (trace.item()? == 1))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

