  category: tensor_contract
  title: contract matmul preset style succeeds for compatible shapes
  code: |
    import std::tensor::{AxisError, ContractError, ones}

    fn main!() -> Res[Str, Union[AxisError, ContractError]] =
      result {
        let x = ones[f32](2,3).with_names([#0:'a, #1:'k])?
        let w = ones[f32](3,4).with_names([#0:'k, #1:'b])?
        let op = contract{ a k, k b -> a b }.strict_names()
        let y = op(x, w)?
        _ = y.axis_of('a)?
        yield Ok("ok")
