- id: TCT-matmul-accepts-later-tensorview-operand-and-returns-owning-tensor
  category: tensor_contract
  title: matmul accepts TensorView in its later operand and returns owning Tensor
  code: |
    import std::tensor::{AxisError, ContractError, ShapeError, Tensor, ones}
    import std::tensor::linalg::matmul
    import std::tensor::prim::permute

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, ContractError, ShapeError]] =
      result {
        let right_view = permute(ones[f32](4,3), [#1, #0].to_vec())?
        let out = matmul(ones[f32](2,3), right_view)?
        let ok = is_tensor(out) && (to_str(out.shape()) == "[2,4]")
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
