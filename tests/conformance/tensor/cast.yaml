- id: CST-typed-dtype-witness-fixes-cast-result-type
  category: tensor_cast
  title: Typed dtype witness fixes the successful cast result type
  code: |
    import std::tensor::{CastError, Tensor, f32, ones}
    import std::tensor::prim::astype

    fn accepts_f32(_x: Tensor[f32]) -> Unit = ()

    fn main!() -> Res[Str, CastError] =
      result {
        let x = ones[i32](1)
        let y = astype(x, f32)?
        accepts_f32(y)
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: CST-mixed-cast-result-branches-do-not-erase-dtype
  category: tensor_cast
  title: Mixed cast result branches do not erase dtype
  code: |
    import std::tensor::{CastError, Tensor, f32, i32}
    import std::tensor::prim::astype

    fn choose(x: Tensor[i32], condition: Bool) -> Res[Tensor[i32], CastError] =
      result {
        let y = if condition { yield astype(x, i32)? } else { yield astype(x, f32)? }
        yield Ok(y)
      }

    fn main!() -> Unit = ()
  expect:
    compile_error:
      code: IF_BRANCH_TYPE_MISMATCH
      message_contains:
      - if
      - branch
      - mismatch
      data_keys:
      - left_type
      - right_type

- id: CST-all-cast-families-read-tensorview-and-return-owning-tensor
  category: tensor_cast
  title: astype bitcast and wrapping_cast read TensorView and return owning Tensor
  code: |
    import std::tensor::{AxisError, CastError, ShapeError, Tensor, f64, i16, i32, ones}
    import std::tensor::prim::{astype, bitcast, permute, wrapping_cast}

    fn is_f64_tensor(_x: Tensor[f64]) -> Bool = true
    fn is_i32_tensor(_x: Tensor[i32]) -> Bool = true
    fn is_i16_tensor(_x: Tensor[i16]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, CastError, ShapeError]] =
      result {
        let float_view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let converted = astype(float_view, f64)?
        let reinterpreted = bitcast(float_view, i32)?
        let integer_view = permute(ones[i32](2,3), [#1, #0].to_vec())?
        let wrapped = wrapping_cast(integer_view, i16)?
        let ok = (is_f64_tensor(converted)
          && is_i32_tensor(reinterpreted)
          && is_i16_tensor(wrapped)
          && (to_str(converted.shape()) == "[3,2]")
          && (to_str(reinterpreted.shape()) == "[3,2]")
          && (to_str(wrapped.shape()) == "[3,2]"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
