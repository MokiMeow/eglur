tests:
- id: CST-tensorview-cast-input-materializes-owning-result
  category: tensor_cast
  title: TensorView cast input materializes an owning Tensor result
  code: |
    import std::tensor::{AxisError, CastError, ShapeError, Tensor, f64, ones}
    import std::tensor::prim::{astype, permute}

    fn is_tensor(_x: Tensor[f64]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, CastError, ShapeError]] =
      result {
        let view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let out = astype(view, f64)?
        let ok = (is_tensor(out)
          && (to_str(out.shape()) == "[3,2]")
          && (to_str(out.dtype()) == "f64"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: CST-forbidden-dtype-pair-fails-with-cast-invalid-dtype-pair-in-const-evaluable-context
  category: tensor_cast
  title: forbidden dtype pair fails with CAST_INVALID_DTYPE_PAIR in const-evaluable context
  code: |
    import std::tensor::{bool, ones}
    import std::tensor::prim::astype

    fn main!() -> Res[Str, Str] =
      result {
        let x = ones[f32](1)
        _ = astype(x, bool)? // @primary forbidden-cast-dtype-pair
        yield Ok("unreachable")
      }
  expect:
    compile_error:
      code: CAST_INVALID_DTYPE_PAIR
      message_contains:
      - cast
      - dtype
      - pair
      data_keys:
      - src_dtype
      - dst_dtype
      primary_span:
        marker: forbidden-cast-dtype-pair

- id: CST-const-evaluable-nan-to-int-cast-fails-with-cast-invalid-value
  category: tensor_cast
  title: const-evaluable NaN to int cast fails with CAST_INVALID_VALUE
  code: |
    import std::tensor::{i32, nan}
    import std::tensor::prim::astype

    fn main!() -> Res[Str, Str] =
      result {
        let x = nan[f32](1)
        _ = astype(x, i32)? // @primary invalid-const-cast-value
        yield Ok("unreachable")
      }
  expect:
    compile_error:
      code: CAST_INVALID_VALUE
      message_contains:
      - cast
      - invalid
      - value
      data_keys:
      - src_dtype
      - dst_dtype
      primary_span:
        marker: invalid-const-cast-value

- id: CST-non-const-evaluable-cast-value-failure-returns-err-channel
  category: tensor_cast
  title: non-const-evaluable cast value failure returns Err channel
  code: |
    import std::tensor::{bool, ones}
    import std::tensor::prim::{add, astype}
    import std::time::now!
    import std::tensor::{CastError, DTypeError, NumericError, ShapeError, Tensor}

    fn make_two!() -> Res[Tensor[i32], Union[ShapeError, DTypeError, NumericError]] =
      result {
        _ = now!()
        let o = ones[i32](1)
        let two = add(o, o)?
        yield Ok(two)
      }

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError, CastError]] =
      result {
        let x = make_two!()?
        _ = astype(x, bool)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: CastError
    value_diagnostics:
    - code: CAST_INVALID_VALUE
      message_contains:
      - cast
      - invalid
      - value
      data_keys:
      - src_dtype
      - dst_dtype
- id: CST-explicit-lossy-narrowing-succeeds-for-representable-values
  category: tensor_cast
  title: explicit lossy narrowing succeeds for representable values
  code: |
    import std::tensor::{CastError, IndexError, ShapeError, i8, ones}
    import std::tensor::prim::astype
    import std::tensor::index::{get_at, IndexItem}

    fn main!() -> Res[Str, Union[CastError, IndexError, ShapeError]] =
      result {
        let x = ones[i16](1)
        let y = astype(x, i8)?
        let s = get_at(y, [IndexItem::At(0)].to_vec())?
        let v = s.item()?
        yield Ok(to_str(v))
      }
  expect:
    value:
      kind: Ok
      repr: '"1"'

- id: CST-explicit-lossy-narrowing-fails-for-out-of-range-values-at-runtime
  category: tensor_cast
  title: explicit lossy narrowing fails for out-of-range values at runtime
  code: |
    import std::tensor::{i8, ones}
    import std::tensor::prim::{add, astype}
    import std::time::now!
    import std::tensor::{CastError, DTypeError, NumericError, ShapeError, Tensor}

    fn make_large!() -> Res[Tensor[i16], Union[ShapeError, DTypeError, NumericError]] =
      result {
        _ = now!()
        let mut x = ones[i16](1)
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?
        x = add(x, x)?      // 256
        yield Ok(x)
      }

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError, CastError]] =
      result {
        let x = make_large!()?
        _ = astype(x, i8)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: CastError
    value_diagnostics:
    - code: CAST_INVALID_VALUE
      message_contains:
      - cast
      - invalid
      - value
      data_keys:
      - src_dtype
      - dst_dtype
