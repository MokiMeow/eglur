# Suite: tensor/movement.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: AX-movement-primitives-return-tensorview-values
  category: axes
  title: movement primitives return TensorView values
  code: |
    import std::tensor::{AxisError, IndexError, ShapeError, TensorView, ones}
    import std::tensor::index::IndexItem
    import std::tensor::prim::{expand, permute, reshape, slice, squeeze, unsqueeze}

    fn is_view(_x: TensorView[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, IndexError, ShapeError]] =
      result {
        let permuted = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let reshaped = reshape(ones[f32](2,3), [6].to_vec())?
        let unsqueezed = unsqueeze(ones[f32](2,3), #0)?
        let squeezed = squeeze(ones[f32](1,3), #0)?
        let expanded = expand(ones[f32](1,3), [2,3].to_vec())?
        let sliced = slice(ones[f32](2,3), [IndexItem::All, IndexItem::Slice(0, 2)].to_vec())?
        let _device = permuted.device()
        let ok = ((permuted.rank() == 2)
          && is_view(permuted)
          && is_view(reshaped)
          && is_view(unsqueezed)
          && is_view(squeezed)
          && is_view(expanded)
          && is_view(sliced))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: AX-movement-affine-mappings-preserve-values-after-explicit-materialization
  category: axes
  title: movement affine mappings preserve values after explicit materialization
  code: |
    import std::tensor::{AxisError, DTypeError, DeterminismError, IndexError, ShapeError, ones, zeros}
    import std::tensor::index::{get_at, set_at, IndexItem, ScatterMode}
    import std::tensor::prim::{expand, permute, reshape, slice, squeeze, unsqueeze}

    fn main!() -> Res[Str, Union[AxisError, DTypeError, DeterminismError, IndexError, ShapeError]] =
      result {
        let matrix = set_at(
          zeros[f32](2,3),
          [IndexItem::At(0), IndexItem::At(1)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign
        )?

        let permuted = permute(matrix, [#1, #0].to_vec())?.materialize()
        let permuted_mark = get_at(permuted, [IndexItem::At(1), IndexItem::At(0)].to_vec())?.item()?

        let reshaped = reshape(matrix, [3,2].to_vec())?.materialize()
        let reshaped_mark = get_at(reshaped, [IndexItem::At(0), IndexItem::At(1)].to_vec())?.item()?

        let unsqueezed = unsqueeze(matrix, #1)?.materialize()
        let unsqueezed_mark = get_at(unsqueezed, [IndexItem::At(0), IndexItem::At(0), IndexItem::At(1)].to_vec())?.item()?

        let cube = set_at(
          zeros[f32](1,2,3),
          [IndexItem::At(0), IndexItem::At(1), IndexItem::At(2)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign
        )?
        let squeezed = squeeze(cube, #0)?.materialize()
        let squeezed_mark = get_at(squeezed, [IndexItem::At(1), IndexItem::At(2)].to_vec())?.item()?

        let row = set_at(
          zeros[f32](1,3),
          [IndexItem::At(0), IndexItem::At(1)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign
        )?
        let expanded = expand(row, [2,3].to_vec())?.materialize()
        let expanded_first = get_at(expanded, [IndexItem::At(0), IndexItem::At(1)].to_vec())?.item()?
        let expanded_second = get_at(expanded, [IndexItem::At(1), IndexItem::At(1)].to_vec())?.item()?

        let vector = set_at(
          zeros[f32](5),
          [IndexItem::At(0)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign
        )?
        let reversed_step = slice(vector, [IndexItem::Slice(None, None, -2)].to_vec())?.materialize()
        let sliced_mark = get_at(reversed_step, [IndexItem::At(2)].to_vec())?.item()?

        let ok = ((permuted_mark == 1.0)
          && (reshaped_mark == 1.0)
          && (unsqueezed_mark == 1.0)
          && (squeezed_mark == 1.0)
          && (expanded_first == 1.0)
          && (expanded_second == 1.0)
          && (sliced_mark == 1.0))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: AX-movement-primitives-chain-over-tensorview-without-materialization
  category: axes
  title: movement primitives chain over TensorView without materialization
  code: |
    import std::tensor::{AxisError, ShapeError, TensorView, ones}
    import std::tensor::prim::{squeeze, unsqueeze}

    fn is_view(_x: TensorView[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, ShapeError]] =
      result {
        let view = unsqueeze(ones[f32](2,3), #0)?
        let restored = squeeze(view, #0)?
        yield Ok(to_str(is_view(restored) && (to_str(restored.shape()) == "[2,3]")))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: AX-permute-remaps-overlay-indices
  category: axes
  title: permute remaps overlay indices
  code: |
    import std::tensor::{AxisError, ShapeError, zeros}
    import std::tensor::prim::permute

    fn main!() -> Res[Str, Union[AxisError, ShapeError]] =
      result {
        let t = zeros[f32](2,3,4).with_names([#0:'B, #1:'T, #2:'C])?
