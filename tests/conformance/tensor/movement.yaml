- id: AX-every-affine-movement-accepts-tensorview-input
  category: axes
  title: every affine movement primitive accepts TensorView input and returns TensorView
  code: |
    import std::tensor::{AxisError, IndexError, NotAView, ShapeError, TensorView, ones}
    import std::tensor::index::IndexItem
    import std::tensor::prim::{expand, permute, reshape, slice, squeeze, unsqueeze}

    fn is_view(_x: TensorView[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, IndexError, NotAView, ShapeError]] =
      result {
        let source = slice(ones[f32](2,3), [IndexItem::All, IndexItem::All].to_vec())?
        let permuted = permute(source, [#1, #0].to_vec())?
        let reshaped = reshape(source, [6].to_vec())?
        let unsqueezed = unsqueeze(source, #0)?
        let squeezed = squeeze(unsqueezed, #0)?
        let expandable = slice(ones[f32](1,3), [IndexItem::All, IndexItem::All].to_vec())?
        let expanded = expand(expandable, [2,3].to_vec())?
        let sliced = slice(source, [IndexItem::All, IndexItem::Slice(0, 2)].to_vec())?
        let ok = (is_view(permuted)
          && is_view(reshaped)
          && is_view(unsqueezed)
          && is_view(squeezed)
          && is_view(expanded)
          && is_view(sliced)
          && (to_str(permuted.shape()) == "[3,2]")
          && (to_str(reshaped.shape()) == "[6]")
          && (to_str(expanded.shape()) == "[2,3]")
          && (to_str(sliced.shape()) == "[2,2]"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
