- id: TGD-source-active-scatter-is-unsupported-even-though-reverse-execution-may-use-scatter-add
  category: tensor_grad
  title: source-active scatter is unsupported even though reverse execution may use scatter add
  code: |
    import std::tensor::{ContractError, DTypeError, DeterminismError, IndexError, ShapeError, Tensor, grad, ones, zeros}
    import std::tensor::index::{set_at, IndexItem, ScatterMode}

    fn f(x: Tensor[f32]) -> Res[Tensor[f32], Union[ContractError, DTypeError, DeterminismError, IndexError, ShapeError]] =
      result {
        let y = set_at(
          x,
          [IndexItem::At(0)].to_vec(),
          zeros[f32](),
          mode=ScatterMode::Assign,
        )?
        let op = contract{ i, i -> }
        yield op(y, y)
      }

    fn main!() -> Res[Str, Str] {
      let g = grad(f)
      _ = g(ones[f32](3))
      yield Ok("x")
    }
  expect:
    compile_error:
      code: GRAD_UNSUPPORTED_PRIMITIVE
      message_contains:
      - grad
      - unsupported
      - primitive
      data_keys: []

