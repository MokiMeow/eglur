- id: TGD-value-and-grad-api-is-available-for-scalar-objective
  category: tensor_grad
  title: value_and_grad API is available for scalar objective
  code: |
    import std::tensor::{ones, value_and_grad}
    import std::tensor::{ContractError, Tensor}

    fn f(x: Tensor[f32]) -> Res[Tensor[f32], ContractError] {
      let op = contract{ i, i -> }
      yield op(x, x)
    }

    fn main!() -> Res[Str, Str] {
      _ = ones[f32](3)
      _ = value_and_grad(f)
      yield Ok("ok")
    }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: TGD-value-and-grad-invocation-returns-primal-and-input-shaped-gradient
  category: tensor_grad
  title: value_and_grad invocation returns primal and input-shaped gradient
  code: |
    import std::tensor::{AxisError, DTypeError, GradError, IndexError, ShapeError, TransformError, MapAxisError, ones, value_and_grad}
    import std::tensor::{ContractError, Tensor}

    fn f(x: Tensor[f32]) -> Res[Tensor[f32], ContractError] {
      let op = contract{ i, i -> }
      yield op(x, x)
    }

    fn main!() -> Res[Tensor[f32], Union[AxisError, ContractError, DTypeError, GradError, IndexError, ShapeError, Str, TransformError, MapAxisError]] =
      result {
        let x = ones[f32](3)
        let vg = value_and_grad(f)
        let (primal, dx) = vg(x)?
        let primal_value = primal.item()?
        let ok = ((primal.rank() == 0)
          && (primal_value == 3.0)
          && (to_str(primal.dtype()) == "f32")
          && (to_str(dx.shape()) == "[3]")
          && (to_str(dx.dtype()) == "f32"))
        yield if ok { yield Ok(dx) } else { yield Err("bad_primal_or_gradient_metadata") }
      }
  expect:
    value:
      kind: Ok
      numeric_compare:
        dtype: f32
        shape: [3]
        expected: [2.0, 2.0, 2.0]
        mode: exact

