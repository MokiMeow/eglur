- id: TGD-passive-bitcast-does-not-poison-an-empty-source-active-graph
  category: tensor_grad
  title: passive bitcast does not poison an empty source-active graph
  code: |
    import std::tensor::{CastError, ContractError, GradError, Tensor, f32, grad, i32, ones}
    import std::tensor::prim::bitcast

    fn f(_x: Tensor[f32], constant: Tensor[f32]) -> Res[Tensor[f32], Union[CastError, ContractError]] =
      result {
        let bits = bitcast(constant, i32)?
        let restored = bitcast(bits, f32)?
        let op = contract{ i, i -> }
        yield op(restored, restored)
      }

    fn main!() -> Res[Tensor[f32], Union[CastError, ContractError, GradError]] =
      result {
        let g = grad(f)
        let dx = g(ones[f32](3), ones[f32](3))?
        yield Ok(dx)
      }
  expect:
    value:
      kind: Ok
      numeric_compare:
        dtype: f32
        shape: [3]
        expected: [0.0, 0.0, 0.0]
        mode: exact

