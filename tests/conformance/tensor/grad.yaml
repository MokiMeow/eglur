- id: TGD-effectful-callback-precedes-argnum-validation
  category: tensor_grad
  title: effectful callback rejection precedes grad argnum validation
  code: |
    import std::tensor::{Tensor, grad}

    fn f!(x: Tensor[f32]) -> Tensor[f32] = x

    fn main!() -> Res[Str, Str] {
      _ = grad(
        f!, // @primary effectful-before-grad-validation
        argnum=2,
      )
      yield Ok("unreachable")
    }
  expect:
    compile_error:
      code: PURE_COMBINATOR_EFFECTFUL_CALLBACK
      message_contains:
      - effectful callback
      data_keys: []
      primary_span:
        marker: effectful-before-grad-validation

