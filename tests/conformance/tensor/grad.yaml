- id: TGD-grad-lowering-fails-for-non-graph-recursive-tensor-program
  category: tensor_grad
  title: grad lowering fails for non-graph recursive tensor program
  code: |
    import std::tensor::{ones, grad}
    import std::tensor::{ContractError, Tensor}

    fn recur(n: i64, x: Tensor[f32]) -> Tensor[f32] {
      yield if n == 0 { yield x } else { yield recur(wrapping_sub(n, 1), x) }
    }

    fn f(x: Tensor[f32]) -> Res[Tensor[f32], ContractError] {
      let y = recur(1, x)
      let op = contract{ i, i -> }
      yield op(y, y)
    }

    fn main!() -> Res[Str, Str] {
      let x = ones[f32](3)
      let g = grad(f)
      _ = g(x)
      yield Ok("x")
    }
  expect:
    compile_error:
      code: GRAD_LOWERING_FAILED
      message_contains:
      - grad
      - lowering
      - failed
      data_keys: []

