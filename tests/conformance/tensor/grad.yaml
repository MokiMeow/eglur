- id: TGD-map_axis-grad-f-preserves-batch-leading-shape-deterministically
  category: tensor_grad
  title: map_axis(grad(f)) preserves batch-leading shape deterministically
  code: |
    import std::tensor::{AxisError, DTypeError, GradError, IndexError, ShapeError, TransformError, MapAxisError, ones, grad, map_axis, axis}
    import std::tensor::{ContractError, Tensor}

    fn f(x: Tensor[f32]) -> Res[Tensor[f32], ContractError] {
      let op = contract{ i, i -> }
      yield op(x, x)
    }

    fn main!() -> Res[Tensor[f32], Union[AxisError, ContractError, DTypeError, GradError, IndexError, ShapeError, Str, TransformError, MapAxisError]] =
      result {
        let x = ones[f32](4,3)
        let g = grad(f)
        let vg = map_axis(g, in_axes=axis(0), out_axis=axis(0))
        let dx = vg(x)?
        yield Ok(dx)
      }
  expect:
