- id: TIX-scatter-directed-expansion-covers-batches-scalars-and-duplicates
  category: tensor_indexing
  title: scatter values directed-expand across batches and duplicate coordinates
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, ShapeError, ones, zeros}
    import std::tensor::index::{get_at, set_at, set_at!, IndexItem, ScatterMode}

    fn main!() -> Res[Str, Union[DTypeError, DeterminismError, IndexError, ShapeError]] =
      result {
        let updated = set_at(
          zeros[f32](2,4,3),
          [IndexItem::All, IndexItem::Take([1, 1])].to_vec(),
          ones[f32](3),
          mode=ScatterMode::Add
        )?
        let duplicate = get_at(
          updated,
          [IndexItem::At(0), IndexItem::At(1), IndexItem::At(2)].to_vec()
        )?.item()?
        let untouched = get_at(
          updated,
          [IndexItem::At(0), IndexItem::At(0), IndexItem::At(2)].to_vec()
        )?.item()?

        let mut filled = zeros[f32](2,3)
        set_at!(
          &mut filled,
          [IndexItem::At(1)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign
        )?
        let first = get_at(
          filled,
          [IndexItem::At(1), IndexItem::At(0)].to_vec()
        )?.item()?
        let last = get_at(
          filled,
          [IndexItem::At(1), IndexItem::At(2)].to_vec()
        )?.item()?
        let ok = ((duplicate == 2.0)
          && (untouched == 0.0)
          && (first == 1.0)
          && (last == 1.0))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

