- id: TIX-get-at-accepts-view-source-and-view-take-coordinates
  category: tensor_indexing
  title: get_at reads a TensorView source and TensorView Take coordinates into an owning Tensor
  code: |
    import std::tensor::{IndexError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{get_at, IndexItem}
    import std::tensor::prim::slice

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[IndexError, ShapeError]] =
      result {
        let source = slice(zeros[f32](4), [IndexItem::All].to_vec())?
        let coordinates = slice(ones[i64](1), [IndexItem::All].to_vec())?
        let gathered = get_at(source, [IndexItem::Take(coordinates)].to_vec())?
