- id: TIX-tensorview-source-values-and-coordinates-are-readable-index-inputs
  category: tensor_indexing
  title: TensorView source values and coordinates are readable indexing inputs
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{get_at, set_at, set_at!, IndexItem, ScatterMode}
    import std::tensor::prim::slice

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[DTypeError, DeterminismError, IndexError, ShapeError]] =
      result {
        let source_view = slice(zeros[f32](4), [IndexItem::All].to_vec())?
        let values_view = slice(ones[f32](1), [IndexItem::All].to_vec())?
        let coordinate_view = slice(ones[i64](1), [IndexItem::All].to_vec())?

        let updated = set_at(
          source_view,
          [IndexItem::Take(coordinate_view)].to_vec(),
          values_view,
          mode=ScatterMode::Assign
        )?
        let pure_value = get_at(updated, [IndexItem::At(1)].to_vec())?.item()?
        let source_value = get_at(source_view, [IndexItem::At(1)].to_vec())?.item()?

        let mut destination = zeros[f32](4)
        set_at!(
          &mut destination,
          [IndexItem::Take(coordinate_view)].to_vec(),
          values_view,
          mode=ScatterMode::Assign
        )?
        let bang_value = get_at(destination, [IndexItem::At(1)].to_vec())?.item()?

        let ok = (is_tensor(updated)
          && (pure_value == 1.0)
          && (source_value == 0.0)
          && (bang_value == 1.0))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

