- id: TIX-set-at-duplicate-indices-aggregate-for-add-max-and-min
  category: tensor_indexing
  title: set_at duplicate indices aggregate for ScatterMode::Add ScatterMode::Max and ScatterMode::Min modes
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, ShapeError, ones, zeros}
    import std::tensor::DeterminismProfile
    import std::tensor::index::{get_at, set_at!, IndexItem, ScatterMode}

    fn main!() -> Res[Str, Union[IndexError, ShapeError, DTypeError, DeterminismError]] =
      result {
        let idx = [1, 1]

        let mut add_x = zeros[f32](4)
        set_at!(&mut add_x, [IndexItem::Take(idx)].to_vec(), ones[f32](2), mode=ScatterMode::Add, profile=DeterminismProfile::Default)?
        let add_v = get_at(add_x, [IndexItem::At(1)].to_vec())?.item()?

        let mut max_x = zeros[f32](4)
        set_at!(&mut max_x, [IndexItem::Take(idx)].to_vec(), ones[f32](2), mode=ScatterMode::Max)?
        let max_v = get_at(max_x, [IndexItem::At(1)].to_vec())?.item()?

        let mut min_x = ones[f32](4)
        set_at!(&mut min_x, [IndexItem::Take(idx)].to_vec(), zeros[f32](2), mode=ScatterMode::Min)?
        let min_v = get_at(min_x, [IndexItem::At(1)].to_vec())?.item()?

        let ok = (add_v == 2.0) && (max_v == 1.0) && (min_v == 0.0)
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: TIX-set-at-add-checks-each-duplicate-update-before-cancellation
  category: tensor_indexing
  title: set_at Add fails at an overflowing duplicate update before a later cancellation
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{set_at, IndexItem, ScatterMode}
    import std::tensor::prim::{wrapping_add, wrapping_sub}

    fn max_i8() -> Res[Tensor[i8], Union[ShapeError, DTypeError]] =
      result {
        let mut x = ones[i8](1)
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        let maximum = wrapping_sub(x, ones[i8](1))?
        yield Ok(maximum)
      }

    fn main!() -> Res[Str, Union[IndexError, ShapeError, DTypeError, DeterminismError, NumericError]] =
      result {
        let minus_one = wrapping_sub(zeros[i8](1), ones[i8](1))?
        let updates = set_at(
          ones[i8](2),
          [IndexItem::Take([1])].to_vec(),
          minus_one,
          mode=ScatterMode::Assign
        )?
        _ = set_at(
          max_i8()?,
          [IndexItem::Take([0,0])].to_vec(),
          updates,
          mode=ScatterMode::Add
        )?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: scatter_add
        dtype: i8

- id: TIX-set-at-bang-add-overflow-rolls-back-earlier-updates
  category: tensor_indexing
  title: set_at! Add overflow rolls back updates completed before the failure
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{get_at, set_at, set_at!, IndexItem, ScatterMode}
    import std::tensor::prim::{wrapping_add, wrapping_sub}

    fn max_i8() -> Res[Tensor[i8], Union[ShapeError, DTypeError]] =
      result {
        let mut x = ones[i8](1)
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        let maximum = wrapping_sub(x, ones[i8](1))?
        yield Ok(maximum)
      }

    fn main!() -> Res[Str, Union[IndexError, ShapeError, DTypeError, DeterminismError, NumericError]] =
      result {
        let mut destination = set_at(
          zeros[i8](2),
          [IndexItem::Take([1])].to_vec(),
          max_i8()?,
          mode=ScatterMode::Assign
        )?
        let alias = destination
        let outcome = set_at!(
          &mut destination,
          [IndexItem::Take([0,1])].to_vec(),
          ones[i8](2),
          mode=ScatterMode::Add
        )
        let failed = match outcome {
          Ok(_) => false,
          Err(_) => true,
        }
        let first = get_at(destination, [IndexItem::At(0)].to_vec())?.item()?
        let second = get_at(destination, [IndexItem::At(1)].to_vec())?.item()?
        let alias_first = get_at(alias, [IndexItem::At(0)].to_vec())?.item()?
        let alias_second = get_at(alias, [IndexItem::At(1)].to_vec())?.item()?
        let receiver_rolled_back = (first == 0) && (second == 127)
        let alias_unchanged = (alias_first == 0) && (alias_second == 127)
        yield Ok(to_str(failed && receiver_rolled_back && alias_unchanged))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

