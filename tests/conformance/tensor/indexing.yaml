# Suite: tensor/indexing.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: TIX-get-at-with-at-removes-named-axis
  category: tensor_indexing
  title: get_at with At removes named axis
  code: |
    import std::tensor::{AxisError, IndexError, ShapeError, zeros}
    import std::tensor::index::{get_at, IndexItem}

    fn main!() -> Res[Str, Union[AxisError, IndexError, ShapeError, Str]] =
      result {
        let x = zeros[f32](2,3).with_names([#0:'batch, #1:'feature])?
        let y = get_at(x, [IndexItem::At(0), IndexItem::All].to_vec())?
        let removed = y.axis_of('batch).is_err()
        yield Ok(to_str(removed))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: TIX-get-at-with-slice-preserves-axis-name-and-position
  category: tensor_indexing
  title: get_at with Slice preserves axis name and position
  code: |
    import std::tensor::{AxisError, IndexError, ShapeError, zeros}
