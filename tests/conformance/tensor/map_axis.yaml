tests:
- id: TMA-map_axis-maps-unary-tensor-function-over-axis-0
  category: tensor_map_axis
  title: map_axis maps unary tensor function over axis(0)
  code: |
    import std::tensor::{AxisError, DTypeError, ShapeError, MapAxisError, ones, map_axis, axis}
    import std::tensor::Tensor

    fn f(x: Tensor[f32]) -> Tensor[f32] = x

    fn main!() -> Res[Str, Union[AxisError, DTypeError, ShapeError, Str, MapAxisError]] =
      result {
        let x = ones[f32](2,3,4)
        let g = map_axis(f, in_axes=axis(0), out_axis=axis(0))
        let y = g(x)?
        yield Ok(to_str(y.rank()))
      }
  expect:
    value:
      kind: Ok
      repr: '"3"'
- id: TMA-map_axis-preserves-mixed-mapped-carriers-and-stacks-tensorview-results
  category: tensor_map_axis
  title: map_axis preserves mixed mapped carriers and stacks TensorView results
  code: |
    import std::tensor::{MapAxisError, Tensor, TensorView, TransformError, axis, map_axis, ones}

    fn select_view(_owned: Tensor[f32], viewed: TensorView[f32]) -> TensorView[f32] = viewed
    fn accepts_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[MapAxisError, TransformError]] =
      result {
        let owned = ones[f32](2,3)
        let viewed = ones[f32](2,3).then(view{ batch feature -> batch feature })?
        let g = map_axis(
          select_view,
          in_axes=[axis(0), axis(0)].to_vec(),
          out_axis=axis(0)
        )
        let y = g(owned, viewed)?
        yield Ok(to_str(y.rank() == 2 && accepts_tensor(y)))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: TMA-map_axis-stacks-res-wrapped-tensorview-results-into-tensor
  category: tensor_map_axis
  title: map_axis stacks Res wrapped TensorView results into Tensor
  code: |
    import std::tensor::{MapAxisError, Tensor, TensorView, TransformError, axis, map_axis, ones}

    fn keep_view(x: TensorView[f32]) -> Res[TensorView[f32], Str] = Ok(x)
    fn accepts_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[MapAxisError, Str, TransformError]] =
      result {
        let viewed = ones[f32](2,3).then(view{ batch feature -> batch feature })?
        let g = map_axis(keep_view, in_axes=axis(0))
        let y = g(viewed)?
        yield Ok(to_str(accepts_tensor(y)))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: TMA-map_axis-stacks-opt-wrapped-tensorview-results-into-tensor
  category: tensor_map_axis
  title: map_axis stacks Opt wrapped TensorView results into Tensor
  code: |
    import std::tensor::{MapAxisError, Tensor, TensorView, TransformError, axis, map_axis, ones}

    fn keep_view(x: TensorView[f32]) -> Opt[TensorView[f32]] = Some(x)
    fn accepts_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[MapAxisError, TransformError]] =
      result {
        let viewed = ones[f32](2,3).then(view{ batch feature -> batch feature })?
        let g = map_axis(keep_view, in_axes=axis(0))
        let maybe_y = g(viewed)?
        let ok = match maybe_y {
          Some(y) => accepts_tensor(y),
          None => false,
        }
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
- id: TMA-map_axis-preserves-unmapped-tensorview-parameters
  category: tensor_map_axis
  title: map_axis preserves unmapped TensorView parameters
  code: |
    import std::tensor::{MapAxisError, Tensor, TensorView, TransformError, axis, map_axis, ones}

    fn select_constant(_mapped: Tensor[f32], constant: TensorView[f32]) -> TensorView[f32] = constant

    fn main!() -> Res[Str, Union[MapAxisError, TransformError]] =
      result {
        let mapped = ones[f32](2,4)
        let constant = ones[f32](3).then(view{ feature -> feature })?
        let g = map_axis(
          select_constant,
          in_axes=[axis(0), None].to_vec()
        )
        let y: Tensor[f32] = g(mapped, constant)?
        yield Ok(to_str(y.shape()))
      }
  expect:
    value:
      kind: Ok
      repr: '"[2,3]"'
- id: TMA-map_axis-removes-mapped-axis-overlay-from-tensorview-steps
  category: tensor_map_axis
  title: map_axis removes mapped axis overlay from TensorView steps
  code: |
    import std::tensor::{AxisError, MapAxisError, TensorView, TransformError, axis, map_axis, ones}

    fn keep_view(x: TensorView[f32]) -> TensorView[f32] = x

    fn main!() -> Res[Str, Union[AxisError, MapAxisError, Str, TransformError]] =
      result {
        let source = ones[f32](2,3,4).with_names([
          #0:'outer,
          #1:'batch,
          #2:'feature
        ])?
        let viewed = source.then(
          view{ outer batch feature -> outer batch feature }
        )?
        let g = map_axis(
          keep_view,
          in_axes=axis(1),
          out_axis=axis(1),
          out_name=Some('mapped)
        )
        let y = g(viewed)?
        let ok = ((y.axis_of('outer)? == #0)
          && (y.axis_of('mapped)? == #1)
          && (y.axis_of('feature)? == #2)
          && y.axis_of('batch).is_err())
        yield if ok { yield Ok("ok") } else { yield Err("bad_axis") }
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
