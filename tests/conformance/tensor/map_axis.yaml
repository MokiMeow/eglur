- id: TMA-map_axis-overlay-equality-ignores-map-insertion-order
  category: tensor_map_axis
  title: map_axis result overlay equality ignores map insertion order
  code: |
    import std::tensor::{AxisError, DTypeError, DeterminismError, ShapeError, ones, zeros, map_axis, axis, MapAxisError}
    import std::tensor::index::{set_at!, IndexItem, ScatterMode}
    import std::tensor::{IndexError, Tensor}

    fn f(x: Tensor[i32]) -> Res[Tensor[i32], Union[AxisError, IndexError]] =
      result {
        let v = x.item()?
        let y = if v == 0 {
          yield ones[i32](2,3).with_names([#0:'row, #1:'col])?
        } else {
          yield ones[i32](2,3).with_names([#1:'col, #0:'row])?
        }
        yield Ok(y)
      }

    fn main!() -> Res[Str, Union[AxisError, DTypeError, DeterminismError, IndexError, ShapeError, Str, MapAxisError]] =
      result {
        let mut x = zeros[i32](2)
        let idx = [1]
        let vals = ones[i32](1)
        set_at!(&mut x, [IndexItem::Take(idx)].to_vec(), vals, mode=ScatterMode::Assign)?
        let g = map_axis(f, in_axes=axis(0), out_axis=axis(0), out_name=Some('batch))
        let y = g(x)?
        let ok = ((y.names().len() == 3)
          && (y.axis_of('batch)? == #0)
          && (y.axis_of('row)? == #1)
          && (y.axis_of('col)? == #2))
        yield if ok { yield Ok("ok") } else { yield Err("bad_axis") }
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'
