- id: TMA-map_axis-reports-result-shape-mismatch-at-first-mismatching-index
  category: tensor_map_axis
  title: map_axis reports result shape mismatch at first mismatching index
  code: |
    import std::tensor::{AxisError, DTypeError, DeterminismError, ShapeError, ones, zeros, map_axis, axis, MapAxisError}
    import std::tensor::index::{set_at!, IndexItem, ScatterMode}
    import std::tensor::{IndexError, Tensor}

    fn f(x: Tensor[i32]) -> Res[Tensor[i32], Union[AxisError, IndexError]] =
      result {
        let v = x.item()?
        let y = if v == 0 {
          yield ones[i32](1).with_names([#0:'feature])?
        } else {
          yield ones[i32](2).with_names([#0:'channel])?
        }
        yield Ok(y)
      }

    fn main!() -> Res[Str, Union[AxisError, DTypeError, DeterminismError, IndexError, ShapeError, MapAxisError]] =
      result {
        let mut x = ones[i32](2)
        let idx = [0]
        let vals = zeros[i32](1)
        set_at!(&mut x, [IndexItem::Take(idx)].to_vec(), vals, mode=ScatterMode::Assign)?
        let g = map_axis(f, in_axes=axis(0))
        _ = g(x)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: MapAxisError
    value_diagnostics:
    - code: MAP_AXIS_RESULT_SHAPE_MISMATCH
      message_contains:
      - shape
      - mismatch
      - index
      data_keys:
      - index
      data_equals:
        index: 1
- id: TMA-map_axis-reports-result-overlay-mismatch-at-first-mismatching-index
  category: tensor_map_axis
  title: map_axis reports result overlay mismatch at first mismatching index
  code: |
    import std::tensor::{AxisError, DTypeError, DeterminismError, ShapeError, ones, zeros, map_axis, axis, MapAxisError}
    import std::tensor::index::{set_at!, IndexItem, ScatterMode}
    import std::tensor::{IndexError, Tensor}

    fn f(x: Tensor[i32]) -> Res[Tensor[i32], Union[AxisError, IndexError]] =
      result {
        let v = x.item()?
        let y = if v == 0 {
          yield ones[i32](2).with_names([#0:'feature])?
        } else {
          yield ones[i32](2).with_names([#0:'channel])?
        }
        yield Ok(y)
      }

    fn main!() -> Res[Str, Union[AxisError, DTypeError, DeterminismError, IndexError, ShapeError, MapAxisError]] =
      result {
