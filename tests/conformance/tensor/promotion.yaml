# Suite: tensor/promotion.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: TPM-bool-plus-bool-promotes-to-u8
  category: tensor_promotion
  title: bool plus bool promotes to u8
  code: |
    import std::tensor::{DTypeError, NumericError, ShapeError, ones}
    import std::tensor::prim::add

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError]] =
      result {
        let a = ones[bool](1)
        let b = ones[bool](1)
        let c = add(a, b)?
        yield Ok(to_str(c.dtype()))
      }
  expect:
    value:
      kind: Ok
      repr: '"u8"'

