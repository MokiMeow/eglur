- id: TPM-implicit-promotion-conversion-overflow-fails-with-int-overflow
  category: tensor_promotion
  title: implicit promotion conversion overflow fails with INT_OVERFLOW
  code: |
    import std::tensor::{DTypeError, NumericError, ShapeError, ones, zeros}
    import std::tensor::prim::{add, wrapping_sub}

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError]] =
      result {
        let i = ones[i8](1)
        let u = wrapping_sub(zeros[u8](1), ones[u8](1))?   // 255
        _ = add(i, u)?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: add
        dtype: i8

- id: TPM-promoted-integer-arithmetic-overflow-fails-after-successful-conversion
  category: tensor_promotion
  title: promoted integer arithmetic overflow fails after both operands convert successfully
  code: |
    import std::tensor::{DTypeError, NumericError, ShapeError, Tensor, ones}
    import std::tensor::prim::{add, wrapping_add, wrapping_sub}

    fn max_i8() -> Res[Tensor[i8], Union[ShapeError, DTypeError]] =
      result {
        let mut x = ones[i8](1)
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        x = wrapping_add(x, x)?
        let maximum = wrapping_sub(x, ones[i8](1))?
        yield Ok(maximum)
      }

    fn main!() -> Res[Str, Union[ShapeError, DTypeError, NumericError]] =
      result {
        _ = add(max_i8()?, ones[u8](1))?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: add
        dtype: i8
