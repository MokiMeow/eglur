- id: ELW-static-incompatible-trailing-dimensions-use-broadcast-shape-mismatch
  category: tensor_elementwise
  title: static incompatible trailing dimensions use BROADCAST_SHAPE_MISMATCH
  code: |
    import std::tensor::ones
    import std::tensor::prim::add

    fn main!() -> Res[Str, Str] =
      result {
        _ = add(ones[f32](2,3), ones[f32](2))?
        yield Ok("unreachable")
      }
  expect:
    compile_error:
      code: BROADCAST_SHAPE_MISMATCH
      message_contains:
      - broadcast
      - shape
      - mismatch
      data_keys:
      - operation

