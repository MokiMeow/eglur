# Suite: tensor/elementwise.yaml
# Harness assumptions:
# - For runtime tests, harness compiles and runs `main!()`.
# - Side effects are captured in order via `std::test::emit!`.
# - Diagnostics use structured code/message/data assertions.

tests:
- id: AX-elementwise-add-uses-shape-first-left-biased-overlay-policy
  category: axes
  title: elementwise add uses shape-first left-biased overlay policy
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, ones}
    import std::tensor::prim::add

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError, Str]] =
      result {
        let a = ones[f32](2,3).with_names([#0:'batch, #1:'feature])?
        let b = ones[f32](2,3).with_names([#0:'x, #1:'y])?
        let c = add(a, b)?
        _ = c.axis_of('batch)?
        yield Ok("ok")
      }
  expect:
    value:
      kind: Ok
      repr: '"ok"'

- id: ELW-exp-and-tanh-preserve-shape-and-dtype
  category: tensor_elementwise
  title: exp and tanh preserve tensor shape and dtype
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, ones}
    import std::tensor::prim::{exp, tanh}

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError, Str]] =
      result {
        let x = ones[f32](2,3)
        let e = exp(x)?
        let y = tanh(e)?
        let ok = (to_str(y.shape()) == "[2,3]") && (to_str(y.dtype()) == "f32")
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

