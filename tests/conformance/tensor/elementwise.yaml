- id: ELW-min-and-where-follow-promotion-and-shape-rules
  category: tensor_elementwise
  title: min and where follow promotion and shape rules
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, ones, zeros}
    import std::tensor::prim::{min, where}

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError, Str]] =
      result {
        let a = ones[i8](2,3)
        let b = ones[u8](2,3)
        let m = min(a, b)?
        let cond = zeros[bool](2,3)
        let x = ones[f16](2,3)
        let y = ones[bf16](2,3)
        let w = where(cond, x, y)?
        let ok = (to_str(m.dtype()) == "i8") && (to_str(w.dtype()) == "bf16") && (to_str(w.shape()) == "[2,3]")
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

