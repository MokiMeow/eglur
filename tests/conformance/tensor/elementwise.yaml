- id: ELW-runtime-incompatible-trailing-dimensions-return-shapeerror
  category: tensor_elementwise
  title: runtime incompatible trailing dimensions return ShapeError
  code: |
    import std::io::{IoError, args!}
    import std::tensor::{DTypeError, NumericError, ShapeError, ones}
    import std::tensor::prim::add

    fn main!() -> Res[Str, Union[DTypeError, DomainError, IoError, NumericError, ShapeError]] =
      result {
        let argc = args!()?.len().to_i64()
        let two = Nat.from_i64(wrapping_add(wrapping_sub(argc, argc), 2))?
        let three = Nat.from_i64(wrapping_add(wrapping_sub(argc, argc), 3))?
        _ = add(ones[f32](two, three), ones[f32](two))?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: ShapeError
    value_diagnostics:
    - code: BROADCAST_SHAPE_MISMATCH
      message_contains:
      - broadcast
      - shape
      - mismatch
      data_keys:
      - operation
