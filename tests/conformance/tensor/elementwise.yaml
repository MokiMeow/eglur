- id: ELW-independent-readable-operands-and-results-preserve-carrier-contract
  category: tensor_elementwise
  title: elementwise families accept TensorView in each readable position and return owning Tensor
  code: |
    import std::tensor::{AxisError, DTypeError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::prim::{add, exp, permute, where, wrapping_add}

    fn is_f32_tensor(_x: Tensor[f32]) -> Bool = true
    fn is_i32_tensor(_x: Tensor[i32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, DTypeError, NumericError, ShapeError]] =
      result {
        let float_view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let condition_view = permute(zeros[bool](2,3), [#1, #0].to_vec())?
        let unary = exp(float_view)?
        let binary_left = add(float_view, ones[f32](3,2))?
        let binary_right = add(ones[f32](3,2), float_view)?
        let conditional = where(condition_view, ones[f32](3,2), float_view)?
        let integer_view = permute(ones[i32](2,3), [#1, #0].to_vec())?
        let wrapping_left = wrapping_add(integer_view, ones[i32](3,2))?
        let wrapping_right = wrapping_add(ones[i32](3,2), integer_view)?
        let ok = (is_f32_tensor(unary)
          && is_f32_tensor(binary_left)
          && is_f32_tensor(binary_right)
          && is_f32_tensor(conditional)
          && is_i32_tensor(wrapping_left)
          && is_i32_tensor(wrapping_right))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: ELW-unary-transcendentals-preserve-every-inexact-dtype
  category: tensor_elementwise
  title: unary transcendentals preserve every inexact dtype
  code: |
    import std::tensor::{DTypeError, Tensor, ones}
    import std::tensor::prim::{exp, log, sqrt, tanh}

    fn is_f16(_x: Tensor[f16]) -> Bool = true
    fn is_bf16(_x: Tensor[bf16]) -> Bool = true
    fn is_f32(_x: Tensor[f32]) -> Bool = true
    fn is_f64(_x: Tensor[f64]) -> Bool = true
    fn is_complex64(_x: Tensor[complex64]) -> Bool = true
    fn is_complex128(_x: Tensor[complex128]) -> Bool = true

    fn main!() -> Res[Str, DTypeError] =
      result {
        let ok = (is_f16(exp(ones[f16](1))?)
          && is_bf16(exp(ones[bf16](1))?)
          && is_f32(exp(ones[f32](1))?)
          && is_f64(exp(ones[f64](1))?)
          && is_complex64(exp(ones[complex64](1))?)
          && is_complex128(exp(ones[complex128](1))?)
          && is_f16(log(ones[f16](1))?)
          && is_bf16(log(ones[bf16](1))?)
          && is_f32(log(ones[f32](1))?)
          && is_f64(log(ones[f64](1))?)
          && is_complex64(log(ones[complex64](1))?)
          && is_complex128(log(ones[complex128](1))?)
          && is_f16(sqrt(ones[f16](1))?)
          && is_bf16(sqrt(ones[bf16](1))?)
          && is_f32(sqrt(ones[f32](1))?)
          && is_f64(sqrt(ones[f64](1))?)
          && is_complex64(sqrt(ones[complex64](1))?)
          && is_complex128(sqrt(ones[complex128](1))?)
          && is_f16(tanh(ones[f16](1))?)
          && is_bf16(tanh(ones[bf16](1))?)
          && is_f32(tanh(ones[f32](1))?)
          && is_f64(tanh(ones[f64](1))?)
          && is_complex64(tanh(ones[complex64](1))?)
          && is_complex128(tanh(ones[complex128](1))?))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: ELW-unary-transcendentals-reject-bool-and-integer-dtypes
  category: tensor_elementwise
  title: unary transcendentals reject Bool and integer dtypes
  code: |
    import std::tensor::{DTypeError, Tensor, ones}
    import std::tensor::prim::{exp, log, sqrt, tanh}

    fn rejects_bool(outcome: Res[Tensor[Bool], DTypeError]) -> Bool = outcome.is_err()
    fn rejects_i32(outcome: Res[Tensor[i32], DTypeError]) -> Bool = outcome.is_err()
    fn rejects_u32(outcome: Res[Tensor[u32], DTypeError]) -> Bool = outcome.is_err()

    fn main!() -> Res[Str, Str] {
      let ok = (rejects_bool(exp(ones[bool](1)))
        && rejects_i32(exp(ones[i32](1)))
        && rejects_u32(exp(ones[u32](1)))
        && rejects_bool(log(ones[bool](1)))
        && rejects_i32(log(ones[i32](1)))
        && rejects_u32(log(ones[u32](1)))
        && rejects_bool(sqrt(ones[bool](1)))
        && rejects_i32(sqrt(ones[i32](1)))
        && rejects_u32(sqrt(ones[u32](1)))
        && rejects_bool(tanh(ones[bool](1)))
        && rejects_i32(tanh(ones[i32](1)))
        && rejects_u32(tanh(ones[u32](1))))
      yield Ok(to_str(ok))
    }
  expect:
    value:
      kind: Ok
      repr: '"true"'
