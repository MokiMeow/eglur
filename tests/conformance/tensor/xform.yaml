- id: XFM-distribution-preserves-one-to-one-physical-axis-name-lineage
  category: tensor_xform
  title: distribution preserves one-to-one physical axis name lineage
  code: |
    import std::tensor::{AxisError, TransformError, zeros}

    fn main!() -> Res[Str, Union[AxisError, TransformError]] =
      result {
        let source = zeros[f32](6).with_names([#0:'packed])?
        let viewed = source.then(
          view{ ((a+b)*c) -> ((a*c)+(b*c)) }
            .with_sizes(["a": 1, "b": 2, "c": 2])
        )?
        let rearranged = source.then(
          rearrange{ (a*(b+c)) -> ((a*b)+(a*c)) }
            .with_sizes(["a": 2, "b": 1, "c": 2])
        )?
        let preserved = ((viewed.names().len() == 1)
          && (viewed.axis_of('packed)? == #0)
          && (rearranged.names().len() == 1)
          && (rearranged.axis_of('packed)? == #0))
        yield Ok(to_str(preserved))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

