- id: XFM-tensorview-snapshot-survives-source-binding-reassignment
  category: tensor_xform
  title: TensorView retained snapshot survives source binding reassignment
  code: |
    import std::tensor::{IndexError, ShapeError, TransformError, ones, zeros}
    import std::tensor::index::{get_at, IndexItem}

    fn main!() -> Res[Str, Union[IndexError, ShapeError, TransformError]] =
      result {
        let mut source = zeros[f32](2,3)
        let retained = source.then(view{ row col -> row col })?
        source = ones[f32](2,3)
        let retained_value = get_at(retained, [IndexItem::At(0), IndexItem::At(0)].to_vec())?.item()?
        let source_value = get_at(source, [IndexItem::At(0), IndexItem::At(0)].to_vec())?.item()?
        yield Ok(to_str((retained_value == 0.0) && (source_value == 1.0)))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: XFM-rearrange-accepts-tensorview-in-later-operand-position
  category: tensor_xform
  title: rearrange assigns an independent readable carrier to a later operand
  code: |
    import std::tensor::{Tensor, TransformError, ones}

    fn is_f32_tensor(_x: Tensor[f32]) -> Bool = true
    fn is_i32_tensor(_x: Tensor[i32]) -> Bool = true

    fn main!() -> Res[Str, TransformError] =
      result {
        let right_view = ones[i32](3).then(view{ j -> j })?
        let (left, right) = rearrange{ i, j -> i, j }(ones[f32](2), right_view)?
        let ok = (is_f32_tensor(left)
          && is_i32_tensor(right)
          && (to_str(left.shape()) == "[2]")
          && (to_str(right.shape()) == "[3]"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: XFM-einop-accepts-later-view-operand-and-materializes-every-output
  category: tensor_xform
  title: einop accepts a later TensorView operand and materializes every tuple output
  code: |
    import std::tensor::{EinopError, Tensor, TransformError, ones}

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[EinopError, TransformError]] =
      result {
        let right_view = ones[f32](3,4).then(view{ k j -> k j })?
        let product = einop{ i k, k j -> i j }(ones[f32](2,3), right_view)?
        let tuple_source = ones[f32](2,3).then(view{ b c -> b c })?
        let (transposed, unchanged) = einop{ b c -> c b, b c }(tuple_source)?
        let ok = (is_tensor(product)
          && is_tensor(transposed)
          && is_tensor(unchanged)
          && (to_str(product.shape()) == "[2,4]")
          && (to_str(transposed.shape()) == "[3,2]")
          && (to_str(unchanged.shape()) == "[2,3]"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
