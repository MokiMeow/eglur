- id: XFM-mixed-sum-product-multi-output-partition-remains-supported
  category: tensor_xform
  title: Mixed sum-product multi-output partition remains supported
  code: |
    import std::tensor::{DTypeError, DeterminismError, IndexError, ShapeError, TransformError, ones, zeros}
    import std::tensor::index::{get_at, set_at, IndexItem, ScatterMode}

    fn main!() -> Res[Str, Union[DTypeError, DeterminismError, IndexError, ShapeError, TransformError]] =
      result {
        let source = set_at(
          zeros[f32](6),
          [IndexItem::At(3)].to_vec(),
          ones[f32](),
          mode=ScatterMode::Assign,
        )?
        let (head, tail) = source.then(
          view{ (c*(a+b)) -> c a, c b }
            .with_sizes(["a": 1, "b": 2, "c": 2])
        )?
        let head_mark = get_at(head, [IndexItem::At(1), IndexItem::At(0)].to_vec())?.item()?
