- id: XFM-tensorview-operand-materializes-einop-result
  category: tensor_xform
  title: TensorView operand is read directly and einop materializes its result
  code: |
    import std::tensor::{AxisError, EinopError, NumericError, ShapeError, Tensor, ones}
    import std::tensor::prim::permute

    fn is_tensor(_x: Tensor[f32]) -> Bool = true

    fn main!() -> Res[Str, Union[AxisError, EinopError, NumericError, ShapeError]] =
      result {
        let view = permute(ones[f32](2,3), [#1, #0].to_vec())?
        let out = einop{ i j -> j i }(view)?
        let ok = is_tensor(out) && (to_str(out.shape()) == "[2,3]")
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: XFM-integer-einop-overflow-returns-numericerror
  category: tensor_xform
  title: mixed-width integer einop fails at the checked promoted-dtype sum step
  code: |
    import std::tensor::{DTypeError, DeterminismError, EinopError, IndexError, NumericError, ShapeError, Tensor, ones, zeros}
    import std::tensor::index::{set_at, IndexItem, ScatterMode}
    import std::tensor::prim::{wrapping_add, wrapping_sub}

    fn left_fold_overflow_input() -> Res[Tensor[i8], Union[DTypeError, DeterminismError, IndexError, NumericError, ShapeError]] =
      result {
        let mut thirty_two = ones[i8]()
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        thirty_two = wrapping_add(thirty_two, thirty_two)?
        let sixty_four = wrapping_add(thirty_two, thirty_two)?
        let ninety_six = wrapping_add(sixty_four, thirty_two)?
        let minus_thirty_two = wrapping_sub(zeros[i8](), thirty_two)?
        let minus_ninety_six = wrapping_sub(zeros[i8](), ninety_six)?

        // [64, -32, 96, -96] has exact sum 32 but overflows at the third left-fold step.
        let mut x = zeros[i8](4)
        x = set_at(x, [IndexItem::At(0)].to_vec(), sixty_four, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(1)].to_vec(), minus_thirty_two, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(2)].to_vec(), ninety_six, mode=ScatterMode::Assign)?
        x = set_at(x, [IndexItem::At(3)].to_vec(), minus_ninety_six, mode=ScatterMode::Assign)?
        yield Ok(x)
      }

    fn main!() -> Res[Str, Union[DTypeError, DeterminismError, EinopError, IndexError, NumericError, ShapeError]] =
      result {
        _ = einop{ i, i -> }(left_fold_overflow_input()?, ones[u8](4))?
        yield Ok("unreachable")
      }
  expect:
    value:
      kind: Err
      repr: NumericError
    value_diagnostics:
    - code: INT_OVERFLOW
      message_contains:
      - int
      - overflow
      data_keys:
      - operation
      - dtype
      data_equals:
        operation: einop
        dtype: i8

- id: XFM-empty-einop-sum-elimination-uses-promoted-additive-identity
  category: tensor_xform
  title: empty einop sum elimination uses promoted additive identity
  code: |
    import std::tensor::{EinopError, IndexError, NumericError, zeros}

    fn main!() -> Res[Str, Union[EinopError, IndexError, NumericError]] =
      result {
        let (scalar, retained_empty) = einop{ batch k, k -> , batch }(zeros[i8](0,0), zeros[u16](0))?
        let ok = ((to_str(scalar.dtype()) == "u16")
          && (scalar.item()? == 0)
          && (to_str(retained_empty.dtype()) == "u16")
          && (to_str(retained_empty.shape()) == "[0]"))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'

- id: XFM-view-with-explicit-sizes-succeeds-for-affine-split
  category: tensor_xform
  title: view with explicit sizes succeeds for affine split
  code: |
    import std::tensor::{AxisError, ContractError, TransformError, ones}

    fn main!() -> Res[Str, Union[AxisError, ContractError, Str, TransformError]] =
      result {
        let x = ones[f32](2,12,3).with_names([#0:'b, #1:'hw, #2:'c])?
        let y = x.then(view{ b (h*w) c -> b h w c }.with_sizes(["h": 3, "w": 4]))?
