- id: XFM-rearrange-types-each-output-from-its-contributors
  category: tensor_xform
  title: rearrange types each output from its contributing input positions
  code: |
    import std::tensor::{Tensor, TransformError, ones}

    fn is_f32_tensor(_x: Tensor[f32]) -> Bool = true
    fn is_i32_tensor(_x: Tensor[i32]) -> Bool = true
    fn merge_same[C: ReadableTensor](left: C, right: C) -> Res[Tensor[C::Elem], TransformError] =
      rearrange{ i, j -> (i+j) }(left, right)

    fn main!() -> Res[Str, TransformError] =
      result {
        let source_view = ones[f32](2).then(view{ i -> i })?
        let split = rearrange{ i, j -> i, j }
        let (left, right) = split(source_view, ones[i32](3))?
        let merged = merge_same(ones[f32](2), ones[f32](3))?
        let (scalar_f, scalar_i) = rearrange{ , -> , }(
          ones[f32](),
          ones[i32](),
        )?
        let ok = (is_f32_tensor(left)
          && is_i32_tensor(right)
          && is_f32_tensor(merged)
          && is_f32_tensor(scalar_f)
          && is_i32_tensor(scalar_i)
          && (to_str(left.shape()) == "[2]")
          && (to_str(right.shape()) == "[3]")
          && (to_str(merged.shape()) == "[5]")
          && (scalar_f.rank() == 0)
          && (scalar_i.rank() == 0))
        yield Ok(to_str(ok))
      }
  expect:
    value:
      kind: Ok
      repr: '"true"'
