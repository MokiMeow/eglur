profiles:
  pure:
    kind: Known
    categories: []
    state_scope: none
  state-localizable:
    kind: Known
    categories:
    - STATE
    state_scope: localizable
  state-nonlocal:
    kind: Known
    categories:
    - STATE
    state_scope: nonlocal
  io:
    kind: Known
    categories:
    - IO
    state_scope: none
  io-state-localizable:
    kind: Known
    categories:
    - IO
    - STATE
    state_scope: localizable
  io-nondet:
    kind: Known
    categories:
    - IO
    - NONDET
    state_scope: none
  nondet:
    kind: Known
    categories:
    - NONDET
    state_scope: none
  state-nonlocal-nondet:
    kind: Known
    categories:
    - STATE
    - NONDET
    state_scope: nonlocal
  unknown:
    kind: Unknown
default_own_summary: pure
callables:
