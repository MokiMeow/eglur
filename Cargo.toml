[workspace]
members = [
    "compiler/crates/eglur-diagnostics",
    "compiler/crates/eglur-driver",
    "compiler/crates/eglur-eval",
    "compiler/crates/eglur-hir",
    "compiler/crates/eglur-sema",
    "compiler/crates/eglur-source",
    "compiler/crates/eglur-syntax",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
